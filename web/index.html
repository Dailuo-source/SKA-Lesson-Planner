<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#C8102E">
<meta name="color-scheme" content="light only">
<title>SKA Lesson Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SKA Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: one-column phone app — red header, scrolling view, fixed bottom tab bar, bottom sheets for details */
:root{
  --red:#C8102E; --red-d:#A00D25; --red-soft:#FDE7EA; --red-tint:#FDF1F2;
  --ink:#111111; --ink2:#3A3A3A; --muted:#5E5E5E; --line:#E2E2E2; --line2:#D6D6D6; --sunk:#F5F5F5; --bg:#FFFFFF;
  --scrim:rgba(0,0,0,.55);
  --f-d:"M PLUS Rounded 1c","Avenir Next",system-ui,sans-serif;
  --f-b:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabh:66px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--red-d)}
:focus-visible{outline:3px solid rgba(200,16,46,.5);outline-offset:2px}
svg{flex:none}

.top{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px 14px}
.top .logo{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:contain;padding:2px;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--f-d);font-weight:800;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:block;font-size:12px;font-weight:700;color:#fff;opacity:.92;background:none;border:0;padding:2px 0;text-align:left;min-height:20px}
.sync.bad{opacity:1;text-decoration:underline}
.me{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--red);border:0;font-weight:800;font-size:15px;flex:none;display:flex;align-items:center;justify-content:center}

main{padding:18px 16px calc(var(--tabh) + 32px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
body.notabs main{padding-bottom:32px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:16px;font-size:12px;font-weight:700;color:var(--ink2);min-height:52px}
.tabs button[aria-current=page]{background:var(--red);color:#fff;font-weight:800}
.tabs svg{width:22px;height:22px}

h1{font-family:var(--f-d);font-weight:800;font-size:26px;line-height:1.2;margin:0}
.kicker{font-size:13px;font-weight:700;color:var(--muted)}
.small{font-size:12.5px;font-weight:700;color:var(--muted)}
.label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:0 0 8px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.mt{margin-top:16px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line2);background:#fff;font-size:15px;font-weight:800;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;position:relative}
.chip.sm{height:44px;font-size:14px;padding:0 14px}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.rchip input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.rchip:has(input:checked){background:var(--red);border-color:var(--red);color:#fff}
.rchip:has(input:focus-visible){outline:3px solid rgba(200,16,46,.5);outline-offset:2px}

.card{background:#fff;border:1.5px solid var(--line);border-radius:20px}
.timecard{padding:16px;display:flex;flex-direction:column;gap:12px}
.big{font-family:var(--f-d);font-size:32px;font-weight:800;line-height:1}
.pill{font-size:13px;font-weight:800;padding:6px 10px;border-radius:12px;background:var(--ink);color:#fff;white-space:nowrap}
.pill.over{background:var(--red)}
.bar{height:12px;border-radius:6px;background:#EFEFEF;display:flex;overflow:hidden;gap:2px}
.bar.thin{height:8px;border-radius:4px}
.bar span{height:100%;display:block}

.section{overflow:hidden}
.shead{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px}
.badge{width:28px;height:28px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
.shead h2{margin:0;font-family:var(--f-d);font-size:16px;font-weight:800;line-height:1.3}
.textbtn{min-height:44px;padding:0 12px;border:0;background:none;border-radius:22px;font-size:13px;font-weight:800;color:var(--ink2)}
.item{padding:10px 8px 12px 16px;border-top:1px solid #ECECEC}
.item .r1{display:flex;align-items:center;gap:8px}
.iname{flex:1;min-width:0;font-size:16px;font-weight:800;overflow-wrap:anywhere;line-height:1.3}
ul.pts{margin:0 8px 6px 0;padding-left:18px;font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
ul.pts li{margin:1px 0}
.points{display:flex;flex-direction:column;gap:8px}
.ptrow{display:flex;align-items:flex-start;gap:6px}
.ptrow .dot{width:14px;text-align:center;font-weight:800;color:var(--red);flex:none;padding-top:12px}
.ptrow .dot.num{width:auto;min-width:24px;text-align:left;font-size:15px;white-space:nowrap}
ol.steps{list-style:none;counter-reset:st;margin:0 8px 6px 0;padding:0;font-size:14px;color:var(--ink2)}
ol.steps li{counter-increment:st;margin:3px 0}
ol.steps li::before{content:counter(st) ". ";font-weight:800;color:var(--ink)}
/* Each point is a box that wraps and grows with its text */
.ptrow textarea.pt{flex:1;min-width:0;height:44px;min-height:44px;padding:10px 14px;line-height:1.4;resize:none;overflow:hidden;overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
details.libref{background:var(--sunk);border-radius:14px;padding:12px 14px;margin:0 0 16px}
details.libref summary{font-size:14px;font-weight:800;cursor:pointer;min-height:24px}
details.libref p{margin:8px 0 6px;font-size:14px;white-space:pre-line;color:var(--ink2)}
details.libref h3{margin:10px 0 4px;font-size:13px;font-weight:800;color:var(--muted)}
.item .r2{display:flex;align-items:center;gap:8px;padding-right:8px}
.meta{flex:1;min-width:0;font-size:12.5px;font-weight:700;line-height:1.35;color:var(--muted)}
.iconbtn{width:44px;height:44px;flex:none;border:0;background:none;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--ink2);text-decoration:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.round{background:var(--sunk);color:var(--ink)}
.iconbtn.outline{border:1.5px solid var(--line);color:var(--ink)}
.stepper{display:flex;align-items:center;background:var(--sunk);border-radius:22px;flex:none}
.stepper button{width:44px;height:44px;border:0;background:none;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.stepper svg{width:18px;height:18px}
.stepper .v{min-width:58px;text-align:center;font-size:16px;font-weight:800}
.addrow{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:12px 16px;border:0;border-top:1px dashed var(--line2);background:none;font-size:14px;font-weight:800;text-align:left}
.addrow svg{width:18px;height:18px}
.dashed{width:100%;min-height:56px;border-radius:20px;border:2px dashed #CFCFCF;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:800;color:var(--ink)}
.dashed svg{width:20px;height:20px;color:var(--red)}

.btn{min-height:52px;border-radius:26px;border:0;padding:0 20px;font-size:16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--red);color:#fff}
.btn.outline{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:#fff;color:var(--red-d);border:1.5px solid #EDB9BF}
.btn.small{min-height:44px;font-size:14px;padding:0 16px;border-radius:22px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.square{border-radius:18px;min-height:56px;font-size:15px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1;padding:0 12px;white-space:nowrap;gap:6px}

.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:24px;border:1.5px solid var(--line2);background:#fff}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;height:44px}
.search svg{width:20px;height:20px;color:var(--muted)}
.excard{display:flex;align-items:center;gap:8px;padding:12px 8px 12px 16px}
.excard .body{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.excard .nm{font-size:16px;font-weight:800;overflow-wrap:anywhere}
.excard .ds{font-size:13px;font-weight:600;color:var(--ink2);white-space:pre-line}
.tagline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted)}
.tag{padding:2px 8px;border-radius:8px;font-size:12px;font-weight:800;display:inline-block}
.tag.dark{background:var(--ink);color:#fff}
.tag.red{background:var(--red);color:#fff}
.tag.creator{background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:4px}
.tag.creator svg{width:12px;height:12px}
/* Creator label tucked into the top-right corner of an exercise */
.cornered{position:relative}
.ctag{position:absolute;top:0;right:0;display:inline-flex;align-items:center;gap:4px;background:var(--ink);color:#fff;font-size:11px;font-weight:800;line-height:1.2;padding:4px 10px 4px 9px;border-radius:0 18px 0 12px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.ctag svg{width:11px;height:11px;flex:none}
.item .ctag{border-radius:0 0 0 10px}
.pickrow .ctag{border-radius:0 14px 0 10px}
.excard.cornered{padding-top:30px}
.item.cornered{padding-top:28px}
.pickrow.cornered{padding-top:26px}

.plan{display:flex;align-items:center;gap:8px;padding:14px 8px 14px 16px}
.plan.next{border-color:var(--red)}
.plan .body{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.plan .t{font-size:17px;font-weight:800;margin-right:2px}
.plan .l{font-size:13px;font-weight:700;color:var(--muted)}
.grouph{font-size:14px;font-weight:800;color:var(--muted);margin:6px 4px 0}
.empty{padding:22px 18px;text-align:center;color:var(--ink2);font-weight:600}
.empty p{margin:0 0 14px}

.field{display:flex;flex-direction:column;gap:8px;margin:0 0 16px;border:0;padding:0;min-width:0}
.field>label,.field>legend{font-size:14px;font-weight:800;padding:0}
.field legend{margin-bottom:8px}
.inp{height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line2);font-size:16px;background:#fff;width:100%;color:var(--ink)}
textarea.inp{height:auto;min-height:72px;padding:12px 14px;resize:vertical;line-height:1.4}
select.inp{appearance:auto}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line2);cursor:pointer}
.opt:has(input:checked){border:2px solid var(--red);background:var(--red-tint)}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--red);flex:none}
.opt b{display:block;font-size:15px}
.opt span span{font-size:13px;font-weight:600;color:var(--muted)}
.switch{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 14px;border-radius:14px;border:1.5px solid var(--line2);background:#fff;text-align:left;color:var(--ink)}
.switch .trk{width:52px;height:32px;flex:none;border-radius:16px;padding:3px;display:flex;background:#9A9A9A;transition:background .15s}
.switch .trk i{width:26px;height:26px;border-radius:13px;background:#fff;transition:transform .15s}
.switch[aria-pressed=true] .trk{background:var(--red)}
.switch[aria-pressed=true] .trk i{transform:translateX(20px)}
.preview{border-radius:18px;background:var(--sunk);padding:14px 16px}
.preview .nm{font-family:var(--f-d);font-size:22px;font-weight:800;color:var(--red)}
.avatar{width:64px;height:64px;flex:none;border-radius:32px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-d);font-weight:800;font-size:24px}

.sheetwrap{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim);border:0;width:100%;padding:0}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet.center{bottom:auto;top:50%;transform:translateY(-50%);left:20px;right:20px;border-radius:24px;padding:24px 20px 20px;text-align:center;max-width:420px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sh{display:flex;align-items:flex-start;gap:8px;margin-bottom:14px}
.sh h2{margin:0;font-family:var(--f-d);font-size:22px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.ring{width:56px;height:56px;border-radius:28px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.ring svg{width:28px;height:28px}
.center h2{margin:0 0 8px;font-family:var(--f-d);font-size:22px;font-weight:800}
.center p{margin:0 0 18px;font-size:15px;font-weight:600;color:var(--ink2);line-height:1.45}
.minbig{display:flex;align-items:center;gap:12px}
.minbig button{width:52px;height:52px;border-radius:26px;border:0;background:var(--sunk);display:flex;align-items:center;justify-content:center}
.minbig button svg{width:22px;height:22px}
.minbig input{flex:1;min-width:0;text-align:center;font-family:var(--f-d);font-size:34px;font-weight:800;border:0;border-bottom:2px solid var(--line2);height:56px;background:none;border-radius:0}
.minbig .unit{font-size:16px;font-weight:700;color:var(--muted)}
.qgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pickrow{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:10px 12px;border:1.5px solid var(--line);border-radius:16px;background:#fff;text-align:left;margin-bottom:8px;color:var(--ink)}
.pickrow .nm{flex:1;min-width:0;font-size:15px;font-weight:800;overflow-wrap:anywhere}
.pickrow .m{font-size:14px;font-weight:800}
.pickrow>svg{width:20px;height:20px;color:var(--ink2)}
.segtabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--sunk);border-radius:22px;padding:4px;margin:0 0 12px}
.segtabs button{height:44px;border:0;border-radius:18px;background:transparent;font-size:15px;font-weight:800;color:var(--ink2)}
.kmeta{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink2);margin-top:3px}
.kdot{width:12px;height:12px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28);flex:none;display:inline-block}
.kcat{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 6px;font-family:var(--f-d);font-size:16px;font-weight:800;color:var(--ink)}
.kcat:first-child{margin-top:4px}
.kcount{font-size:12.5px;font-weight:800;color:var(--ink2);background:#F1F1F1;border-radius:10px;padding:2px 9px}
.kbelt{display:flex;align-items:center;gap:7px;margin:8px 4px 6px;font-size:13px;font-weight:800;color:var(--ink2)}
.kbelts .kdot{margin-right:6px}
.kneed{display:block;font-size:13px;font-weight:800;color:#8E0B21;margin-top:2px}
.kupd{padding:16px;border:2px solid var(--red);background:var(--red-tint)}
.kupd h2{margin:0 0 2px;font-family:var(--f-d);font-size:18px;font-weight:800}
.kgo{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;margin-top:10px;padding:6px 14px;border:0;border-radius:16px;background:var(--red);color:#fff;text-align:left}
.kgo b{display:block;font-size:16px;font-weight:800}
.kgo .grow>span{display:block;font-size:12.5px;font-weight:700;color:#FFE3E7}
.kgo svg{width:20px;height:20px}
.pickrow .ok{font-size:12px;font-weight:800;color:#0F5E54;background:#DDF3EF;padding:2px 8px;border-radius:8px}
.menu .btn{margin-bottom:10px}
.msg{min-height:20px;font-size:13px;font-weight:700;color:var(--muted);margin:8px 0 0}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom));z-index:60;background:#111;color:#fff;border-radius:16px;padding:10px 8px 10px 16px;display:flex;align-items:center;gap:8px;font-weight:700;max-width:600px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.2)}
body.notabs .toast{bottom:calc(16px + env(safe-area-inset-bottom))}
.toast span{flex:1}
.toast button{background:none;border:0;color:#FF9AA8;font-weight:800;min-height:40px;padding:0 10px}
.connect{max-width:460px;margin:0 auto}
.editbanner{display:flex;align-items:center;gap:8px;background:var(--red-tint);border:1.5px solid #F2C9CF;color:var(--red-d);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700}
.editbanner svg{width:18px;height:18px}
.savebar{position:sticky;bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom));z-index:5;padding-top:6px}
.savebar .btn{box-shadow:0 6px 18px rgba(200,16,46,.3)}
.vsec{display:flex;flex-direction:column;gap:10px}
.vsec-h{display:flex;align-items:center;gap:10px;border-bottom:3px solid;padding:4px 2px 8px}
.vsec-h h2{margin:0;font-family:var(--f-d);font-size:18px;font-weight:800}
.vex{padding:14px 16px 12px}
.vex.cornered{padding-top:30px}
.vex-top{display:flex;align-items:center;gap:10px}
.vex-top h3{margin:0;flex:1;min-width:0;font-size:18px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.vtime{font-size:13px;font-weight:800;padding:3px 8px;border-radius:8px;flex:none}
.vmin{font-size:15px;font-weight:800;flex:none}
.vlabel{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 4px}
ol.vsteps{font-size:16px;line-height:1.45;color:var(--ink)}
ol.vsteps li{margin:6px 0}
ul.vpts{font-size:15px;line-height:1.45;color:var(--ink2);margin-bottom:0}
ul.vpts.mine{color:var(--red-d)}
.qnlist{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:4px}
.qnlist li{display:flex;align-items:center;gap:8px;background:#FFF7E0;border-radius:10px;padding:2px 2px 2px 10px;font-size:15px;overflow-wrap:anywhere}
.qtime{font-size:12px;font-weight:800;color:#7A5A00;flex:none}
.qform{display:flex;gap:8px;align-items:center}
.qform .inp{height:44px;flex:1;min-width:0}
.qnlist li .qacts{flex-basis:100%;display:flex;gap:6px;padding:0 0 4px}
.qnlist li.wrap{flex-wrap:wrap}

/* ---------- Tap feedback (every button) ---------- */

.stuh{min-height:38px}
/* Plans calendar */
.slotsbtn{min-height:38px}
.caltools{gap:8px}
.seg button{height:34px}
.caltitle{font-size:16px}
.calweek{gap:10px}
.calday{gap:5px}
.cd-head{font-size:15.5px}
.ccard{min-height:50px;padding:7px 12px;gap:10px;border-width:1px;border-radius:12px}
.cc-time{flex-basis:70px}
.cc-time b{font-size:17px}
.cc-type{font-size:14.5px}
.cc-pill{padding:3px 9px}
.mcell{height:44px;gap:2px;padding:3px 0}
.mnum{width:24px;height:24px;font-size:13px}
.allplans summary{min-height:38px;padding:6px 4px}
.phead h1{font-size:22px}
/* Notifications panel */
.nson{display:flex;align-items:center;gap:8px;background:#E9F6F1;border-radius:12px;padding:4px 4px 4px 12px;font-size:14px;font-weight:800;color:#0F5E54}
.nson>svg{width:18px;height:18px}
.nson .textbtn{color:#0F5E54;padding:0 8px}
.nson.off{flex-direction:column;align-items:stretch;background:var(--red-tint);color:var(--ink);padding:10px 12px;gap:8px;font-weight:700}
.nskind{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.nshead{display:flex;align-items:center;gap:10px}
.nshead b{display:block;font-size:15px}
.nshead .small{display:block;font-weight:600}
.nssw{width:52px;height:32px;flex:none;border:0;border-radius:16px;padding:3px;display:flex;background:#9A9A9A}
.nssw i{width:26px;height:26px;border-radius:13px;background:#fff;transition:transform .15s}
.nssw[aria-pressed=true]{background:var(--red)}
.nssw[aria-pressed=true] i{transform:translateX(20px)}
.nscust{background:var(--sunk);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.nsrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;font-weight:700}
.nsrow .inp{width:58px;height:38px;text-align:center;padding:0 6px}
.nsrow .inp.nstime{width:auto;min-width:120px;text-align:left}
.nscust .small{color:var(--ink2)}
/* Plan switcher and bold class date */
.phd{display:flex;align-items:center;gap:6px}
.phd .pnav{width:34px;height:44px;border-radius:12px;flex:none}
.phd .pnav:disabled{opacity:.3}
.pswrap{position:relative}
.psw{width:100%;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:5px 8px 5px 10px;text-align:left;color:var(--ink)}
.psw .kicker{display:block;font-size:14px;font-weight:800;color:var(--ink)}
.psw h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psw .small{display:block}
.psw>svg{width:18px;height:18px;color:var(--ink2);transition:transform .15s}
.psw[aria-expanded=true]>svg{transform:rotate(180deg)}
.pllist{position:absolute;top:calc(100% + 6px);left:-40px;right:-84px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.18);padding:6px;max-height:60vh;overflow:auto}
.plchips{display:flex;gap:6px;flex-wrap:wrap;padding:2px 2px 6px}
.plchips .chip{height:32px;font-size:13px}
.plgh{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:6px 6px 2px}
.plrow{width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:10px;background:#fff;padding:6px 8px;min-height:44px;text-align:left;color:var(--ink)}
.plrow.on{background:var(--red-tint)}
.plrow .pld{flex:0 0 84px;font-size:13px;font-weight:800}
.plrow b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plrow .grow>span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.plrow>svg{width:18px;height:18px;color:var(--red)}

/* ---------- Teaching mode (Gary, Nov 5): check off where you are, fold sections, clock time per exercise, carry notes to next week ---------- */
.tbar{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border:1px solid #F2C4CB;background:var(--red-tint);border-radius:16px;text-align:left;color:var(--ink);min-height:50px}
.tbar b{display:block;font-size:14px;font-weight:800;color:var(--red-d)}
.tbar .small{display:block}
.vsec-h.tg{width:100%;background:none;border-top:0;border-left:0;border-right:0;border-bottom-style:solid;min-height:44px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.vsec-h.tg>svg{width:18px;height:18px;color:var(--ink2);flex:none}
.vsec-h .sm{margin-left:auto;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.tchk{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;flex:none;margin:-8px -8px -8px 0;border-radius:22px}
.tchk i{width:26px;height:26px;border-radius:13px;border:1.5px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center}
.tchk i svg{width:16px;height:16px;color:#fff}
.tchk[aria-pressed=true] i{background:var(--red);border-color:var(--red)}
.vex.now .tchk i{border-color:var(--red)}
.vex.now{border-color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.vex.done h3{text-decoration:line-through;color:var(--muted)}
.vex.done{background:#FAFAFA}
.nowtag{font-size:11px;font-weight:800;color:var(--red-d);display:block;margin-top:1px;text-decoration:none}
.carry{min-height:34px;margin-top:4px;border:1px solid var(--line2);background:#fff;border-radius:17px;padding:0 10px;font-size:12.5px;font-weight:800;color:var(--ink2);display:inline-flex;align-items:center;gap:4px;flex:none;white-space:nowrap}
.carry svg{width:14px;height:14px}
.carry[aria-pressed=true]{background:var(--red-tint);border-color:var(--red);color:var(--red-d)}
.nbhd{display:flex;align-items:center;gap:8px}
.nbhd h2{flex:1;min-width:0}
.cnhead{font-size:13px;font-weight:800;color:var(--ink2);margin:12px 0 0}
.cnq{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid #ECECEC}
.cnq .grow{min-width:0}
.cnq .nm{font-size:12px;font-weight:700;color:var(--muted)}

/* ---------- Nov 21: collapsing, skipping, belt groups, students ---------- */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ttg{display:flex;align-items:center;gap:6px;flex:1;min-width:0;border:0;background:none;padding:4px 0;text-align:left;color:var(--ink);font:inherit;min-height:36px}
.ttg>svg{width:16px;height:16px;color:var(--ink2);flex:none}
.ttg .nm{flex:1;min-width:0;font-size:15px;font-weight:800;line-height:1.25;overflow-wrap:anywhere;color:var(--ink);display:block}
.ttg h2{margin:0;font-family:var(--f-d);font-size:16px;font-weight:800}
.qnb{font-size:11px;font-weight:800;padding:1px 7px;border-radius:9px;background:#FFF7E0;color:#7A5A00;white-space:nowrap;flex:none}
.cnt{font-size:12px;font-weight:800;color:var(--muted)}
.chd{display:flex;align-items:center;gap:6px}
.foldrow{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
.foldrow .chip.sm{height:30px;padding:0 10px;font-size:12px}
.studstrip{display:flex;align-items:center;gap:8px;width:100%;min-height:42px;padding:4px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;color:var(--ink);font-size:13.5px}
.studstrip>svg{width:18px;height:18px;color:var(--ink2);flex:none}
.studstrip .m{color:var(--muted);font-weight:700}
.sgs{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sgs.wrap{justify-content:flex-start;margin-top:6px}
.sg{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink2)}
.sg .kdot{width:10px;height:10px}
.tcard{padding:4px 6px 4px 8px}
.tcard .vex-top{gap:4px}
.tcard .ttg .vtime{font-size:12px;padding:2px 6px}
.tcard .vmin{font-size:13px}
.tcard .nowtag{margin:2px 0 0 22px}
.tcard .tchk{margin:-4px -4px -4px 0}
.tskip{width:36px;height:36px;flex:none;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.tskip svg{width:16px;height:16px}
.tbody{padding:0 4px 4px 22px}
.tbody ol.vsteps{margin:2px 0 0}
.tline{display:flex;align-items:center;gap:8px;min-height:40px;padding:2px 4px 2px 10px;border:1px solid var(--line);border-radius:12px;background:#FAFAFA;color:var(--muted)}
.tline .nm{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;color:var(--muted)}
.tline .vtime{font-size:12px;padding:0}
.tline .vmin{font-size:13px}
.tline .tchk{margin:-4px -4px -4px 0}
.tline.done .nm{text-decoration:line-through}
.tline.skipped{border-style:dashed;background:#fff}
.tline.skipped .nm{text-decoration:line-through}
.tline .btn.small{min-height:32px;padding:0 10px}
.sktag{font-size:11px;font-weight:800;padding:1px 7px;border-radius:7px;background:#EDEDED;color:var(--ink);flex:none}
.notebtn{--c:var(--red);min-height:32px;padding:0 10px;border-radius:16px;border:1px solid var(--c);background:#fff;color:var(--c);font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;gap:3px;flex:none}
.notebtn svg{width:14px;height:14px}
.notebtn.grey{border-color:var(--line2);color:var(--ink)}
.tbody .notebtn{margin-top:4px}
.iconbtn.round.red{background:var(--red);color:#fff;border:0}
.lanehd{--c:var(--ink);display:flex;align-items:center;gap:5px;width:100%;min-height:34px;padding:3px 8px;border:0;border-radius:9px;font-size:12.5px;font-weight:800;color:var(--c);text-align:left}
.lanehd>svg{width:15px;height:15px;flex:none}
.lanehd .kdot{width:10px;height:10px}
.lanehd .sm{font-size:12px;font-weight:800;color:var(--ink2)}
.savebar.two{display:flex;gap:8px}
.savebar.two .btn{flex:1;padding:0 8px;white-space:nowrap;font-size:14.5px;gap:5px}
.savebar.two .btn.outline{background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.rrow{padding:2px 0 2px 2px;border-bottom:1px solid #F0F0F0}
.rrow.sk .nm{text-decoration:line-through;color:var(--muted)}
.rtop{display:flex;align-items:center;gap:6px}
.skrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #ECECEC}
.skrow .small{display:block}
.skrow .btn.small{min-height:32px;padding:0 10px;font-size:12.5px}
.dashedc{border-style:dashed}
.gbox{border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden}
.gbh{display:flex;align-items:center;gap:6px;padding:2px 6px 2px 8px;background:#F7F7F7}
.gbh .ttg .nm{font-size:13.5px}
.gbh .chip.sm{height:30px;padding:0 10px;font-size:12px}
.gbody{padding:6px 8px}
.nbline{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.nbline .label{margin:0}
.nbc{font-size:12px;font-weight:800;color:#5B3FA8;white-space:nowrap}
.awayt{margin-top:6px;font-size:12.5px;color:var(--ink2);font-weight:800}
.herechip{--c:#111}
.herechip.away{text-decoration:line-through;color:var(--muted);border-style:dashed}
.herechip svg{width:14px;height:14px}
.pchip svg{width:14px;height:14px}
.csum{padding:8px 12px}
.csum .big{font-size:24px}
.beltbar{display:flex;height:10px;border-radius:5px;overflow:hidden;border:1px solid var(--line2);margin-top:6px}
.csrow{display:flex;align-items:center;gap:8px;min-height:38px;border-bottom:1px solid #F3F3F3}
.csrow .iconbtn{width:34px;height:34px}
.bgsw{--c:var(--red);flex:none;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 4px 0 9px;border:1px solid var(--line2);border-radius:16px;background:#fff;font-size:11.5px;font-weight:800;color:var(--ink2)}
.bgsw i{width:30px;height:18px;border-radius:9px;background:#CFCFCF;position:relative;transition:background .3s}
.bgsw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .3s}
.bgsw[aria-checked=true]{border-color:var(--c)}
.bgsw[aria-checked=true] i{background:var(--c)}
.bgsw[aria-checked=true] i::after{left:14px}
.shead .ttg h2{margin:0}
.shead.ewrap{flex-wrap:wrap;row-gap:0;padding-bottom:4px}
.shmeta{flex-basis:100%;display:flex;align-items:center;gap:8px;padding:0 4px 0 52px}
.shmeta .bgsw{min-height:28px}
.shead .ttg .badge{flex:none}
.item.ecomp{padding:2px 4px 2px 8px}
.item.ecomp.cornered{padding-top:22px}
.item.ecomp .r1{display:flex;align-items:center;gap:4px}
.item.ecomp .stepper button{width:34px;height:34px}
.item.ecomp .stepper .v{min-width:46px;font-size:13.5px}
.item.ecomp .tbody .meta{font-size:12px;font-weight:700;color:var(--muted)}
.elane{border-left:3px solid var(--c);margin:4px 8px 4px 10px;padding-left:4px}
.lanehint{margin:4px 12px 0}
.mixc{padding:4px 10px 8px}
.grow-row{padding:8px 10px}
/* Nov 23: groups per exercise, drag to reorder */
.dragh{flex:none;width:30px;height:44px;margin-left:-6px;border:0;background:none;color:#8A8A8A;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;padding:0}
.dragh svg{width:18px;height:18px}
.item.ecomp{position:relative;background:#fff}
.item.ecomp.dragging{z-index:20;box-shadow:0 10px 28px rgba(0,0,0,.22);border-radius:12px;transition:none!important;cursor:grabbing}
.item.ecomp .r1 .ttg{min-height:28px;padding:2px 0 0}
.gchip{display:inline-flex;align-items:center;gap:4px;min-height:26px;margin:1px 0 2px;padding:0 8px;border:1px dashed var(--line2);border-radius:13px;background:#fff;font-size:12px;font-weight:800;color:var(--muted)}
.gchip svg{width:13px;height:13px}
.gchip .kdot{width:9px;height:9px}
.gchip.on{border-style:solid;color:var(--ink);background:#F5F5F5}
.eblockl{margin:6px 12px 0;padding:2px 8px;border-left:3px solid var(--c);font-size:11.5px;font-weight:800;color:var(--c)}
.tblock{border-left:3px solid var(--c);padding-left:6px;margin-top:6px}
.tblock-h{font-size:11.5px;font-weight:800;color:var(--c);margin:0 0 2px}
.tblock .lanehd{margin-top:4px}
.lane{display:block}
.segtabs.sm{margin:6px 0 0}
.segtabs.sm button{height:34px;font-size:13px;border-radius:14px}
.csfind{padding:8px 10px;margin-top:6px;border-color:var(--red)}
/* Keyboard (Gary, Nov 23): panels stay above it, and a search box scrolls to the top with its names below */
.sheet:not(.center){max-height:min(92dvh,calc(100% - 16px))}
.sheet.finding{padding-bottom:70vh}
.grow-row .chip.sm{height:32px;padding:0 10px;font-size:13px}

/* ---------- Nov 27: groups per class, same-time blocks, class teams, Manage access ---------- */
.gsw{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.gstack{display:inline-flex;gap:2px;flex:none}
.secfoot{display:grid;grid-template-columns:1fr 1fr}
.secfoot .addrow+.addrow{border-left:1px dashed var(--line2)}
.eblock{margin:6px 8px 8px;border:2px solid var(--c);border-radius:12px;overflow:hidden;background:#fff}
.eblock-h{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 9px;background:var(--c);color:#fff;font-size:13px}
.eblock-h svg{width:16px;height:16px}
.bsplit{min-height:30px;padding:0 10px;border-radius:15px;border:1px solid rgba(255,255,255,.75);background:transparent;color:#fff;font-size:12px;font-weight:800}
.blane{margin:6px 6px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.blane-h{display:flex;align-items:center;gap:6px;padding:3px 4px 3px 6px;background:color-mix(in srgb,var(--g) 12%,#fff)}
.blane-h .gchip{margin:0;border-color:var(--g)}
.blane-h .iconbtn{width:34px;height:34px}
.blane .item{border-top:1px solid #F0F0F0}
.addrow.sm{min-height:36px;padding:6px 10px;font-size:12.5px;border-top:1px dashed #EAEAEA}
.addrow.lanebtn{justify-content:center;margin:6px 6px 6px;width:calc(100% - 12px);border:1px dashed var(--c);border-radius:18px;min-height:38px;font-size:13px}
.lrows{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:9px;min-height:52px;padding:5px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;color:var(--ink)}
.lrow[aria-pressed=true]{border:2px solid var(--ink);background:#FAFAFA}
.lrow .small{display:block;font-weight:700}
.gnum{width:28px;height:28px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.gnum.all{background:var(--sunk);color:var(--ink)}
.gnum svg{width:16px;height:16px}
.lradio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;color:transparent}
.lrow[aria-pressed=true] .lradio{background:var(--red);border-color:var(--red);color:#fff}
.lradio svg{width:14px;height:14px}
.gcard{border:1px solid var(--line);border-radius:12px;margin-top:8px;overflow:hidden}
.gcard-h{display:flex;align-items:center;gap:9px;width:100%;min-height:48px;padding:6px 10px;border:0;background:#fff;text-align:left;color:var(--ink)}
.gcard-h .small{display:block;font-weight:700}
.gcard-h>svg{width:16px;height:16px;color:var(--muted)}
.gnames{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 8px}
.gname{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px 0 6px;border-radius:12px;background:#F3F3F3;font-size:12px;font-weight:700}
.gloose{margin-top:8px;border:1px dashed var(--line2);border-radius:12px;padding:7px 10px}
.gloose .small{display:block}
.swrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.swb{width:34px;height:34px;border-radius:10px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line2)}
.swb[aria-pressed=true]{border-color:var(--ink);box-shadow:none}
.gprev{margin-top:10px;border-radius:10px;background:var(--sunk);padding:7px 10px;font-size:12.5px;font-weight:700}
.confirm{margin-top:8px;border:1px solid var(--red);border-radius:12px;padding:9px 10px;background:#FFF5F6}
.confirm .small{margin:2px 0 8px}
.teamrow{display:flex;align-items:center;gap:9px;min-height:46px;padding:4px 0;border-bottom:1px solid #F0F0F0}
.teamrow .small{display:block;font-weight:700}
.teamrow>svg{width:18px;height:18px;color:var(--ink2);flex:none}
.teamrow .btn.small{min-height:34px;padding:0 10px;font-size:12.5px}
.teamrow.past{opacity:.75}
.askbox{margin-top:8px;border:1px solid #E0A100;background:#FFF8E1;border-radius:12px;padding:7px 10px}
.ava{width:34px;height:34px;border-radius:50%;color:#fff;font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pchip .ava{width:22px;height:22px;font-size:10px;margin-left:-6px}
.pickrow .ava{width:38px;height:38px;font-size:14px}
.rolepill{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:9px;background:var(--sunk);color:var(--ink2);font-size:11px;font-weight:800;vertical-align:1px}
.rolepill.on{background:var(--red);color:#fff}
.segtabs.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.accslot{padding:8px 10px;margin-top:8px}
.pchip.on{background:#111;border-color:#111;color:#fff}
.pchip.add{border-style:dashed}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tiles div{border:1px solid var(--line);border-radius:12px;padding:6px 9px}
.tiles b{display:block;font-size:20px;line-height:1.2}
.tiles span{font-size:11.5px;font-weight:700;color:var(--muted)}
.codeval{font-size:16px;letter-spacing:.06em}
.studstrip.taught .m{font-weight:700}
.studstrip:disabled{opacity:1}
.viewonly .notebtn{margin-left:auto}
.pchip .small{color:inherit;opacity:.85;font-weight:700}
.linkbtn svg{width:16px;height:16px;flex:none}
/* ---------- big screens (Gary, Oct 20): tabs in the red bar, wider pages, panels slide in from the right ---------- */
@media (min-width:1000px){
  main{max-width:none;padding:18px 28px 32px}
  .plansview .btnrow{max-width:480px}
  .tabs{top:0;bottom:auto;left:50%;right:auto;transform:translateX(-50%);height:62px;padding:0;background:transparent;border:0;display:flex;gap:6px;align-items:center;z-index:21}
  .tabs button{flex-direction:row;gap:8px;min-height:44px;padding:0 16px;color:#fff;font-size:15px;border-radius:12px}
  .tabs button:hover:not([aria-current=page]){background:rgba(255,255,255,.14)}
  .tabs button[aria-current=page]{background:#fff;color:var(--red)}
  .tabs svg{width:20px;height:20px}
  .toast{bottom:28px}
  .caltools{flex-direction:row;align-items:center;gap:18px}
  .seg{width:220px;flex:none}
  .calnav{flex:1;justify-content:flex-start}
  .caltitle{flex:none;min-width:200px}
  .daychips{margin:0;padding:0;flex-wrap:wrap}
  .calweek{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;align-items:stretch}
  .calweek .calday{padding:10px;border-radius:18px;background:var(--sunk);min-height:240px}
  .calweek .calday.today{box-shadow:inset 0 0 0 2px var(--red)}
  .calweek .cd-head{flex-direction:column;align-items:flex-start;gap:0;padding:2px 4px 6px}
  .calweek .cd-dow .lg{display:none}
  .calweek .cd-dow .sh{display:inline;font-family:var(--f-b);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .calweek .cd-num{font-size:26px;line-height:1.1}
  .calweek .calday.none .cd-head{font-size:inherit}
  .calweek .ccard{flex-direction:column;align-items:flex-start;gap:6px;padding:12px}
  .calweek .cc-time{flex:none}
  .calweek .cc-sub{white-space:normal}
  .calmonth{padding:12px}
  .mcell{height:84px;align-items:flex-start;padding:6px 8px}
  .mcell:hover{background:var(--sunk)}
  .mcell.sel{background:var(--red-soft)}
  .mdots{gap:4px}
  .dot{width:9px;height:9px}
  .sheet:not(.center){top:0;bottom:0;left:auto;right:0;width:480px;max-width:none;max-height:none;margin:0;border-radius:28px 0 0 28px;padding:22px 26px 26px}
  .sheet:not(.center) .grab{display:none}
  .vex h3{font-size:22px}
  .vsteps,.vpts{font-size:17px}
}

<body>
<header class="top">
  <img class="logo" src="logo-96.png" alt="Scarborough Academy of Karate">
  <div class="brand"><b>SKA Lesson Planner</b><button class="sync" id="sync" data-act="syncNow" type="button"></button></div>
  <button class="fbbtn" id="fbBtn" data-act="feedback" type="button" aria-label="Send feedback" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg><span>Feedback</span></button>
  <button class="me" id="me" data-act="profile" type="button" hidden></button>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabs" id="tabs" aria-label="Main"></nav>
<div class="sheetwrap" id="sheetWrap" hidden>
  <button class="scrim" type="button" data-act="closeSheet" aria-label="Close" tabindex="-1"></button>
  <div class="sheet" id="sheetBox" role="dialog" aria-modal="true"><div id="sheetBody"></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";
/* =====================================================================
   CONFIG — the sheet's web app link. A phone link with #api=… overrides it.
   ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbz7Id0hiGIUFrRDDywyo8o3Ytobt2dnCbeo6BhRW-J7bCeBOZ4rSlz1wmpt3g8Tpe5f/exec";
const ATTEND_URL = "https://my.musterhall.app/today"; // the Lists tab's "Attendance link" overrides this
const KATA_URL = "https://script.google.com/macros/s/AKfycbwnmXKngbUjC-NAThAD_s7R2JdaKGX5e9R3cjJYdQlkEoWbe84nbdILOKVVsGiRbIlpqw/exec"; // the SKA Kata Tracker's Apps Script (summary feed)

const APP_VER = "v30"; // keep in step with CACHE in sw.js (sent with feedback)
const FEEDBACK_TO = "Mr. Luo"; // who reads the Feedback tab

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eqi=(a,b)=>String(a==null?"":a).trim().toLowerCase()===String(b==null?"":b).trim().toLowerCase();
const LS={get(k,d){try{const v=localStorage.getItem("skal."+k);return v==null?d:v;}catch(e){return d;}},set(k,v){try{localStorage.setItem("skal."+k,v);}catch(e){}}};
const svg=(p,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON={
  msg:svg('<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',2.2), bug:svg('<path d="M8 9a4 4 0 0 1 8 0v5a4 4 0 0 1-8 0z"/><path d="M12 9v9M4 13h4M16 13h4M5 7l3 2M19 7l-3 2M5 19l3-2M19 19l-3-2"/>'), bulb:svg('<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>'), help:svg('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.5V14"/><path d="M12 17.5h.01"/>'),
  plus:svg('<path d="M5 12h14M12 5v14"/>',2.5), minus:svg('<path d="M5 12h14"/>',2.5),
  stop:svg('<rect x="5" y="5" width="14" height="14" rx="3"/>',2.4), skip:svg('<path d="M5 5l10 7-10 7z"/><path d="M19 5v14"/>',2.2), grip:svg('<circle cx="9" cy="6" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="18" r="1.3"/>',2.4), fwd:svg('<path d="M5 12h12M13 7l5 5-5 5"/>',2.4),
  timer:svg('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M10 2h4"/>',2.2), lines:svg('<path d="M4 6h16M4 12h10M4 18h6"/>',2.2),
  edit:svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'),
  cal:svg('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  list:svg('<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>'),
  book:svg('<path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M5 16a4 4 0 0 1 4-4h10"/>'),
  clip:svg('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 13l2 2 4-4"/>'),
  back:svg('<path d="M15 5l-7 7 7 7"/>',2.5), go:svg('<path d="M9 5l7 7-7 7"/>',2.6), x:svg('<path d="M6 6l12 12M18 6L6 18"/>',2.4),
  more:svg('<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',1.4),
  copy:svg('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'),
  up:svg('<path d="M6 15l6-6 6 6"/>',2.4), down:svg('<path d="M6 9l6 6 6-6"/>',2.4),
  clock:svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  search:svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'), lanes:svg('<path d="M8 4v16M16 4v16"/><path d="M4 8h4M16 16h4"/>'), shield:svg('<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>'), check:svg('<path d="M5 12.5l4.5 4.5L19 7"/>',2.6), user:svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',2.4), share:svg('<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/>'), review:svg('<path d="M7 4h10a2 2 0 0 1 2 2v14l-4-3H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M9 9h6M9 13h4"/>'), lock:svg('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'), people:svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.6c2.2.6 3.5 2.4 3.5 5.4"/>'), globe:svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>'), clock:svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'), history:svg('<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/>',2.2), eye:svg('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'), trash:svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>')
};

/* ---------- dates and times ---------- */
const pad=n=>String(n).padStart(2,"0");
const dayKey=ms=>{const d=new Date(ms);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const todayKey=()=>dayKey(Date.now());
const keyMs=k=>{const p=String(k).split("-").map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1,12).getTime();};
const fmtDay=ms=>ms?new Date(ms).toLocaleDateString("en-CA",{weekday:"short",month:"short",day:"numeric"}):"No date";
const fmtLongDay=ms=>ms?new Date(ms).toLocaleDateString("en-CA",{weekday:"long",month:"long",day:"numeric"}):"No date";
const fmtHM=m=>{m=Math.max(0,Math.round(m||0));return Math.floor(m/60)+"h "+pad(m%60)+"m";};
const fmtLen=m=>{m=Math.round(m||0);const h=Math.floor(m/60),r=m%60;return h?(h+"h"+(r?" "+pad(r)+"m":"")):(r+"m");};
function fmtWhen(ms){if(!ms)return"";const k=dayKey(ms),t=new Date(ms).toLocaleTimeString("en-CA",{hour:"numeric",minute:"2-digit"});
  if(k===todayKey())return"today "+t;const y=new Date();y.setDate(y.getDate()-1);if(k===dayKey(y.getTime()))return"yesterday "+t;return new Date(ms).toLocaleDateString("en-CA",{month:"short",day:"numeric"});}

/* ---------- the signed-in instructor (account and profile live in the sheet) ---------- */
let TOKEN=LS.get("token","");
let ME=null;try{ME=JSON.parse(LS.get("me","null"));}catch(e){ME=null;}
if(!TOKEN||!ME||!ME.last)ME=null;
let OLDPROFILE=null;try{OLDPROFILE=JSON.parse(LS.get("profile","null"));}catch(e){OLDPROFILE=null;} // from before sign-in existed
const signedIn=()=>!!(TOKEN&&ME);
const nameOf=p=>p?(p.title+" "+(p.showFirst?p.first.trim()+" ":"")+p.last.trim()):"";
const who=()=>nameOf(ME)||"An instructor";
const initialsOf=p=>p?((p.first.trim()[0]||"")+(p.last.trim()[0]||"")).toUpperCase():"";

/* ---------- sections, class types, lengths (from the Lists tab) ---------- */
const BUILTIN=[["Warm-up / Physical training","#B85A14"],["Technique / Kihon","#2F5DC0"],["Kata / Kigu","#6A3FB8"],["Kumite","#B8372F"],["Final activity","#157A6E"]];
const SPARE=["#4E6E8E","#8A5A3B","#2E7D32","#AD1457","#5D4037","#00796B","#7B1FA2","#455A64"];
function listRows(name){return S.lists.filter(r=>eqi(r.list,name)&&r.value);}
const okHex=h=>/^#[0-9a-f]{6}$/i.test(String(h||"").trim());
function secColour(name){
  const r=listRows("Section").find(x=>eqi(x.value,name));if(r&&okHex(r.colour))return r.colour.trim();
  const b=BUILTIN.find(x=>eqi(x[0],name));if(b)return b[1];
  let h=0;for(const c of String(name).toLowerCase())h=(h*31+c.charCodeAt(0))>>>0;return SPARE[h%SPARE.length];
}
function tint(hex,amt){const n=parseInt(hex.slice(1),16),mix=c=>Math.round(c+(255-c)*(amt||.86));return"rgb("+mix(n>>16)+","+mix((n>>8)&255)+","+mix(n&255)+")";}
function defaultSections(){const r=listRows("Section").filter(x=>/^y/i.test(x.inNew)).map(x=>x.value);return r.length?r:BUILTIN.map(b=>b[0]);}
function allSections(){const out=[];const add=v=>{if(v&&!out.some(o=>eqi(o,v)))out.push(v);};
  listRows("Section").forEach(r=>add(r.value));if(!out.length)BUILTIN.forEach(b=>add(b[0]));S.exercises.forEach(e=>add(e.section));return out;}
function classTypes(){const t=[...new Set(listRows("Class type").map(r=>r.value))];return t.length?t:["Regular","Junior program","Advanced"];}
function classLengths(){const l=[...new Set(listRows("Class length").map(r=>parseInt(r.value,10)).filter(n=>n>0))];return l.length?l.sort((a,b)=>a-b):[90,105,120];}
function attendUrl(){const r=listRows("Attendance link")[0];return r&&/^https:\/\//.test(r.value)?r.value:ATTEND_URL;}
const cleanSec=s=>String(s||"").replace(/,/g," /").replace(/\s+/g," ").trim().slice(0,60);

/* ---------- sharing: each plan and exercise is Only me, Everyone, or chosen instructors ---------- */
const isAdmin=()=>!!(ME&&ME.admin);
const canEditR=r=>!!r&&r.canEdit!==false;     // older data without the flag stays editable
const canShareR=r=>!!r&&r.canShare!==false;
const isMineR=r=>!!r&&r.mine!==false;
const personName=id=>{const p=S.people.find(x=>x.id===id);return p?p.name:"";};
const others=()=>S.people.filter(p=>!ME||p.id!==ME.id);
const shareMode=v=>v==="all"?"all":Array.isArray(v)&&v.length?"some":"me";
function shareLabel(v){const m=shareMode(v);if(m==="all")return"Everyone";if(m==="me")return"Only me";
  const n=v.map(personName).filter(Boolean);return n.length<=2?n.join(" and ")||"Chosen people":n.length+" people";}
function shareTag(r){if(!r)return"";const m=shareMode(r.share);
  return`<span class="tag lock">${m==="me"?ICON.lock:m==="all"?ICON.globe:ICON.people}${esc(shareLabel(r.share))}</span>`;}
const ownerTag=r=>r&&!isMineR(r)&&r.ownerId?`<span class="tag by">${ICON.user}${esc(personName(r.ownerId)||"Another instructor")}’s</span>`:"";
const ownFlags=()=>({mine:true,canEdit:true,canShare:true,ownerId:ME?ME.id:""});
function shareField(name,v,what){
  const m=shareMode(v),pick=Array.isArray(v)?v:[],ppl=others();
  const opt=(val,label,sub,ic)=>`<label class="opt"><input type="radio" name="${name}Mode" value="${val}"${m===val?" checked":""}><span><b style="display:flex;align-items:center;gap:6px">${ic}${label}</b><span>${sub}</span></span></label>`;
  return`<fieldset class="field sharebox" data-name="${name}"><legend>Who can see ${what}</legend>
    ${opt("me","Only me","Private. No one else sees it.",ICON.lock)}
    ${opt("all","Everyone","Every instructor can see and copy it.",ICON.globe)}
    ${opt("some","Choose people","Only the instructors you tick.",ICON.people)}
    <div class="ppl"${m==="some"?"":" hidden"}>${ppl.length?ppl.map(p=>`<label class="opt"><input type="checkbox" name="${name}P" value="${esc(p.id)}"${pick.includes(p.id)?" checked":""}><span><b>${esc(p.name)}${p.admin?`<span class="adm">Admin</span>`:""}</b></span></label>`).join(""):`<p class="small" style="margin:0">No other instructors have joined yet.</p>`}</div>
    <p class="small" style="margin:0">They can view and copy it. Admins can also edit it.</p></fieldset>`;}
function readShare(form,name){const fd=new FormData(form);const m=fd.get(name+"Mode")||"me";
  if(m==="all")return"all";if(m==="some"){const ids=fd.getAll(name+"P").map(String);return ids.length?ids:"me";}return"me";}

/* ---------- timeslots: regular classes from the Lists tab ("Mon 18:00-19:30 Kids") ---------- */
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAY_ORDER=[1,2,3,4,5,6,0];
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||"").trim());return m?(+m[1])*60+(+m[2]):null;};
const fromMin=n=>pad(Math.floor(n/60))+":"+pad(n%60);
function parseTime(v){const m=/^(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})$/.exec(String(v||"").trim());if(!m)return null;
  const a=toMin(m[1]),b=toMin(m[2]);return a==null||b==null||b<=a?null:{start:fromMin(a),end:fromMin(b),mins:b-a,key:fromMin(a)+"-"+fromMin(b)};}
const clock12=t=>{const n=toMin(t);if(n==null)return"";const h=Math.floor(n/60),mm=n%60;return((h+11)%12+1)+":"+pad(mm)+(h<12?" a.m.":" p.m.");};
function fmtTime(v){const t=parseTime(v);if(!t)return"";const a=clock12(t.start),b=clock12(t.end);
  return a.slice(-4)===b.slice(-4)?a.slice(0,-5)+"–"+b:a+"–"+b;}
function slots(){return listRows("Timeslot").map(r=>{const m=/^\s*([a-z]{3})[a-z]*\.?\s+(\d{1,2}:\d{2}\s*[-–]\s*\d{1,2}:\d{2})\s*(.*)$/i.exec(r.value);if(!m)return null;
  const day=DAYS.findIndex(d=>d.slice(0,3).toLowerCase()===m[1].toLowerCase());const t=parseTime(m[2]);
  return day<0||!t?null:Object.assign({id:r.id,day,label:m[3].trim(),ended:r.ended||0},t);}).filter(Boolean)
  .sort((a,b)=>(DAY_ORDER.indexOf(a.day)-DAY_ORDER.indexOf(b.day))||(toMin(a.start)-toMin(b.start)));}
/* A class time that ended (Nov 27) stays on the calendar up to its last day, so past classes keep their name */
const liveSlots=()=>slots().filter(x=>!x.ended);
const slotsOn=k=>{const d=new Date(keyMs(k)).getDay();return slots().filter(x=>x.day===d&&(!x.ended||dayKey(x.ended)>=k));};
const dayName=k=>DAYS[new Date(keyMs(k)).getDay()];
const whenLine=p=>fmtLongDay(p.date)+(parseTime(p.time)?" · "+fmtTime(p.time):"");
/* ---------- point-form notes: stored in the sheet as "• point" lines ---------- */
const toPoints=s=>String(s||"").split(/\r?\n/).map(l=>l.replace(/^\s*(?:[•\-*·]\s*)+/,"").trim()).filter(Boolean);
const fromPoints=a=>a.map(p=>String(p).replace(/\r?\n/g," ").trim()).filter(Boolean).map(p=>"• "+p).join("\n");
const ctagHTML=n=>n?`<span class="ctag" title="Created by ${esc(n)}"><span aria-hidden="true" style="display:flex">${ICON.user}</span><span class="vh" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Created by </span>${esc(n)}</span>`:"";
const ptsHTML=s=>{const p=toPoints(s);return p.length?`<ul class="pts">${p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";};
/* Instructions are numbered steps, stored as "1. step" lines */
const toSteps=s=>String(s||"").split(/\r?\n/).map(l=>l.replace(/^\s*(?:[•\-*·]\s*)+/,"").replace(/^\s*(?:step\s*)?\d+\s*[.):-]\s*/i,"").trim()).filter(Boolean);
const fromSteps=a=>a.map(p=>String(p).replace(/\r?\n/g," ").trim()).filter(Boolean).map((p,i)=>(i+1)+". "+p).join("\n");
const stepsHTML=s=>{const p=toSteps(s);return p.length?`<ol class="steps">${p.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:"";};
const stepsText=s=>toSteps(s).map((p,i)=>(i+1)+". "+p).join("\n");
const ptRow=(name,v,ph,num)=>`<div class="ptrow">${num?`<span class="dot num" aria-hidden="true">${num}.</span>`:`<span class="dot" aria-hidden="true">•</span>`}<textarea class="inp pt" rows="1" placeholder="${esc(ph||(num?"Add a step":"Add a point"))}" aria-label="${num?"Step "+num:"Point"}" enterkeyhint="next" autocomplete="off">${esc(v)}</textarea><button type="button" class="iconbtn" data-act="delPoint" aria-label="Remove this ${num?"step":"point"}">${ICON.x}</button></div>`;
function pointsEditor(name,s,ph,numbered){const p=numbered?toSteps(s):toPoints(s);if(!p.length)p.push("");
  return`<div class="points" data-name="${name}"${numbered?' data-num="1"':""}>${p.map((x,i)=>ptRow(name,x,i?"":ph,numbered?i+1:0)).join("")}</div><button type="button" class="btn ghost small" data-act="addPoint" data-name="${name}" style="align-self:flex-start">${ICON.plus}${numbered?"Add a step":"Add a point"}</button>`;}
const fit=el=>{el.style.height="auto";el.style.height=(el.scrollHeight+3)+"px";};
const fitAll=root=>requestAnimationFrame(()=>(root||document).querySelectorAll("textarea.pt").forEach(fit));

async function flush(){
  if(!signedIn())return;
  if(inflight){clearTimeout(flushT);flushT=setTimeout(flush,400);return;}
  clearTimeout(retryT);
  const ops=queue.slice();inflight=true;setSync(ops.length?"saving":ready?"loading":"connecting");
  let res;
  const fresh=wantStudents;wantStudents=false;
  try{res=await callApi(fresh?{token:TOKEN,ops,refreshStudents:true}:{token:TOKEN,ops});}catch(e){res={ok:false,error:"network"};if(fresh)wantStudents=true;}
  inflight=false;
  if(res&&res.ok){
    queue=queue.slice(ops.length);
    if(res.me){ME=res.me;LS.set("me",JSON.stringify(ME));const mb=$("#me");if(mb)mb.textContent=initialsOf(ME);}
    S=normalize(res.state);queue.forEach(applyLocal);
    const first=!ready;ready=true;lastSync=Date.now();setSync("ok");
    if(first){render();loadKata();if(OPEN_PLAN)openFromLink(OPEN_PLAN);}else onData();
    if(fresh&&sheet&&sheet.type==="students"){const l=$("#stuList");if(l)l.innerHTML=studentListHTML(sheet.q);}
    if(queue.length){clearTimeout(flushT);flushT=setTimeout(flush,350);}
    return;
  }
  if(res&&res.error==="bad_token"){signOut("Please sign in again.");return;}
  setSync("error");
  if(res&&res.message&&res.error!=="network")toast(res.message);
  else toast(ops.length?"Can't reach the sheet. Your changes will save when you're back online.":"Can't reach the sheet. Tap the status to retry.");
  retryT=setTimeout(flush,15000);
}

/* ---------- Groups, class rosters and who's here tonight ----------

/* =====================================================================
   NAVIGATION — every screen and panel is a step in the phone's history,
   so the Android back button closes panels and goes back a screen.
   On the home screen, back once shows "Press back again to exit".
   ===================================================================== */
let needGuard=true;
/* A plan is taught from (view), changed (edit) or looked back on after class (review).
   New and copied plans open in edit mode; past classes open in review. */
let planMode="view",editFromView=false;
const stateNow=()=>({t:tab,p:PLAN,m:planMode});
function go(t,plan,mode){
  planListOpen=false;
  if(mode)planMode=mode;
  if(plan!==undefined){PLAN=plan;LS.set("plan",PLAN);}
  if(t===tab&&plan===undefined&&!mode){window.scrollTo(0,0);return;}
  tab=t;history.pushState(stateNow(),"");render();window.scrollTo(0,0);
}
document.addEventListener("click",()=>{if(needGuard&&signedIn()){history.pushState(stateNow(),"");needGuard=false;}},true);
/* Tap flash: hold each button tap for 0.1 s with a visible press, then let it through */
document.addEventListener("click",e=>{
  const b=e.target.closest("button,a.btn,a.pickrow,[data-act]");
  if(!b||b.disabled||b.matches("input,textarea,select,label")||e.detail===0&&b.dataset.tapGo)return;
  if(b.dataset.tapGo){delete b.dataset.tapGo;return;}
  e.preventDefault();e.stopImmediatePropagation();
  b.classList.add("tapflash");
  setTimeout(()=>{b.classList.remove("tapflash");if(!b.isConnected)return;b.dataset.tapGo="1";b.click();},100);
},true);
window.addEventListener("popstate",e=>{
  const s=e.state||{t:"plans",root:true};
  const hadSheet=!!sheet;
  if(sheet&&!s.sheet)hideSheet();
  if(!sheet&&s.sheet){history.replaceState(Object.assign({},s,{sheet:0}),"");}
  if(s.p!==undefined&&s.p!==PLAN){PLAN=s.p;LS.set("plan",PLAN);}
  const modeChanged=!!s.m&&s.m!==planMode;if(s.m)planMode=s.m;if(planMode!=="edit")editFromView=false;
  const changed=(s.t&&s.t!==tab)||(modeChanged&&tab==="plan");
  if(s.t)tab=s.t;
  if(s.root){needGuard=true;if(!hadSheet)toast("Press back again to exit");}
  if(changed||!hadSheet){render();if(changed)window.scrollTo(0,0);}
});

  $("#sync").hidden=!signedIn();$("#fbBtn").hidden=!signedIn();

function renderView(msg){
  const v=$("#view");

  const segs=planSections(p).map(s=>{const m=secTotal(p,s);return m?`<span style="width:${(m/scale*100).toFixed(2)}%;background:${secColour(s)}"></span>`:"";}).join("");
  const edited=p.editedBy?` · last edited by ${esc(p.editedBy)}`:"";

    <button type="button" class="body" data-act="openPlan" data-id="${esc(p.id)}">
      <span class="row" style="gap:8px;flex-wrap:wrap"><span class="t">${esc(planTitle(p))}</span>${p.type?`<span class="tag dark">${esc(p.type)}</span>`:""}${next?`<span class="tag red">Next class</span>`:""}</span>
      <span class="l">${esc(fmtDay(p.date))}${parseTime(p.time)?" · "+esc(fmtTime(p.time)):""} · ${fmtHM(tot)} of ${fmtHM(len)}${notes}${edited}</span>

/* Plans calendar (Gary, Oct 20): week view by default, Expand to month; filter by class day.
   Each day lists its regular timeslots (Lists → Timeslot) matched to that date's plans by time,
   plus any plan at another time (special events). */
const shiftKey=(k,n)=>{const d=new Date(keyMs(k));d.setDate(d.getDate()+n);return dayKey(d.getTime());};
const weekStartKey=k=>{const d=new Date(keyMs(k));return shiftKey(k,-((d.getDay()+6)%7));};
const monthKey=(k,n)=>{const d=new Date(keyMs(k));d.setDate(1);d.setMonth(d.getMonth()+(n||0));return dayKey(d.getTime());};
function classDays(){const set=new Set(liveSlots().map(x=>x.day));if(!set.size)S.plans.forEach(p=>{if(p.date)set.add(new Date(p.date).getDay());});return DAY_ORDER.filter(d=>set.has(d));}
const dayOK=k=>plansFilter==="All"||new Date(keyMs(k)).getDay()===+plansFilter;
function dayEntries(k){
  if(!dayOK(k))return[];
  const plans=S.plans.filter(p=>p.date&&dayKey(p.date)===k),used=new Set(),out=[];
  slotsOn(k).forEach(x=>{
    const cand=plans.filter(p=>!used.has(p.id)&&(parseTime(p.time)||{}).key===x.key);
    const p=cand.find(c=>!x.label||eqi(c.type,x.label))||cand[0];
    if(p)used.add(p.id);
    out.push({k,start:x.start,end:x.end,key:x.key,label:x.label||(p&&p.type)||"",plan:p||null});
  });
  plans.filter(p=>!used.has(p.id)).forEach(p=>{const t=parseTime(p.time);out.push({k,start:t?t.start:"",end:t?t.end:"",key:t?t.key:"",label:p.type,plan:p,extra:true});});
  return out.sort((a,b)=>(toMin(a.start)==null?-1:toMin(a.start))-(toMin(b.start)==null?-1:toMin(b.start)));
}
const entryState=e=>e.plan?"planned":e.k<todayKey()?"past":"open";
function calCard(e){
  const st=entryState(e),a=clock12(e.start),b=clock12(e.end);
  const same=a&&a.slice(-4)===b.slice(-4),big=a?a.slice(0,-5):"Any time",mer=a&&!same?a.slice(-4):"",small=b?"to "+b:"";
  const sub=e.plan?(e.plan.focus||(e.plan.addedBy?"Plan by "+e.plan.addedBy:"Plan ready")):st==="past"?"Finished, no plan":"No plan yet";
  const pill=st==="planned"?"Planned":st==="past"?"No plan":"Plan it";
  const act=e.plan?`data-act="openPlan" data-id="${esc(e.plan.id)}"`:`data-act="planSlot" data-k="${esc(e.k)}" data-slot="${esc(e.key)}" data-type="${esc(e.label)}"`;
  const aria=`${fmtLongDay(keyMs(e.k))}, ${a||"any time"}${e.label?", "+e.label:""}: ${pill}`;
  return`<button type="button" class="ccard st-${st}" ${act} aria-label="${esc(aria)}">
    <span class="cc-time"><b>${esc(big)}${mer?`<small> ${mer}</small>`:""}</b>${small?`<span>${esc(small)}</span>`:""}</span>
    <span class="cc-body"><span class="cc-type">${esc(e.label||"Class")}${e.extra?' <span class="tag dark">Special</span>':""}</span><span class="cc-sub">${esc(sub)}</span></span>
    <span class="cc-pill">${pill}</span></button>`;
}
function calWeek(){
  const first=shiftKey(weekStartKey(todayKey()),calOff*7),tk=todayKey();
  const days=[...Array(7)].map((_,i)=>shiftKey(first,i)).filter(dayOK);
  return`<div class="calweek" style="--n:${days.length}">${days.map(k=>{const es=dayEntries(k),d=new Date(keyMs(k));
    const cls=["calday",k===tk?"today":"",es.length?"":"none",k<tk?"past":""].join(" ");
    return`<section class="${cls}"><h3 class="cd-head"><span class="cd-dow"><span class="lg">${DAYS[d.getDay()]}</span><span class="sh">${DAYS[d.getDay()].slice(0,3)}</span></span><span class="cd-num">${d.getDate()}</span>${k===tk?'<span class="todaytag">Today</span>':""}${es.length?"":'<span class="cd-none">No classes</span>'}</h3>${es.map(calCard).join("")}</section>`;}).join("")}</div>`;
}
function calMonth(){
  const m0=monthKey(todayKey(),calOff),start=weekStartKey(m0),tk=todayKey(),mon=new Date(keyMs(m0)).getMonth();
  if(!calSel||new Date(keyMs(calSel)).getMonth()!==mon)calSel=mon===new Date().getMonth()&&calOff===0?tk:m0;
  let cells="";
  for(let i=0;i<42;i++){const k=shiftKey(start,i),d=new Date(keyMs(k));if(i>=35&&d.getMonth()!==mon)break;
    const dots=dayEntries(k).map(e=>`<i class="dot st-${entryState(e)}"></i>`).join("");
    cells+=`<button type="button" class="mcell${d.getMonth()!==mon?" out":""}${k===tk?" today":""}${k===calSel?" sel":""}" data-act="calSel" data-k="${k}" aria-label="${esc(fmtLongDay(keyMs(k)))}" aria-pressed="${k===calSel}"><span class="mnum">${d.getDate()}</span><span class="mdots">${dots}</span></button>`;}
  const es=dayEntries(calSel);
  return`<div class="card calmonth"><div class="mhead" aria-hidden="true">${["M","T","W","T","F","S","S"].map(x=>`<span>${x}</span>`).join("")}</div><div class="mgrid">${cells}</div></div>
    <div class="mlegend"><span><i class="dot st-planned"></i>Planned</span><span><i class="dot st-open"></i>Needs a plan</span><span><i class="dot st-past"></i>Past, no plan</span></div>
    <h2 class="grouph" style="font-size:16px;color:var(--ink)">${esc(fmtLongDay(keyMs(calSel)))}</h2>
    ${es.length?`<div class="calday">${es.map(calCard).join("")}</div>`:`<p class="small" style="margin:0 4px">No classes on this day.</p>`}
    <button type="button" class="btn outline square" data-act="planSlot" data-k="${calSel}" data-slot="" style="align-self:flex-start">${ICON.plus}Plan something else on this day</button>`;
}
function calTitle(){
  if(calView==="month")return new Date(keyMs(monthKey(todayKey(),calOff))).toLocaleDateString("en-CA",{month:"long",year:"numeric"});
  const a=new Date(keyMs(shiftKey(weekStartKey(todayKey()),calOff*7))),b=new Date(a);b.setDate(b.getDate()+6);
  const m=d=>d.toLocaleDateString("en-CA",{month:"short"});
  return a.getMonth()===b.getMonth()?`${m(a)} ${a.getDate()} – ${b.getDate()}`:`${m(a)} ${a.getDate()} – ${m(b)} ${b.getDate()}`;
}
function viewPlans(){
  const days=classDays();if(plansFilter!=="All"&&!days.includes(+plansFilter))plansFilter="All";
  const list=S.plans.filter(p=>plansFilter==="All"||(p.date&&new Date(p.date).getDay()===+plansFilter));
  const t0=keyMs(todayKey())-12*3600e3;
  const byWhen=(a,b)=>(a.date-b.date)||((toMin((parseTime(a.time)||{}).start)||0)-(toMin((parseTime(b.time)||{}).start)||0));
  const up=list.filter(p=>p.date>=t0).sort(byWhen);
  const past=list.filter(p=>p.date<t0).sort((a,b)=>byWhen(b,a));
  const chips=[["All","All days"]].concat(days.map(d=>[String(d),DAYS[d].slice(0,3)])).map(([v,l])=>`<button type="button" class="chip sm" data-act="pfilter" data-v="${v}" aria-pressed="${plansFilter===v}">${l}</button>`).join("");
  const noSlots=!liveSlots().length;
  const listHTML=(up.length?`<h2 class="grouph">Coming up</h2>`+up.map((p,i)=>planCard(p,i===0)).join(""):"")+(past.length?`<h2 class="grouph">Past classes</h2>`+past.map(p=>planCard(p,false)).join(""):"");
  return`<div class="stack plansview">
    <div class="phead"><h1>Lesson plans</h1><div class="row" style="gap:8px"><button type="button" class="iconbtn outline" data-act="students" aria-label="Student notes">${ICON.user}</button><button type="button" class="btn outline square slotsbtn" data-act="slots">${ICON.clock}Class times</button></div></div>
    <div class="btnrow"><button type="button" class="btn primary square" data-act="newPlan">${ICON.plus}New plan</button><button type="button" class="btn outline square" data-act="copyPick">${ICON.copy}Copy a plan</button></div>
    ${noSlots?`<div class="editbanner">${ICON.clock}<span>Add the dojo’s regular class times so they show on the calendar. <button type="button" class="textbtn" data-act="slots" style="padding:0;min-height:0;display:inline;font-size:inherit;font-weight:800">Class times</button></span></div>`:""}
    <div class="caltools">
      <div class="seg" role="group" aria-label="Calendar view"><button type="button" data-act="calView" data-v="week" aria-pressed="${calView==="week"}">Week</button><button type="button" data-act="calView" data-v="month" aria-pressed="${calView==="month"}">Month</button></div>
      <div class="calnav"><button type="button" class="iconbtn round" data-act="calNav" data-v="-1" aria-label="Previous ${calView}">${ICON.back}</button><span class="caltitle" aria-live="polite">${esc(calTitle())}</span><button type="button" class="iconbtn round" data-act="calNav" data-v="1" aria-label="Next ${calView}">${ICON.go}</button>${calOff?`<button type="button" class="textbtn" data-act="calNav" data-v="0">${calView==="week"?"This week":"This month"}</button>`:""}</div>
    </div>
    <div class="chips daychips" role="group" aria-label="Class day">${chips}</div>
    ${calView==="month"?calMonth():calWeek()}
    ${S.plans.length?`<details class="allplans"><summary>All plans as a list</summary><div class="stack" style="margin-top:12px">${listHTML||`<p class="small">No plans on ${esc(DAYS[+plansFilter]||"")}s yet.</p>`}</div></details>`:""}
  </div>`;
}

function notesText(p){
  const out=[`SKA class review: ${planTitle(p)}`,`${whenLine(p)}${p.type?" · "+p.type:""}`];
  const tn=notesOf(p.id);
  NOTE_KINDS.forEach(K=>{const ns=tn.filter(n=>n.kind===K.k);if(!ns.length)return;out.push("",K.label);
    ns.forEach(n=>{const it=n.item?itemById(n.item):null;const lead=n.kind==="Feedback"?(it?it.name:""):(isWhole(n.who)?"":n.who);
      out.push("• "+(lead?lead+": ":"")+n.text+(n.kind==="Assignment"&&isDone(n)?" (followed up)":""));});});
  const rv=ptLines(p.review);if(rv.length){out.push("","After class");rv.forEach(x=>out.push("• "+x));}
  planSections(p).filter(s=>!isSkipped(p,s)).forEach(s=>{
    const its=secItems(p,s).filter(it=>qnLines(it.live).length||toPoints(it.note).length);if(!its.length)return;
    out.push("",s);
    its.forEach(it=>{out.push(`${it.name} (${it.minutes} min)`);toPoints(it.note).forEach(x=>out.push("  • Planned: "+x));qnLines(it.live).forEach(x=>{const q=splitQn(x);out.push("  • "+(q.t?q.t+" · ":"")+q.x);});});

  return out.join("\n");
}

function addClassNote(f){
  const p=planById(f.dataset.id);const inp=f.querySelector("input");const txt=(inp.value||"").replace(/\s+/g," ").trim().slice(0,500);if(!p||!txt)return;
  const K=NB.kind;let names=[""];
  if(K==="Person"||K==="Assignment"){
    names=[...NB.picked].map(n=>{const k=allNames().find(x=>eqi(x,n));return(k||n).slice(0,60);});
    if(!names.length){if(K==="Assignment")names=[WHOLE];else{toast("Pick at least one student first.");return;}}}
  // Clear first: adding re-draws the screen behind the panel (Gary, Nov 21: the text used to stay in the box)
  inp.value="";NB.text="";NB.q="";
  const base={plan:p.id,item:K==="Feedback"?NB.item:"",kind:K,text:txt,done:"",share:NB.share?"all":"me",addedBy:who(),created:Date.now()};
  names.forEach(n=>store.add("notes",Object.assign({},base,{who:n})));
  NB.picked=new Set();NB.whole=false;NB.share=false;if(K==="Feedback")NB.item="";
  if(sheet&&sheet.type==="note")renderSheet();

const isNext=n=>/^y/i.test(n.next||"");
const carryBtn=n=>`<button type="button" class="carry" data-act="noteNext" data-id="${esc(n.id)}" aria-pressed="${isNext(n)}" aria-label="${isNext(n)?"Stop carrying this note to next week":"Carry this note to next week’s class"}">${isNext(n)?ICON.check:ICON.fwd}Next week</button>`;
function noteLi(n,opt){
  opt=opt||{};const K=kindOf(n.kind),it=n.item?itemById(n.item):null;
  const lead=n.kind==="Feedback"?(it?it.name:""):opt.noWho?"":(isWhole(n.who)?(n.kind==="Assignment"?WHOLE:""):n.who);
  const meta=[opt.when||noteTime(n)];if(!n.mine)meta.push(esc(personName(n.ownerId)||n.addedBy||"Another instructor"));

    ${n.mine&&!opt.readonly?`<div class="nacts"><button type="button" class="iconbtn" data-act="noteShare" data-id="${esc(n.id)}" aria-label="${n.share==="all"?"Make this note private":"Share this note with instructors on this class"}">${n.share==="all"?ICON.people:ICON.lock}</button><button type="button" class="iconbtn" data-act="delNote" data-id="${esc(n.id)}" aria-label="Delete this note">${ICON.x}</button></div>`:""}
