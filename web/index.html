/* Consolidate (Gary, Nov 5): every note from this class in one list. Quick notes and after-class notes marked
   Next week become Exercise feedback notes (yours, private), so they carry to next week's Last class card. */
const myCopy=(p,item,text)=>S.notes.find(n=>n.mine&&n.plan===p.id&&n.kind==="Feedback"&&(n.item||"")===(item||"")&&eqi(n.text,text));
function sheetConsol(){
  const p=planById(PLAN);if(!p)return sheetHead("Consolidate notes")+`<p>This class was removed.</p>`;
  const tn=notesOf(p.id),rv=ptLines(p.review),qn=[];
  teachList(p).forEach(({it})=>qnLines(it.live).forEach((x,i)=>{const q=splitQn(x);if(!myCopy(p,it.id,q.x))qn.push({it,q,i});}));
  const rvs=rv.map((x,i)=>({x,i})).filter(r=>!myCopy(p,"",r.x));
  const groups=NOTE_KINDS.map(K=>{const ns=tn.filter(n=>n.kind===K.k);return ns.length?`<div class="cnhead">${K.label}</div><ul class="nlist" style="margin-top:2px">${ns.map(n=>noteLi(n,{carry:true})).join("")}</ul>`:"";}).join("");
  const nxt=`<button type="button" class="carry" data-act="%A" %D aria-pressed="false" aria-label="Carry this note to next week’s class">${ICON.fwd}Next week</button>`;
  const qnHTML=qn.length?`<div class="cnhead">Quick notes</div>`+qn.map(({it,q,i})=>`<div class="cnq"><div class="grow"><div class="nx"><b>${esc(it.name)}:</b> ${esc(q.x)}</div>${q.t?`<div class="nm">${esc(q.t)}</div>`:""}${nxt.replace("%A","qnNext").replace("%D",`data-id="${esc(it.id)}" data-i="${i}"`)}</div></div>`).join(""):"";
  const rvHTML=rvs.length?`<div class="cnhead">After class</div>`+rvs.map(r=>`<div class="cnq"><div class="grow"><div class="nx">${esc(r.x)}</div>${nxt.replace("%A","rvNext").replace("%D",`data-i="${r.i}"`)}</div></div>`).join(""):"";
  const none=!tn.length&&!qn.length&&!rvs.length;
  return sheetHead("Consolidate notes",`<div class="small">${esc(planTitle(p))} · ${esc(whenLine(p))}</div>`)+
    `<p class="small" style="margin:-4px 0 6px">Every note from this class in one place. Tap <b>Next week</b> on the ones you want to see in next ${p.date?esc(DAYS[new Date(p.date).getDay()]):"class"}’s plan.</p>
    ${none?`<p class="small">No notes from this class yet.</p>`:groups+qnHTML+rvHTML}
    <button type="button" class="btn outline block mt" data-act="shareNotes">${ICON.share}Share or copy all notes</button>`;
}

/* Last class: everything from the previous class in this timeslot, at the top of tonight's class */
let recapWho="";
function recapHTML(p){
  const prev=earlierSlot(p),last=prev[0];if(!last)return"";
  const open=LS.get("recap","1")!=="0";
  const all=notesOf(last.id);
  // Notes marked "Next week" in that class come first, under For this week (Gary, Nov 5)
  const carry=all.filter(n=>isNext(n)&&n.kind!=="Assignment"),ns=all.filter(n=>!carry.includes(n));
  const told=ns.filter(n=>n.kind==="Class");
  const after=ptLines(last.review);
  const prevIds=new Set(prev.map(x=>x.id));
  const asg=S.notes.filter(n=>n.kind==="Assignment"&&prevIds.has(n.plan)&&(n.plan===last.id||!isDone(n)))
    .sort((a,b)=>((planById(b.plan)||{}).date||0)-((planById(a.plan)||{}).date||0)||(a.created||0)-(b.created||0));
  const ppl={};ns.filter(n=>!isWhole(n.who)&&(n.kind==="Person"||n.kind==="Assignment")).forEach(n=>{const k=Object.keys(ppl).find(x=>eqi(x,n.who))||n.who;(ppl[k]=ppl[k]||[]).push(n);});
  const names=Object.keys(ppl).sort((a,b)=>a.localeCompare(b));
  const fb=ns.filter(n=>n.kind==="Feedback").map(n=>{const it=itemById(n.item);return{ex:it?it.name:"",x:n.text};});
  itemsOf(last.id).forEach(it=>qnLines(it.live).forEach(x=>{const q=splitQn(x).x;if(!carry.some(n=>n.item===it.id&&eqi(n.text,q)))fb.push({ex:it.name,x:q});}));
  const openAsg=asg.filter(n=>!isDone(n)).length;
  const sub=fmtDay(last.date)+(last.type?" · "+last.type:"")+(parseTime(last.time)?" · "+clock12(startOf(last)):"")+(last.mine===false&&last.ownerId?" · "+(personName(last.ownerId)||""):"");
  const nothing=!carry.length&&!told.length&&!after.length&&!asg.length&&!names.length&&!fb.length;
  const counts=[[carry.length,"for this week","#C8102E"],[told.length+after.length,"to the class","#111111"],[openAsg,openAsg===1?"assignment open":"assignments open","#8A4B00"],[names.length,names.length===1?"student":"students","#5B3FA8"],[fb.length,"feedback","#0F6E6A"]]
    .filter(c=>c[0]).map(c=>`<span style="background:${c[2]}">${c[0]} ${c[1]}</span>`).join("");
  if(recapWho&&!names.some(n=>eqi(n,recapWho)))recapWho="";
  const body=nothing?`<p class="small" style="margin:0">No notes from that class.</p>`:`
    ${counts?`<div class="rcount">${counts}</div>`:""}
    ${carry.length?`<div><div class="rclabel" style="color:var(--red-d)">For this week</div><ul class="rcpts">${carry.map(n=>{const it=n.item?itemById(n.item):null;const lead=n.kind==="Feedback"?(it?it.name:""):(isWhole(n.who)?"":n.who);
      return`<li><span>${lead?`<b>${esc(lead)}:</b> `:""}${esc(n.text)}</span></li>`;}).join("")}</ul></div>`:""}
    ${told.length?`<div><div class="rclabel">Told the class</div><ul class="rcpts">${told.map(n=>`<li><span>${esc(n.text)}</span></li>`).join("")}</ul></div>`:""}
    ${asg.length?`<div><div class="rclabel">Assignments to follow up</div>${asg.map(n=>{const pl=planById(n.plan),older=n.plan!==last.id;
      return`<div class="asg${isDone(n)?" done":""}"><div class="grow"><div class="w">${esc(isWhole(n.who)?WHOLE:n.who)}${older&&pl?" · from "+esc(fmtDay(pl.date)):""}</div><div class="x">${esc(n.text)}</div></div>
        <button type="button" class="fup" data-act="noteDone" data-id="${esc(n.id)}" aria-pressed="${isDone(n)}"${n.mine?"":` disabled title="${esc(personName(n.ownerId)||"Another instructor")}’s note"`}>${isDone(n)?"Done":"Follow up"}</button></div>`;}).join("")}</div>`:""}
    ${names.length?`<div><div class="rclabel">Individual notes</div><div class="chips">${names.map(n=>`<button type="button" class="pchip" data-act="recapWho" data-v="${esc(n)}" aria-pressed="${eqi(n,recapWho)}" aria-expanded="${eqi(n,recapWho)}">${beltDot(n)}${esc(n)} · ${ppl[n].length}</button>`).join("")}</div>
      ${recapWho?`<div class="pbox"><ul class="rcpts">${ppl[names.find(n=>eqi(n,recapWho))].map(n=>`<li><span>${n.kind==="Assignment"?"<b>Assignment:</b> ":""}${esc(n.text)}</span></li>`).join("")}</ul>
        <button type="button" class="linkbtn" data-act="student" data-v="${esc(recapWho)}">Every note for ${esc(recapWho)} ›</button></div>`:""}</div>`:""}
    ${fb.length?`<div><div class="rclabel">Exercise feedback</div><ul class="rcpts">${fb.map(f=>`<li><span>${f.ex?`<b style="color:#0F6E6A">${esc(f.ex)}</b> · `:""}${esc(f.x)}</span></li>`).join("")}</ul></div>`:""}
    ${after.length?`<div><div class="rclabel">After class</div><ul class="rcpts">${after.map(x=>`<li><span>${esc(x)}</span></li>`).join("")}</ul></div>`:""}`;
  return`<section class="recap">
    <button type="button" class="rch" data-act="recapToggle" aria-expanded="${open}">
      <span class="ring2" aria-hidden="true">${ICON.history}</span>
      <span class="grow"><h2>Last class</h2><span class="small" style="display:block">${esc(sub)}${carry.length?` · <b style="color:var(--red-d)">${carry.length} ${carry.length===1?"note":"notes"} for this week</b>`:""}</span></span>
      <span class="rcopen">${open?"Hide":"Show"}</span>

      <div class="btnrow"><button type="button" class="btn outline small" data-act="openReview" data-id="${esc(last.id)}">${ICON.review}Full review</button><button type="button" class="btn outline small" data-act="students">${ICON.user}Find a student</button></div></div>`:""}
  </section>`;
}

/* Student notes: every note about one student, across all classes */
function studentListHTML(q){
  q=String(q||"").trim().toLowerCase();
  const count={};S.notes.forEach(n=>{if(!isWhole(n.who)){const k=n.who.toLowerCase();count[k]=(count[k]||0)+1;}});
  let names=allNames().filter(n=>!q||n.toLowerCase().includes(q));
  names.sort((a,b)=>((count[b.toLowerCase()]?1:0)-(count[a.toLowerCase()]?1:0))||a.localeCompare(b));

  }else{

      `${T.roster.length?csGroups(p,T.roster).map(b=>{const k="r:"+b.name,open=!CSFOLD.has(k);

          ${open?`<div class="gbody">${b.names.map(n=>`<div class="csrow">${beltDot(n)}<span class="grow">${esc(n)}</span><span class="small">${esc(beltOf(n)||"No belt")}</span><button type="button" class="iconbtn" data-act="csRemove" data-v="${esc(n)}" aria-label="Take ${esc(n)} off this class">${ICON.x}</button></div>`).join("")}</div>`:""}</div>`;}).join("")

let VAPID=LS.get("vapid",""),PUSH_URL=LS.get("pushurl","");
let NS=null,nsT=null,pushState="checking",pushBusy=false;
const NPRE={
  before:[["30 min before",{rel:30}],["1 hour before",{rel:60}],["2 hours before",{rel:120}]],
  noplan:[["Day before, 7 p.m.",{day:-1,at:"19:00"}],["Morning of",{day:0,at:"08:00"}],["3 hours before",{rel:180}]],
  asg:[["With the class reminder",{same:true}],["Morning of",{day:0,at:"08:00"}]]};
const NKIND=[["before","Before class","Class name, focus, and whether the plan is ready"],["noplan","No plan yet","Only if your class still has no plan"],["asg","Assignments to follow up","Open assignments from last class at that time"]];
const sameWhen=(a,b)=>!!a&&!!b&&(a.same?!!b.same:a.rel!=null?a.rel===b.rel&&b.rel!=null:(b.rel==null&&!b.same&&a.day===b.day&&a.at===b.at));
const presetOf=(k,w)=>{if(w&&w.custom)return"custom";const i=NPRE[k].findIndex(p=>sameWhen(p[1],w));return i<0?"custom":String(i);};
function nsInit(){if(!NS)NS=JSON.parse(JSON.stringify((ME&&ME.notify)||{slots:[],before:{on:true,rel:60},noplan:{on:true,day:-1,at:"19:00"},asg:{on:true,same:true}}));return NS;}
function nsSave(){clearTimeout(nsT);nsT=setTimeout(()=>{callApi({token:TOKEN,ops:[],notify:NS}).then(r=>{if(r&&r.ok&&r.me){ME=r.me;LS.set("me",JSON.stringify(ME));}else if(r&&r.error==="bad_token")signOut("Please sign in again.");}).catch(()=>toast("Couldn’t save. Check your connection."));},500);}
const slotVal=s=>{const r=S.lists.find(x=>x.id===s.id);return r?r.value.trim():"";};
const slotName=s=>DAYS[s.day].slice(0,3)+" "+clock12(s.start)+(s.label?" "+s.label:"");
const u8=b=>{const s=b.replace(/-/g,"+").replace(/_/g,"/");const r=atob(s+"===".slice((s.length+3)%4));return Uint8Array.from(r,c=>c.charCodeAt(0));};
async function checkPush(){
  if(!("serviceWorker"in navigator)||!("PushManager"in window)||!("Notification"in window)){pushState="unsupported";return;}
  if(!VAPID){pushState="notset";return;}
  if(Notification.permission==="denied"){pushState="denied";return;}
  try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();pushState=sub?"on":"off";}catch(e){pushState="off";}
}
async function pushOn(){
  if(pushBusy)return;pushBusy=true;renderSheet();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){pushState=perm==="denied"?"denied":"off";return;}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(sub){const k=sub.options&&sub.options.applicationServerKey;if(k&&btoa(String.fromCharCode(...new Uint8Array(k))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")!==VAPID){await sub.unsubscribe();sub=null;}}
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
    const dev=/Android/i.test(navigator.userAgent)?"Android phone":/iPhone|iPad/i.test(navigator.userAgent)?"iPhone":"Computer";
    const r=await callApi({token:TOKEN,ops:[],subscribe:sub.toJSON(),device:dev,notify:nsInit()});
    if(r&&r.ok){pushState="on";if(r.me){ME=r.me;LS.set("me",JSON.stringify(ME));}toast("Notifications are on for this "+(dev==="Computer"?"computer":"phone"));}
    else toast((r&&r.message)||"Couldn’t turn them on. Try again.");
  }catch(e){toast("Couldn’t turn on notifications on this device.");}
  finally{pushBusy=false;renderSheet();}
}
async function pushOff(){
  try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
    if(sub){const ep=sub.endpoint;await sub.unsubscribe();callApi({token:TOKEN,ops:[],unsubscribe:ep}).catch(()=>{});}
  }catch(e){}
  pushState="off";renderSheet();toast("Notifications are off on this device");
}
function pushTest(){
  callApi({token:TOKEN,ops:[],notifyTest:true}).then(r=>{
    if(!r||!r.ok){toast("Couldn’t send a test. Try again.");return;}
    if(PUSH_URL)fetch(PUSH_URL+"/run",{method:"POST"}).catch(()=>{});
    toast("Test sent. It should arrive in a few seconds.");
  }).catch(()=>toast("Couldn’t reach the sheet."));
}

function sheetNotify(){

  return sheetHead("Notifications")+`<div class="stack nsbox">${top}

/* Opening a plan from a notification: ./#plan=<id> (cold start) or a message from the service worker */
let OPEN_PLAN="";
function openFromLink(id){if(!id)return;if(!ready){OPEN_PLAN=id;return;}OPEN_PLAN="";if(planById(id)){tab="plan";switchPlan(id);}else go("plans");}
if("serviceWorker"in navigator)navigator.serviceWorker.addEventListener("message",e=>{const d=e.data||{};if(d.open){const m=/plan=([^&]+)/.exec(d.open);if(m)openFromLink(decodeURIComponent(m[1]));else if(ready)go("plans");}});

/* ---------- Library ---------- */
function exListHTML(){
  const q=libQuery.trim().toLowerCase();
  const use=usage();
  const list=S.exercises.filter(e=>(libFilter==="All"||eqi(e.section,libFilter))&&(!q||(e.name+" "+e.description+" "+e.notes+" "+e.section).toLowerCase().includes(q)))
    .sort((a,b)=>{const sa=allSections().findIndex(s=>eqi(s,a.section)),sb=allSections().findIndex(s=>eqi(s,b.section));return(sa-sb)||a.name.localeCompare(b.name);});
  if(!list.length)return`<div class="card empty"><p>${S.exercises.length?"Nothing matches.":"The library is empty. Add the exercises you use so everyone can slot them into plans."}</p><button type="button" class="btn primary small" data-act="newEx">${ICON.plus}New exercise</button></div>`;
  return list.map(e=>{
    const col=secColour(e.section),n=use[e.id]?use[e.id].size:0;
    const meta=`in ${n} ${n===1?"plan":"plans"}`+(e.editedBy&&e.editedBy!==e.addedBy?` · edited by ${esc(e.editedBy)}`:"");
    return`<div class="card excard${e.addedBy?" cornered":""}" style="margin-bottom:10px">${ctagHTML(e.addedBy)}
      <button type="button" class="body" data-act="editEx" data-id="${esc(e.id)}" aria-label="${canEditR(e)?"Edit":"View"} ${esc(e.name)}">
        <span class="row" style="gap:8px;align-items:baseline"><span class="nm grow">${esc(e.name)}</span><span style="font-size:14px;font-weight:800;color:${col}">${e.minutes} min</span></span>
        ${e.description?`<span class="ds clamp">${esc(stepsText(e.description))}</span>`:""}${toPoints(e.notes).length?`<span class="ds" style="color:var(--muted);font-weight:700">${toPoints(e.notes).length} ${toPoints(e.notes).length===1?"note":"notes"}</span>`:""}
        <span class="tagline"><span class="tag" style="color:${col};background:${tint(col)}">${esc(e.section||"No section")}</span>${shareMode(e.share)!=="all"||!isMineR(e)?ownerTag(e)+shareTag(e):""}<span>${meta}</span></span>
      </button>
      <button type="button" class="iconbtn" data-act="quickAdd" data-id="${esc(e.id)}" aria-label="Add ${esc(e.name)} to the open class" style="background:${tint(col)};color:${col}">${ICON.plus}</button>
    </div>`;
  }).join("");
}
function viewLibrary(){
  const secs=allSections();if(libFilter!=="All"&&!secs.some(s=>eqi(s,libFilter)))libFilter="All";
  const chips=["All"].concat(secs).map(s=>{const on=libFilter===s,col=s==="All"?"#C8102E":secColour(s);
    return`<button type="button" class="chip sm" data-act="lfilter" data-v="${esc(s)}" aria-pressed="${on}" style="${on?`background:${col};border-color:${col};color:#fff`:""}">${esc(s==="All"?"All":s)}</button>`;}).join("");
  const p=planById(PLAN);
  const cnt=S.exercises.length;const ppl=new Set(S.exercises.map(e=>e.addedBy).filter(Boolean)).size;
  return`<div class="stack">
    <div class="row"><div class="grow"><h1>Exercise library</h1><div class="kicker">${cnt} ${cnt===1?"exercise":"exercises"}${ppl?` from ${ppl} ${ppl===1?"instructor":"instructors"}`:""}</div></div>
      <button type="button" class="btn primary small" data-act="newEx">${ICON.plus}New</button></div>
    <div class="search">${ICON.search}<label for="libSearch" class="vh" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search exercises</label><input id="libSearch" type="search" placeholder="Search exercises" value="${esc(libQuery)}" autocomplete="off"></div>
    <div class="chips" role="group" aria-label="Section">${chips}</div>
    ${p?`<p class="small" style="margin:0 4px">Tap + to add to <b style="color:var(--ink)">${esc(planTitle(p))}</b> (${esc(fmtDay(p.date))}).</p>`:""}
    <div id="exList">${exListHTML()}</div>
  </div>`;
}

function previewName(){if(!draft)return"…";const f=draft.first.trim(),l=draft.last.trim();return draft.title+" "+(draft.showFirst&&f?f+" ":"")+(l||"…");}
function firstHint(){if(!draft)return"";const t=draft.title,f=draft.first.trim()||"John",l=draft.last.trim()||"Smith";return`Off: “${t} ${l}” · On: “${t} ${f} ${l}”`;}
function updateProfilePreview(){const o=$("#pvOO");if(o)o.textContent=firstHint();const n=previewName();const a=$("#pvName"),b=$("#pvEx"),c=$("#pvInit");if(a)a.textContent=n;if(b)b.textContent=n;if(c)c.textContent=initialsOf(draft)||"?";}

const errBox=()=>`<div class="err" id="authErr" role="alert"${authMsg?"":" hidden"}>${esc(authMsg)}</div>`;
const gBlock=label=>GCID?`<div class="gwrap"><div id="gbtn" data-text="${label}"></div></div><div class="or"><span>or with email</span></div>`:"";

  </div>`;
  // signup or gsignup
  draft=draft||Object.assign({title:"Mr.",first:"",last:"",showFirst:false},OLDPROFILE||{});
  const g=m==="gsignup"&&gPending;
  return`<div class="connect stack">
    <h1>Create your account</h1>
    <p class="lead">${g?`Signing up with Google as <b>${esc(gPending.email)}</b>.`:"You’ll use it to sign in on any phone or computer."} Your name goes on the plans and exercises you add or change.</p>
    ${errBox()}${g?"":gBlock("signup_with")}
    <form id="signupForm" class="stack" autocomplete="on">

      ${nameFields()}
      ${g?"":`<div class="field"><label for="sEmail">Email</label><input class="inp" id="sEmail" name="email" type="email" inputmode="email" autocomplete="username" required></div>

function showAuthErr(msg){authMsg=msg;const e=$("#authErr");if(e){e.textContent=msg;e.hidden=!msg;e.scrollIntoView({block:"center",behavior:"smooth"});}}

/* Google sign-in (only shown once a client ID is set in the sheet) */
let gisState=0;
function loadGis(){
  if(!GCID||gisState)return;gisState=1;
  const sc=document.createElement("script");sc.src="https://accounts.google.com/gsi/client";sc.async=true;
  sc.onload=()=>{try{google.accounts.id.initialize({client_id:GCID,callback:r=>authCall({auth:"google",credential:r.credential},null),ux_mode:"popup"});gisState=2;mountGis();}catch(e){gisState=0;}};
  sc.onerror=()=>{gisState=0;};
  document.head.appendChild(sc);
}
function mountGis(){
  const el=$("#gbtn");if(!el||gisState!==2)return;
  try{google.accounts.id.renderButton(el,{theme:"outline",size:"large",shape:"pill",text:el.dataset.text||"signin_with",width:Math.min(380,Math.max(240,el.parentElement.clientWidth||300))});}catch(e){}
}
function fetchConfig(){
  callApi({auth:"config"}).then(r=>{if(!r||!r.ok)return;const c=(r.config&&r.config.googleClientId)||"";
    const vp=(r.config&&r.config.vapidPublic)||"",pu=(r.config&&r.config.pushUrl)||"";if(vp!==VAPID){VAPID=vp;LS.set("vapid",vp);}if(pu!==PUSH_URL){PUSH_URL=pu;LS.set("pushurl",pu);}
    if(c!==GCID){GCID=c;LS.set("gcid",c);if(!signedIn())renderView();}}).catch(()=>{});
}
async function authCall(payload,btn){
  showAuthErr("");
  if(btn){btn.disabled=true;btn.dataset.l=btn.textContent;btn.textContent="One moment…";}
  let res;try{res=await callApi(payload);}catch(e){res={ok:false,error:"network",message:"Can’t reach the dojo sheet. Check your connection and try again."};}
  if(btn&&document.contains(btn)){btn.disabled=false;btn.textContent=btn.dataset.l;}
  if(res&&res.ok){
    TOKEN=res.token;LS.set("token",TOKEN);ME=res.me;LS.set("me",JSON.stringify(ME));if(ME.email)LS.set("email",ME.email);
    S=normalize(res.state);queue=[];ready=true;lastSync=Date.now();gPending=null;draft=null;authMsg="";authMode="signin";
    tab="plans";history.replaceState({t:"plans",p:PLAN,root:true},"");needGuard=true;render();setSync("ok");window.scrollTo(0,0);
    toast("Welcome, "+who());return;}
  if(res&&res.error==="need_signup"){gPending={credential:payload.credential,email:res.email};
    draft=Object.assign({title:"Mr.",showFirst:false},OLDPROFILE||{},{first:res.first||((OLDPROFILE||{}).first)||"",last:res.last||((OLDPROFILE||{}).last)||""});
    authMode="gsignup";authMsg="";renderView();window.scrollTo(0,0);return;}
  if(res&&res.error==="reset_needed"){authMode="reset";authMsg=res.message;renderView();return;}
  showAuthErr((res&&res.message)||"Something went wrong. Try again.");
}
function signOut(msg){
  TOKEN="";ME=null;LS.set("token","");LS.set("me","null");S={plans:[],items:[],exercises:[],lists:[]};ready=false;queue=[];
  authMode="signin";authMsg=msg||"";draft=null;tab="plans";history.replaceState({t:"plans",p:PLAN,root:true},"");
  try{if(window.google&&google.accounts)google.accounts.id.disableAutoSelect();}catch(e){}
  render();window.scrollTo(0,0);
}

/* =====================================================================
   PANELS (bottom sheets and the centred "are you sure" boxes)
   ===================================================================== */
let sheet=null,lastFocus=null;
function openSheet(s){hideToast();if(!sheet){lastFocus=document.activeElement;history.pushState(Object.assign(stateNow(),{sheet:1}),"");}
  sheet=s;renderSheet();$("#sheetWrap").hidden=false;document.body.style.overflow="hidden";
  setTimeout(()=>{if($("#sheetWrap").contains(document.activeElement))return;const f=$("#sheetBody [data-focus]")||$("#sheetBody button, #sheetBody input, #sheetBody a");if(f)f.focus({preventScroll:true});},40);}
function swapSheet(s){sheet=s;renderSheet();$("#sheetBox").scrollTop=0;}
function closeSheet(){if(history.state&&history.state.sheet)history.back();else hideSheet();}
function hideSheet(){sheet=null;$("#sheetWrap").hidden=true;document.body.style.overflow="";if(lastFocus&&document.contains(lastFocus))try{lastFocus.focus({preventScroll:true});}catch(_){}}
function finishSheet(t,plan,mode){hideSheet();if(plan!==undefined){PLAN=plan;LS.set("plan",PLAN);}if(mode)planMode=mode;tab=t;history.replaceState(stateNow(),"");render();window.scrollTo(0,0);}
const closeBtn=`<button type="button" class="iconbtn round" data-act="closeSheet" aria-label="Close">${ICON.x}</button>`;
const sheetHead=(title,sub)=>`<div class="grab"></div><div class="sh"><div class="grow">${sub||""}<h2 id="sheetTitle">${title}</h2></div>${closeBtn}</div>`;
const secChip=s=>{const c=secColour(s);return`<span class="tag" style="color:${c};background:${tint(c)};margin-bottom:6px">${esc(s)}</span>`;};

    ${e.addedBy?`<p style="margin:0 0 8px"><span class="tag creator">${ICON.user}${esc(e.addedBy)}</span></p>`:""}
    ${e.description?`<h3 class="vlabel">Instructions</h3>${stepsHTML(e.description)}`:""}${toPoints(e.notes).length?`<h3 class="vlabel">Notes</h3>${ptsHTML(e.notes)}`:""}
    <div class="btnrow" style="margin-top:14px"><button type="button" class="btn outline" data-act="closeSheet">Close</button><button type="button" class="btn primary" data-act="copyEx" data-id="${esc(e.id)}">${ICON.copy}Copy to edit</button></div>`;}
function sheetNewPlan(s){
  s=s||{};const lens=classLengths();const k=s.date||todayKey();const sl=parseTime(s.slot);
  const def=sl?sl.mins:lens.includes(105)?105:lens[0];const ty=classTypes().find(t=>eqi(t,s.ptype))||classTypes()[0];
  return sheetHead("New plan",`<div class="small">Starts with: ${esc(defaultSections().join(" · "))}</div>`)+
  `<form id="newPlanForm" class="planform">
    <div class="field"><label for="nDate">Date</label><input class="inp" id="nDate" name="date" type="date" value="${k}" required></div>
    ${timeField(k,sl?sl.key:"")}
    ${typeLenFields(ty,def)}
    <div class="field"><label for="nFocus">Focus or event name (optional)</label><input class="inp" id="nFocus" name="focus" type="text" maxlength="60" placeholder="e.g. Kumite focus, Grading day"></div>
    ${shareField("sh","me","this plan")}
    <button class="btn primary block" type="submit">Create plan</button></form>`;
}
function sheetCopyPick(){
  const list=S.plans.slice().sort((a,b)=>b.date-a.date);
  return sheetHead("Copy a past plan")+(list.length?list.map(p=>`<button type="button" class="pickrow" data-act="copyPlan" data-id="${esc(p.id)}"><span class="nm">${esc(planTitle(p))}<br><span class="small">${esc(fmtDay(p.date))}${parseTime(p.time)?" · "+esc(fmtTime(p.time)):""}${p.type?" · "+esc(p.type):""} · ${fmtHM(planTotal(p))}${!isMineR(p)&&p.ownerId?" · "+esc(personName(p.ownerId)):""}</span></span>${ICON.copy}</button>`).join(""):`<p>No plans to copy yet.</p>`);
}
function sheetCopy(s){
  const p=planById(s.id);if(!p)return sheetHead("Not found");
  return sheetHead("Copy “"+esc(planTitle(p))+"”",`<div class="small">${itemsOf(p.id).length} exercises, same sections, times and notes</div>`)+
  `<form id="copyForm" class="planform" data-id="${esc(p.id)}">
    <div class="field"><label for="cDate">New date</label><input class="inp" id="cDate" name="date" type="date" value="${todayKey()}" required data-focus></div>
    ${timeField(todayKey(),"")}
    ${typeLenFields(p.type||classTypes()[0],p.length||105)}
    <div class="field"><label for="cFocus">Focus or event name</label><input class="inp" id="cFocus" name="focus" type="text" maxlength="60" value="${esc(p.focus)}"></div>
    ${shareField("sh","me","the copy")}
    <button class="btn primary block" type="submit">Make the copy</button></form>`;
}

/* ---------- toast ---------- */
let toastT=null,toastFns=[];
function toast(msg,actions){const el=$("#toast");toastFns=actions||[];
  el.innerHTML=`<span>${esc(msg)}</span>`+toastFns.map((a,i)=>`<button type="button" data-act="toastAct" data-i="${i}">${esc(a.label)}</button>`).join("");
  el.hidden=false;clearTimeout(toastT);toastT=setTimeout(hideToast,toastFns.length?6000:3500);}
function hideToast(){const el=$("#toast");if(el)el.hidden=true;clearTimeout(toastT);}

/* =====================================================================
   ACTIONS
   ===================================================================== */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const act=t.dataset.act;
  if(act!=="attendGo")e.preventDefault();
  const p=planById(PLAN),fsnap=FOLD_TRIG.has(act)?foldSnap(t):null;
  if(fsnap)queueMicrotask(()=>foldPlay(fsnap));
  switch(act){
    case"tab":{const k=t.dataset.tab;if(k==="attend"){openSheet({type:"attend",center:true});break;}go(k);break;}
    case"profile":draft=null;go("profile");break;
    case"back":history.back();break;
    case"syncNow":if(signedIn())flush();break;
    case"authMode":authMode=t.dataset.m;authMsg="";if(authMode!=="gsignup")gPending=null;renderView();window.scrollTo(0,0);break;
    case"signOut":signOut("You’re signed out on this device.");break;
    case"closeSheet":closeSheet();break;
    case"attendGo":setTimeout(closeSheet,50);break;
    case"toastAct":{const a=toastFns[+t.dataset.i];hideToast();if(a)a.fn();break;}
    case"pfilter":plansFilter=t.dataset.v;LS.set("pfilter",plansFilter);renderView();break;
    case"calView":calView=t.dataset.v==="month"?"month":"week";calOff=0;LS.set("calview",calView);renderView();break;
    case"calNav":{const v=+t.dataset.v;calOff=v?calOff+v:0;calSel="";renderView();break;}
    case"calSel":calSel=t.dataset.k;renderView();break;
    case"planSlot":openSheet({type:"newPlan",date:t.dataset.k,slot:t.dataset.slot||"",ptype:t.dataset.type||""});break;
    case"lfilter":libFilter=t.dataset.v;renderView();break;
    case"openPlan":{editFromView=false;const op=planById(t.dataset.id);go("plan",t.dataset.id,op&&isPast(op)?"review":"view");break;}
    case"setMode":{const m=t.dataset.m;if(sheet){hideSheet();planMode=m;history.replaceState(stateNow(),"");render();window.scrollTo(0,0);}else go("plan",undefined,m);break;}
    case"qnToLib":{const it=itemById(t.dataset.id);const lib=it&&exById(it.exercise);if(!lib||!canEditR(lib))break;const q=qnLines(it.live)[+t.dataset.i];if(q==null)break;
      const txt=splitQn(q).x,before=lib.notes;const pts=toPoints(lib.notes);if(!pts.some(x=>eqi(x,txt)))pts.push(txt);
      store.update("exercises",lib.id,{notes:fromPoints(pts),editedBy:who(),updated:Date.now()});
      toast(`Added to ${lib.name}’s notes in the library`,[{label:"Undo",fn:()=>{store.update("exercises",lib.id,{notes:before});}}]);break;}
    case"delRv":{if(!p)break;const lines=ptLines(p.review);const i=+t.dataset.i;const gone=lines[i];if(gone==null)break;
      lines.splice(i,1);store.update("plans",p.id,{review:ptJoin(lines)});
      toast("Note deleted",[{label:"Undo",fn:()=>{const pp=planById(p.id);if(!pp)return;const cur=ptLines(pp.review);cur.splice(i,0,gone);store.update("plans",p.id,{review:ptJoin(cur)});}}]);break;}
    case"shareNotes":{if(!p)break;const text=notesText(p);
      const fallback=()=>{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>toast("All notes copied. Paste them wherever you like."),()=>openSheet({type:"notesText"}));else openSheet({type:"notesText"});};
      if(navigator.share)navigator.share({title:"Class review: "+planTitle(p),text}).catch(err=>{if(!err||err.name!=="AbortError")fallback();});else fallback();break;}
    case"newPlan":openSheet({type:"newPlan"});break;
    case"copyPick":openSheet({type:"copyPick"});break;
    case"copyPlan":if(sheet)swapSheet({type:"copy",id:t.dataset.id});else openSheet({type:"copy",id:t.dataset.id});break;
    case"planMenu":openSheet({type:"planMenu"});break;
    case"sharePlan":if(p&&canShareR(p)){if(sheet)swapSheet({type:"share",coll:"plans",id:p.id});else openSheet({type:"share",coll:"plans",id:p.id});}break;
    case"slots":openSheet({type:"slots"});break;
    case"delSlot":{const r=S.lists.find(x=>x.id===t.dataset.id);if(!r||!isAdmin())break;store.update("lists",r.id,{ended:Date.now()});renderSheet();
      toast("Class time ended. Its past classes keep it.",[{label:"Undo",fn:()=>{store.update("lists",r.id,{ended:""});if(sheet&&sheet.type==="slots")renderSheet();}}]);break;}
    case"slotBack":{const r=S.lists.find(x=>x.id===t.dataset.id);if(!r||!isAdmin())break;store.update("lists",r.id,{ended:""});renderSheet();break;}
    case"copyEx":{const ex=exById(t.dataset.id);if(!ex)break;const id=store.add("exercises",{section:ex.section,name:ex.name,minutes:ex.minutes,description:ex.description,notes:ex.notes,addedBy:ex.addedBy||who(),editedBy:"",share:"me"});
      swapSheet({type:"ex",id});toast("Copied to your library. Only you can see the copy.");break;}
    case"editPlan":if(p&&!canEditR(p))break;if(sheet){hideSheet();planMode="edit";editFromView=true;history.replaceState(stateNow(),"");render();window.scrollTo(0,0);}
      else{editFromView=true;go("plan",undefined,"edit");render();window.scrollTo(0,0);}break;
    case"savePlan":{if(sheet)hideSheet();clearTimeout(flushT);if(queue.length)flush();
      if(editFromView){editFromView=false;planMode="view";history.back();}
      else{planMode="view";history.replaceState(stateNow(),"");render();window.scrollTo(0,0);}
      toast("Plan saved");break;}
    case"delQn":{const it=itemById(t.dataset.id);if(!it)break;const lines=qnLines(it.live);const i=+t.dataset.i;const gone=lines[i];if(gone==null)break;
      lines.splice(i,1);store.update("items",it.id,{live:lines.map(l=>"• "+l).join("\n")});
      toast("Quick note deleted",[{label:"Undo",fn:()=>{const cur=qnLines((itemById(it.id)||{}).live);cur.splice(i,0,gone);store.update("items",it.id,{live:cur.map(l=>"• "+l).join("\n")});}}]);break;}
    case"planInfo":if(sheet)swapSheet({type:"planInfo"});else openSheet({type:"planInfo"});break;
    case"askDelPlan":if(p)swapSheet({type:"confirm",center:true,title:"Delete this plan?",text:`“${planTitle(p)}” on ${fmtDay(p.date)} and its ${itemsOf(p.id).length} exercises will be removed for everyone. The library isn’t affected.`,yes:"Delete",act:"delPlan",id:p.id});break;
    case"delPlan":{const pp=planById(t.dataset.id);if(!pp)break;itemsOf(pp.id).forEach(i=>store.del("items",i.id));S.notes.filter(n=>n.plan===pp.id&&n.mine).forEach(n=>store.del("notes",n.id));store.del("plans",pp.id);finishSheet("plans","");toast("Plan deleted");break;}
    case"setType":if(p&&!eqi(p.type,t.dataset.v)){store.update("plans",p.id,{type:t.dataset.v,editedBy:who(),updated:Date.now()});}break;
    case"setLength":if(p){const l=+t.dataset.v;if(l!==p.length)store.update("plans",p.id,{length:l,editedBy:who(),updated:Date.now()});}break;
    case"otherLength":if(p)openSheet({type:"length"});break;
    case"skip":if(p){const sec=t.dataset.sec;const sk=isSkipped(p,sec)?p.skipped.filter(s=>!eqi(s,sec)):p.skipped.concat(sec);
      const data={skipped:sk,editedBy:who(),updated:Date.now()};if(!p.sections.length)data.sections=planSections(p);store.update("plans",p.id,data);}break;
    case"addSection":if(p)openSheet({type:"addSection"});break;
    case"addSec":if(p){addSection(p,t.dataset.v);closeSheet();}break;
    case"bump":{const it=itemById(t.dataset.id);if(!it)break;const nm=Math.max(1,Math.min(240,(it.minutes||0)+ +t.dataset.d));
      if(nm!==it.minutes){store.update("items",it.id,{minutes:nm,editedBy:who()});touchPlan(it.plan);}break;}
    case"editItem":openSheet({type:"item",id:t.dataset.id});break;
    case"stepMin":{const f=$("#fMin");if(f){f.value=Math.max(1,Math.min(240,(parseInt(f.value,10)||0)+ +t.dataset.d));}break;}
    case"setMin":{const f=$("#fMin");if(f)f.value=t.dataset.v;break;}
    case"moveItem":{const form=$("#itemForm");const it=form&&itemById(form.dataset.id);if(!it)break;const pp=planById(it.plan);if(!pp)break;
      const list=secItems(pp,it.section);const i=list.findIndex(x=>x.id===it.id),j=i+ +t.dataset.d;if(i<0||j<0||j>=list.length)break;
      list.forEach((x,k)=>{const want=k===i?j:k===j?i:k;if(x.order!==want+1)store.update("items",x.id,{order:want+1});});touchPlan(pp.id);
      const nl=secItems(pp,it.section),ni=nl.findIndex(x=>x.id===it.id);
      form.querySelectorAll('[data-act=moveItem]').forEach(b=>{b.disabled=(+b.dataset.d<0&&ni<=0)||(+b.dataset.d>0&&ni>=nl.length-1);});
      const m=$("#moveMsg");if(m)m.textContent=`Now ${ni+1} of ${nl.length} in ${it.section}`;break;}
    case"removeItem":{const form=$("#itemForm");const it=form&&itemById(form.dataset.id);if(!it)break;
      const copy=Object.assign({},it);delete copy.id;store.del("items",it.id);touchPlan(it.plan);closeSheet();
      toast(`Removed ${it.name}`,[{label:"Undo",fn:()=>{store.add("items",copy);touchPlan(copy.plan);}}]);break;}
    case"pick":{if(!p)break;const blk=t.dataset.block?realBlock(p,t.dataset.sec,t.dataset.block):"";openSheet({type:"pick",plan:p.id,sec:t.dataset.sec,lane:t.dataset.lane,block:blk,q:"",all:false});break;}
    case"pickAll":if(sheet&&sheet.type==="pick"){sheet.all=!sheet.all;t.setAttribute("aria-pressed",sheet.all);$("#pickList").innerHTML=pickListHTML(sheet);}break;
    case"addEx":{if(!sheet||sheet.type!=="pick")break;const pp=planById(sheet.plan),ex=exById(t.dataset.id);if(!pp||!ex)break;
      addItem(pp,sheet.sec,ex,sheet.lane!=null?{lane:sheet.lane,block:sheet.block||""}:undefined);$("#pickList").innerHTML=pickListHTML(sheet);const b=$(`#pickList [data-id="${ex.id}"]`);if(b)b.focus({preventScroll:true});break;}
    case"pickMode":if(sheet&&sheet.type==="pick"){sheet.mode=t.dataset.m;sheet.q="";renderSheet();}break;
    case"pickBelt":if(sheet&&sheet.type==="pick"){sheet.belt=t.dataset.v;renderSheet();}break;
    case"pickCat":if(sheet&&sheet.type==="pick"){sheet.cat=t.dataset.v;renderSheet();}break;
    case"addKata":{if(!sheet||sheet.type!=="pick")break;const pp=planById(sheet.plan),k=dojoKata(t.dataset.name);if(!pp||!k)break;
      const there=pickItems(pp,sheet).filter(i=>eqi(i.name,k.name));
      if(there.length){const it=there[there.length-1];store.del("items",it.id);touchPlan(pp.id);}
      else addItem(pp,sheet.sec,{id:"",name:k.name,minutes:10},sheet.lane!=null?{lane:sheet.lane,block:sheet.block||""}:undefined);
      $("#pickList").innerHTML=pickListHTML(sheet);const b=$(`#pickList [data-name="${CSS.escape(k.name)}"]`);if(b)b.focus({preventScroll:true});break;}
    case"noteNew":if(sheet)swapSheet({type:"note"});else openSheet({type:"note"});break;
    case"nbKind":NB.kind=t.dataset.v;NB.item="";if(NB.kind!=="Person"&&NB.kind!=="Assignment"){NB.picked=new Set();NB.whole=false;}renderSheet();break;
    case"nbPick":{const v=t.dataset.v;if(NB.picked.has(v))NB.picked.delete(v);else NB.picked.add(v);NB.whole=false;
      if(NB.q&&!nbPool(planById(PLAN)||{}).names.some(n=>eqi(n,v))){NB.q="";}renderSheet();break;}
    case"nbClear":NB.picked=new Set();renderSheet();break;
    case"nbWhole":NB.whole=!NB.whole;NB.picked=new Set();renderSheet();break;
    case"nbGroup":{const v=t.dataset.v;if(NB.gopen.has(v))NB.gopen.delete(v);else NB.gopen.add(v);renderSheet();break;}
    case"nbGroupAll":{const p0=planById(PLAN);if(!p0)break;const v=t.dataset.v,bx=bucket(nbPool(p0).names,groupsFor(p0)).find(b=>b.name===v),names=bx?bx.names:[];
      const all=names.every(x=>NB.picked.has(x));names.forEach(x=>{if(all)NB.picked.delete(x);else NB.picked.add(x);});NB.whole=false;renderSheet();break;}
    case"nbAway":NB.awayOpen=!NB.awayOpen;renderSheet();break;
    case"nbItem":NB.item=NB.item===t.dataset.id?"":t.dataset.id;renderSheet();break;
    case"nbShare":NB.share=!NB.share;renderSheet();break;
    case"noteDone":{const n=S.notes.find(x=>x.id===t.dataset.id);if(!n||!n.mine)break;store.update("notes",n.id,{done:isDone(n)?"":"Yes"});if(sheet&&(sheet.type==="student"||sheet.type==="consol"))renderSheet();break;}
    case"noteShare":{const n=S.notes.find(x=>x.id===t.dataset.id);if(!n||!n.mine)break;const sh=n.share==="all"?"me":"all";store.update("notes",n.id,{share:sh});toast(sh==="all"?"Shared with the instructors on this class":"Only you can see this note now");if(sheet&&sheet.type==="consol")renderSheet();break;}
    case"delNote":{const n=S.notes.find(x=>x.id===t.dataset.id);if(!n||!n.mine)break;const copy=Object.assign({},n);["id","mine","ownerId","canEdit","canShare"].forEach(k=>delete copy[k]);store.del("notes",n.id);
      const rs=()=>{if(sheet&&sheet.type==="consol")renderSheet();};rs();
      toast("Note deleted",[{label:"Undo",fn:()=>{store.add("notes",copy);rs();}}]);break;}
    case"tCheck":{if(!p)break;const id=t.dataset.id,set=tGet("tdone",p.id);const on=!set.has(id);if(on)set.add(id);else set.delete(id);tPut("tdone",p.id,set);
      const it=itemById(id);if(on&&it){const its=secItems(p,it.section);if(its.every(i=>set.has(i.id)||i.skip==="Yes")){const f=tGet("tfold",p.id);f.add(it.section);tPut("tfold",p.id,f);}}
      renderView();break;}
    case"tFold":{if(!p)break;const f=tGet("tfold",p.id),sec=t.dataset.sec;if(f.has(sec))f.delete(sec);else f.add(sec);tPut("tfold",p.id,f);renderView();break;}
    case"tJump":{if(!p)break;const T=teachNow(p);if(!T.now){toast("Everything’s ticked off. Tap End class & review when you’re done.");break;}
      const f=tGet("tfold",p.id);if(f.has(T.now.sec)){f.delete(T.now.sec);tPut("tfold",p.id,f);renderView();}
      const el=document.getElementById("ex-"+T.now.it.id);if(el)el.scrollIntoView({behavior:"smooth",block:"center"});break;}
    case"consolidate":openSheet({type:"consol"});break;
    case"tCard":{if(!p)break;const id=t.dataset.id,e=tGet("texp",p.id),c=tGet("tcol",p.id);const open=tExpanded(p,id,!!t.dataset.now);
      if(open){e.delete(id);c.add(id);QOPEN.delete(id);}else{e.add(id);c.delete(id);}tPut("texp",p.id,e);tPut("tcol",p.id,c);renderView();break;}
    case"tSkip":{const it=itemById(t.dataset.id);if(!it||!p||!canEditR(p))break;const on=it.skip!=="Yes";
      store.update("items",it.id,{skip:on?"Yes":""});if(on){const d=tGet("tdone",p.id);d.delete(it.id);tPut("tdone",p.id,d);QOPEN.delete(it.id);}
      if(on)toast(`Skipped ${it.name}`,[{label:"Undo",fn:()=>store.update("items",it.id,{skip:""})}]);break;}
    case"qnOpen":{const id=t.dataset.id;if(!p)break;QOPEN.add(id);if(planMode==="review"){const r=tGet("rexp",p.id);r.add(id);tPut("rexp",p.id,r);}
      else{const e=tGet("texp",p.id),c=tGet("tcol",p.id);e.add(id);c.delete(id);tPut("texp",p.id,e);tPut("tcol",p.id,c);}
      renderView();const el=document.getElementById("qn-"+id);if(el)el.focus();break;} // the one box that opens the keyboard by itself (Gary, Nov 20)
    case"qnClose":QOPEN.delete(t.dataset.id);renderView();break;
    case"foldAll":case"openAll":{if(!p)break;const shut=act==="foldAll",secs=planSections(p);
      const keys=secs.slice();secs.forEach(s=>{laneKeys(p,s).forEach(k=>keys.push(k));});
      const ids=itemsOf(p.id).map(i=>i.id);
      if(planMode==="review"){tPut("rfold",p.id,new Set(shut?keys.concat(["c:after","c:skip","c:notes"]):[]));tPut("rexp",p.id,new Set(shut?[]:ids));}
      else if(planMode==="edit"){tPut("efold",p.id,new Set(shut?keys.concat(["c:mix"]):[]));tPut("eexp",p.id,new Set(shut?[]:ids));}
      else{tPut("tfold",p.id,new Set(shut?keys.concat(["c:notes"]):[]));tPut("texp",p.id,new Set(shut?[]:ids));tPut("tcol",p.id,new Set(shut?ids:[]));}
      if(shut)QOPEN.clear();renderView();break;}
    case"rFold":case"eFold":{if(!p)break;const key=act==="rFold"?"rfold":"efold",f=tGet(key,p.id),k=t.dataset.k;if(f.has(k))f.delete(k);else f.add(k);tPut(key,p.id,f);renderView();break;}
    case"rCard":case"eCard":{if(!p)break;const key=act==="rCard"?"rexp":"eexp",f=tGet(key,p.id),id=t.dataset.id;if(f.has(id)){f.delete(id);QOPEN.delete(id);}else f.add(id);tPut(key,p.id,f);renderView();break;}
    case"rvOpen":{if(!p)break;RVOPEN.add(p.id);const f=tGet("rfold",p.id);f.delete("c:after");tPut("rfold",p.id,f);renderView();break;}
    case"rvClose":if(p){RVOPEN.delete(p.id);renderView();}break;
    case"skipToNext":{const it=itemById(t.dataset.id);if(!it||!p)break;const nx=nextInSlot(p);const day=p.date?DAYS[new Date(p.date).getDay()]:"";
      if(!nx){toast(`Next ${day}’s class has no plan yet. Make it first, then tap this again.`);break;}
      if(!canEditR(nx)){toast("You can’t edit next week’s plan. Ask its owner to add it.");break;}
      addItem(nx,it.section,{id:it.exercise,name:it.name,minutes:it.minutes},{note:it.note,lane:it.lane||""});toast(`Added to ${fmtDay(nx.date)}`);break;}
    case"laneOpen":{const d=t.dataset;if(d.id)openSheet({type:"lane",id:d.id});else openSheet({type:"lane",mode:"lane",sec:d.sec,block:d.block,lane:d.lane});break;}
    case"laneNew":openSheet({type:"lane",mode:"newLane",sec:t.dataset.sec,block:t.dataset.block});break;
    case"newBlock":openSheet({type:"lane",mode:"newBlock",sec:t.dataset.sec});break;
    case"blockSplit":{if(!p)break;const sec=t.dataset.sec,b=secBlocks(p,sec).find(x=>x.id===t.dataset.block);if(!b)break;
      const ids=flatIds(p,sec),snap=itemsSnap(ids);b.lanes.forEach(l=>l.items.forEach(i=>store.update("items",i.id,{block:"",lane:""})));reorderIds(ids);touchPlan(p.id);

function addSection(p,name){
  name=cleanSec(name);if(!name)return;
  const secs=planSections(p);
  const data={editedBy:who(),updated:Date.now()};
  if(!secs.some(s=>eqi(s,name)))data.sections=secs.concat(name);
  if(isSkipped(p,name))data.skipped=p.skipped.filter(s=>!eqi(s,name));
  store.update("plans",p.id,data);
  if(!listRows("Section").some(r=>eqi(r.value,name))&&!BUILTIN.some(b=>eqi(b[0],name)))store.add("lists",{list:"Section",value:name,colour:"",inNew:""});
  toast(`Added ${name}`);
}

      if(res&&res.ok){ME=res.me;LS.set("me",JSON.stringify(ME));S=normalize(res.state);queue.forEach(applyLocal);draft=null;toast("Saved. You’re shown as "+who());history.back();return;}
      if(res&&res.error==="bad_token"){signOut("Please sign in again.");return;}
      btn.disabled=false;btn.textContent="Save";$("#pMsg").textContent=(res&&res.message)||"Couldn’t save. Try again.";
    }).catch(()=>{btn.disabled=false;btn.textContent="Save";$("#pMsg").textContent="Can’t reach the dojo sheet. Check your connection and try again.";});
    return;}
  if(id==="pwForm"){
    const btn=f.querySelector("[type=submit]");btn.disabled=true;
    callApi({token:TOKEN,ops:[],password:{current:String(fd.get("current")||""),next:String(fd.get("next")||"")}}).then(res=>{
      btn.disabled=false;
      if(res&&res.ok){ME=res.me;LS.set("me",JSON.stringify(ME));f.reset();$("#pwMsg").textContent="Password saved.";return;}
      if(res&&res.error==="bad_token"){signOut("Please sign in again.");return;}
      $("#pwMsg").textContent=(res&&res.message)||"Couldn’t save. Try again.";
    }).catch(()=>{btn.disabled=false;$("#pwMsg").textContent="Can’t reach the dojo sheet. Check your connection and try again.";});
    return;}
  if(f.classList.contains("nform")){addClassNote(f);return;}
  if(f.classList.contains("rform")){const p=planById(f.dataset.id);const inp=f.querySelector("input");const txt=(inp.value||"").replace(/\s+/g," ").trim();if(!p||!txt)return;
    const lines=ptLines(p.review);lines.push(txt);inp.value="";store.update("plans",p.id,{review:ptJoin(lines)});
    setTimeout(()=>{const ni=document.getElementById("rv-"+p.id);if(ni)ni.focus({preventScroll:true});},0);return;}
  if(f.classList.contains("qform")){const it=itemById(f.dataset.id);const inp=f.querySelector("input");const txt=(inp.value||"").replace(/\s+/g," ").trim();if(!it||!txt)return;
    const time=new Date().toLocaleTimeString("en-CA",{hour:"numeric",minute:"2-digit"});
    const lines=qnLines(it.live);lines.push(time+" · "+txt);inp.value="";
    store.update("items",it.id,{live:lines.map(l=>"• "+l).join("\n")});
    setTimeout(()=>{const ni=document.getElementById("qn-"+it.id);if(ni)ni.focus({preventScroll:true});},0);return;}
  if(id==="itemForm"){const it=itemById(f.dataset.id);if(!it){closeSheet();return;}
    const m=Math.max(1,Math.min(240,parseInt(val("minutes"),10)||it.minutes||1));const data={note:fromPoints(readPoints(f,"note"))};
    if(m!==it.minutes){data.minutes=m;data.editedBy=who();}
    store.update("items",it.id,data);
    const lib=exById(it.exercise);if(val("scope")==="lib"&&lib&&lib.minutes!==m)store.update("exercises",lib.id,{minutes:m,editedBy:who()});
    touchPlan(it.plan);closeSheet();toast("Saved");return;}
  if(id==="exForm"){const s=sheet;if(!s)return;
    const data={name:val("name").slice(0,80),section:val("section"),minutes:Math.max(1,Math.min(240,parseInt(val("minutes"),10)||10)),description:fromSteps(readPoints(f,"steps")),notes:fromPoints(readPoints(f,"notes"))};
    if(!data.name)return;
    const creator=val("creator").slice(0,60)||who();
    if(f.querySelector(".sharebox"))data.share=readShare(f,"sh");
    if(s.id){const ex=exById(s.id);if(ex&&!canShareR(ex))delete data.share;store.update("exercises",s.id,Object.assign(data,{addedBy:creator,editedBy:who()}));closeSheet();toast("Saved to the library");return;}
    const exId=store.add("exercises",Object.assign(data,{addedBy:creator,editedBy:""}));
    if(s.addTo){const pp=planById(s.addTo);const ln=s.back&&s.back.lane!=null&&eqi(s.back.sec,data.section)?{lane:s.back.lane,block:s.back.block||""}:undefined;if(pp)addItem(pp,data.section,Object.assign({id:exId},data),ln);
      if(s.back){swapSheet(Object.assign({},s.back,{sec:s.back.sec}));toast(`Added ${data.name}`);return;}}
    closeSheet();toast(`Added ${data.name} to the library`);return;}
  if(id==="newPlanForm"){
    const time=readTime(fd);if(String(fd.get("slot"))==="custom"&&!time){toast("Set a start and end time, with the end after the start.");return;}
    saveSlotIf(fd,time);
    const pid=store.add("plans",{date:keyMs(val("date")||todayKey()),time,focus:val("focus").slice(0,60),type:val("type")||classTypes()[0],length:readLength(fd,105),
      sections:defaultSections(),skipped:[],share:readShare(f,"sh"),addedBy:who(),editedBy:who(),updated:Date.now()});
    editFromView=false;finishSheet("plan",pid,"edit");toast("Plan created. Tap Save plan when you’re done.");return;}
  if(id==="copyForm"){const src=planById(f.dataset.id);if(!src){closeSheet();return;}
    const time=readTime(fd);if(String(fd.get("slot"))==="custom"&&!time){toast("Set a start and end time, with the end after the start.");return;}
    saveSlotIf(fd,time);
    const pid=store.add("plans",{date:keyMs(val("date")||todayKey()),time,focus:val("focus").slice(0,60),type:val("type")||src.type,length:readLength(fd,src.length||105),
      sections:planSections(src),skipped:src.skipped.slice(),split:(src.split||[]).slice(),share:readShare(f,"sh"),addedBy:who(),editedBy:who(),updated:Date.now()});
    itemsOf(src.id).forEach(i=>store.add("items",{plan:pid,section:i.section,order:i.order,name:i.name,minutes:i.minutes,note:i.note,exercise:i.exercise,addedBy:i.addedBy,editedBy:i.editedBy,lane:i.lane||"",block:i.block||""}));
    editFromView=false;finishSheet("plan",pid,"edit");toast("Copied. Make any changes, then tap Save plan.");return;}
  if(id==="infoForm"){const p=planById(PLAN);if(!p){closeSheet();return;}
    const time=readTime(fd);if(String(fd.get("slot"))==="custom"&&!time){toast("Set a start and end time, with the end after the start.");return;}
    saveSlotIf(fd,time);
    const data={date:keyMs(val("date")||todayKey()),time,focus:val("focus").slice(0,60),editedBy:who(),updated:Date.now()};
    const tm=parseTime(time);if(tm&&time!==p.time)data.length=tm.mins;
    store.update("plans",p.id,data);closeSheet();return;}
  if(id==="shareForm"){const coll=f.dataset.coll;const r=coll==="plans"?planById(f.dataset.id):exById(f.dataset.id);if(!r||!canShareR(r)){closeSheet();return;}
    const sh=readShare(f,"sh");store.update(coll,r.id,{share:sh});closeSheet();toast("Now visible to: "+shareLabel(sh));return;}
  if(id==="slotForm"){if(!isAdmin())return;const d=+val("day");const a=toMin(val("tStart")),b=toMin(val("tEnd"));
    if(a==null||b==null||b<=a){$("#slotMsg").textContent="The end time has to be after the start.";return;}
    store.add("lists",{list:"Timeslot",value:(DAYS[d].slice(0,3)+" "+fromMin(a)+"-"+fromMin(b)+" "+val("label")).trim(),colour:"",inNew:""});renderSheet();toast("Timeslot added");return;}
  if(id==="lengthForm"){const p=planById(PLAN);const l=(parseInt(val("h"),10)||0)*60+(parseInt(val("m"),10)||0);
    if(p&&l>0)store.update("plans",p.id,{length:Math.min(600,l),editedBy:who(),updated:Date.now()});closeSheet();return;}
  if(id==="secForm"){const p=planById(PLAN);if(p)addSection(p,val("name"));closeSheet();return;}
});
document.addEventListener("click",e=>{if(planListOpen&&!e.target.closest(".pswrap")&&!e.target.closest("[data-act=planStep]")){planListOpen=false;renderView();}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&planListOpen){planListOpen=false;renderView();}
  if(e.key==="Escape"&&sheet)closeSheet();
  const t=e.target;if(!t.classList||!t.classList.contains("pt"))return;
  const row=t.closest(".ptrow"),box=row.parentElement;
  if(e.key==="Enter"){e.preventDefault();if(t.value.trim())addPointAfter(box,row);}
  if(e.key==="Backspace"&&!t.value&&box.children.length>1){e.preventDefault();const prev=row.previousElementSibling||row.nextElementSibling;row.remove();renumber(box);const pi=prev.querySelector("textarea");pi.focus();pi.setSelectionRange(pi.value.length,pi.value.length);}
});

function boot(){
  readLinkParams();
  if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  history.replaceState({t:"plans",p:PLAN,root:true},"");
  render();
  if(signedIn())flush();
  fetchConfig();
  if(signedIn())loadKata();
  // Coming back from the Kata Tracker: refresh the "still need it" counts
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&signedIn())loadKata();});
}
boot();
})();
</script>
<script>
/* ===== Motion pack: the same copy in each of Gary's apps (Climb Buddy is the model) =====
   Panels rise from the bottom and slip back down, toasts rise and slip away, a new screen's
   pieces rise in one after another, and a row that appears on the same screen rises in.
   Unhurried on purpose; off when the phone asks for reduced motion.
   Each app calls MP.init({...}) with its own selectors (see the call under this block).
   - wrap:  the panel's outer element that the app shows/hides with .hidden (or adds/removes)
   - panel: the panel inside wrap; scrim: the dim layer inside wrap ("self" = wrap is the dim layer)
   - toast: elements the app shows/hides with .hidden (selector list)
   - root:  where screens are drawn; items: what rises in on a new screen
   MP.out(el, done) plays the slip-away, then calls done (for apps that remove elements).
   MP.watch(el) gives any element the slip-away when the app sets el.hidden = true. */
window.MP = (function () {
  const ON = !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const IN = "cubic-bezier(.2,.8,.25,1)", OUT_MS = 380;
  const HID = Object.getOwnPropertyDescriptor(HTMLElement.prototype, "hidden");
  const $$ = (s, r) => [...(r || document).querySelectorAll(s)];

  function css(c) {
    const W = c.wrap, P = c.panel ? W + " " + c.panel : "", self = c.scrim === "self";
    const SC = c.scrim && !self ? W + " " + c.scrim : "", T = c.toast || "";
    const rules = [
      "@keyframes mpRise{from{opacity:0;translate:0 26px}to{opacity:1;translate:0 0}}",
      "@keyframes mpUp{from{translate:0 100%}to{translate:0 0}}",
      "@keyframes mpDown{from{translate:0 0}to{translate:0 105%}}",
      "@keyframes mpSideIn{from{opacity:0;translate:56px 0}to{opacity:1;translate:0 0}}",
      "@keyframes mpSideOut{from{opacity:1;translate:0 0}to{opacity:0;translate:56px 0}}",
      "@keyframes mpIn{from{opacity:0}to{opacity:1}}",
      "@keyframes mpOut{from{opacity:1}to{opacity:0}}",
      "@keyframes mpToastIn{from{opacity:0;translate:0 64px}to{opacity:1;translate:0 0}}",
      "@keyframes mpToastOut{from{opacity:1;translate:0 0}to{opacity:0;translate:0 64px}}",
      `.mp-rise{animation:mpRise .55s ${IN} backwards}`,
    ];
    if (P) rules.push(`html ${P}{animation:mpUp .5s ${IN} backwards}`, `html ${W}.mp-out ${c.panel}{animation:mpDown ${OUT_MS}ms cubic-bezier(.5,0,.75,.2) forwards}`,
      `@media (min-width:${c.wide || 900}px){html ${P}{animation-name:mpSideIn}html ${W}.mp-out ${c.panel}{animation-name:mpSideOut}}`);
    if (SC) rules.push(`html ${SC}{animation:mpIn .4s ease backwards}`, `html ${W}.mp-out ${c.scrim}{animation:mpOut ${OUT_MS}ms ease forwards}`);
    if (self) rules.push(`html ${W}{animation:mpIn .4s ease backwards}`, `html ${W}.mp-out{animation:mpOut ${OUT_MS}ms ease forwards}`);
    if (W) rules.push(`${W}.mp-out{pointer-events:none}`);
    if (T) T.split(",").forEach((t) => rules.push(`html ${t}:not([hidden]){animation:mpToastIn .45s ${IN} backwards}`, `html ${t}.mp-out{animation:mpToastOut ${OUT_MS - 20}ms ease forwards;pointer-events:none}`));
    rules.push("@media (prefers-reduced-motion:reduce){.mp-rise,.mp-out,.mp-out *" + (P ? "," + P : "") + (SC ? "," + SC : "") + (self ? "," + W : "") + (T ? "," + T : "") + "{animation:none!important}}");
    const s = document.createElement("style"); s.id = "mp-css"; s.textContent = rules.join("\n"); document.head.appendChild(s);
  }

  /** Setting el.hidden = true plays the slip-away first; the app still reads el.hidden as true straight away. */
  function watch(el) {
    if (!el || el.__mp) return el; el.__mp = 1;
    let want = el.hasAttribute("hidden"), t = 0;
    Object.defineProperty(el, "hidden", {
      configurable: true,
      get() { return want; },
      set(v) {
        v = !!v;
        if (!v) { clearTimeout(t); want = false; el.classList.remove("mp-out"); HID.set.call(el, false); return; }
        if (want) return; // already hiding: let the slip-away finish
        want = true; clearTimeout(t);
        if (!ON || HID.get.call(el)) { HID.set.call(el, true); return; }
        el.classList.add("mp-out");
        t = setTimeout(() => { el.classList.remove("mp-out"); HID.set.call(el, true); }, OUT_MS);
      },
    });
    return el;
  }
  /** For apps that remove the element: play the slip-away, then done(). */
  function out(el, done) {
    if (!el || !ON) { if (done) done(); return; }
    el.classList.add("mp-out");
    setTimeout(() => { if (done) done(); }, OUT_MS);
  }

  /** A screen's identity: its heading (numbers ignored) and whichever tab or nav item is current. */
  function sigOf(root) {
    const h = root.querySelector("h1, h2");
    return [location.hash, h ? h.textContent.replace(/[\d.,$%]+/g, "").trim() : "",
      ...$$('[aria-current]:not([aria-current="date"]):not([aria-current="false"]), [aria-selected="true"], [role=tab].on, .tab.on')
        .map((e) => (e.dataset.tab || e.dataset.v || e.dataset.sec || e.textContent || "").trim().slice(0, 30))].join("|");
  }
  function screens(c) {
    const root = document.querySelector(c.root); if (!root) return;
    const items = c.items || "main > *, :scope > header ~ *, .list > *";
    let sig = null, ids = new Set();
    const run = () => {
      const s = c.sig ? String(c.sig()) : sigOf(root);
      const now = $$("[data-id]", root);
      if (ON) {
        if (s !== sig) {
          // A new screen: its pieces rise up one after another
          $$(items, root).filter((el) => el.offsetParent !== null || getComputedStyle(el).position === "fixed").slice(0, 14)
            .forEach((el, k) => { el.classList.remove("mp-rise"); void el.offsetWidth; el.classList.add("mp-rise"); el.style.animationDelay = k * 70 + "ms"; });
        } else if (ids.size) {
          // Same screen, something new (added here or synced in): just that row rises in
          const fresh = new Set();
          now.forEach((el) => { if (!ids.has(el.dataset.id)) fresh.add(el.closest(c.row || "li, tr, .card, .row, .item") || el); });
          if (fresh.size && fresh.size < 6) fresh.forEach((el) => { el.style.animationDelay = ""; el.classList.add("mp-rise"); });
        }
      }
      sig = s; ids = new Set(now.map((el) => el.dataset.id));
    };
    new MutationObserver(run).observe(root, { childList: true });
    run();
  }

  function init(c) {
    css(c);
    if (c.wrap && c.hide !== "remove") $$(c.wrap).forEach(watch);
    if (c.toast) $$(c.toast).forEach(watch);
    if (c.root) screens(c);
  }
  return { init, out, watch, on: ON, ms: OUT_MS };
})();
</script>
<script>
/* Keep panels above the phone keyboard. Android Chrome resizes the page (interactive-widget); iPhones only shrink
   the visual viewport, so lift the panel by the keyboard's height, then bring a focused search box to the top. */
(function(){
  const wrap=document.getElementById("sheetWrap"),vv=window.visualViewport;
  function lift(inp){const sh=inp&&inp.closest(".sheet:not(.center)");if(!sh)return;sh.classList.add("finding");
    requestAnimationFrame(()=>{sh.scrollTop+=inp.getBoundingClientRect().top-sh.getBoundingClientRect().top-10;});}
  function fit(){if(!vv||!wrap)return;const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);
    wrap.style.bottom=kb>60?kb+"px":"";wrap.style.top=kb>60?vv.offsetTop+"px":"";
    const a=document.activeElement;if(kb>60&&a&&a.matches&&a.matches(".sheet input[type=search]"))lift(a);}
  if(vv){vv.addEventListener("resize",fit);vv.addEventListener("scroll",fit);}
  document.addEventListener("focusin",e=>{const t=e.target;if(t&&t.matches&&t.matches(".sheet input[type=search]")){lift(t);setTimeout(()=>lift(t),400);}});
})();
</script>
<script>MP.init({wrap:"#sheetWrap",panel:".sheet",scrim:".scrim",toast:"#toast",root:"#view"});</script>
