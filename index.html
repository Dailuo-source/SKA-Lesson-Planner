<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<meta name="color-scheme" content="light only">
<title>SKA Lesson Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SKA Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: one-column phone app — red header, scrolling view, fixed bottom tab bar, bottom sheets for details */
:root{
  --red:#C8102E; --red-d:#A00D25; --red-soft:#FDE7EA; --red-tint:#FDF1F2;
  --ink:#111111; --ink2:#3A3A3A; --muted:#5E5E5E; --line:#E2E2E2; --line2:#D6D6D6; --sunk:#F5F5F5; --bg:#FFFFFF;
  --scrim:rgba(0,0,0,.55);
  --f-d:"M PLUS Rounded 1c","Avenir Next",system-ui,sans-serif;
  --f-b:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabh:66px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--red-d)}
:focus-visible{outline:3px solid rgba(200,16,46,.5);outline-offset:2px}
svg{flex:none}

.top{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px 14px}
.top .logo{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:contain;padding:2px;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--f-d);font-weight:800;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:block;font-size:12px;font-weight:700;color:#fff;opacity:.92;background:none;border:0;padding:2px 0;text-align:left;min-height:20px}
.sync.bad{opacity:1;text-decoration:underline}
.me{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--red);border:0;font-weight:800;font-size:15px;flex:none;display:flex;align-items:center;justify-content:center}

main{padding:18px 16px calc(var(--tabh) + 32px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
body.notabs main{padding-bottom:32px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:16px;font-size:12px;font-weight:700;color:var(--ink2);min-height:52px}
.tabs button[aria-current=page]{background:var(--red);color:#fff;font-weight:800}
.tabs svg{width:22px;height:22px}

h1{font-family:var(--f-d);font-weight:800;font-size:26px;line-height:1.2;margin:0}
.kicker{font-size:13px;font-weight:700;color:var(--muted)}
.small{font-size:12.5px;font-weight:700;color:var(--muted)}
.label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:0 0 8px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.mt{margin-top:16px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line2);background:#fff;font-size:15px;font-weight:800;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;position:relative}
.chip.sm{height:44px;font-size:14px;padding:0 14px}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.rchip input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.rchip:has(input:checked){background:var(--red);border-color:var(--red);color:#fff}
.rchip:has(input:focus-visible){outline:3px solid rgba(200,16,46,.5);outline-offset:2px}

.card{background:#fff;border:1.5px solid var(--line);border-radius:20px}
.timecard{padding:16px;display:flex;flex-direction:column;gap:12px}
.big{font-family:var(--f-d);font-size:32px;font-weight:800;line-height:1}
.pill{font-size:13px;font-weight:800;padding:6px 10px;border-radius:12px;background:var(--ink);color:#fff;white-space:nowrap}
.pill.over{background:var(--red)}
.bar{height:12px;border-radius:6px;background:#EFEFEF;display:flex;overflow:hidden;gap:2px}
.bar.thin{height:8px;border-radius:4px}
.bar span{height:100%;display:block}

.section{overflow:hidden}
.shead{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px}
.badge{width:28px;height:28px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
.shead h2{margin:0;font-family:var(--f-d);font-size:16px;font-weight:800;line-height:1.3}
.textbtn{min-height:44px;padding:0 12px;border:0;background:none;border-radius:22px;font-size:13px;font-weight:800;color:var(--ink2)}
.item{padding:10px 8px 12px 16px;border-top:1px solid #ECECEC}
.item .r1{display:flex;align-items:center;gap:8px}
.iname{flex:1;min-width:0;font-size:16px;font-weight:800;overflow-wrap:anywhere;line-height:1.3}
ul.pts{margin:0 8px 6px 0;padding-left:18px;font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
ul.pts li{margin:1px 0}
.points{display:flex;flex-direction:column;gap:8px}
.ptrow{display:flex;align-items:flex-start;gap:6px}
.ptrow .dot{width:14px;text-align:center;font-weight:800;color:var(--red);flex:none;padding-top:12px}
.ptrow .dot.num{width:auto;min-width:24px;text-align:left;font-size:15px;white-space:nowrap}
ol.steps{list-style:none;counter-reset:st;margin:0 8px 6px 0;padding:0;font-size:14px;color:var(--ink2)}
ol.steps li{counter-increment:st;margin:3px 0}
ol.steps li::before{content:counter(st) ". ";font-weight:800;color:var(--ink)}
/* Each point is a box that wraps and grows with its text */
.ptrow textarea.pt{flex:1;min-width:0;height:44px;min-height:44px;padding:10px 14px;line-height:1.4;resize:none;overflow:hidden;overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
details.libref{background:var(--sunk);border-radius:14px;padding:12px 14px;margin:0 0 16px}
details.libref summary{font-size:14px;font-weight:800;cursor:pointer;min-height:24px}
details.libref p{margin:8px 0 6px;font-size:14px;white-space:pre-line;color:var(--ink2)}
details.libref h3{margin:10px 0 4px;font-size:13px;font-weight:800;color:var(--muted)}
.item .r2{display:flex;align-items:center;gap:8px;padding-right:8px}
.meta{flex:1;min-width:0;font-size:12.5px;font-weight:700;line-height:1.35;color:var(--muted)}
.iconbtn{width:44px;height:44px;flex:none;border:0;background:none;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--ink2);text-decoration:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.round{background:var(--sunk);color:var(--ink)}
.iconbtn.outline{border:1.5px solid var(--line);color:var(--ink)}
.stepper{display:flex;align-items:center;background:var(--sunk);border-radius:22px;flex:none}
.stepper button{width:44px;height:44px;border:0;background:none;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.stepper svg{width:18px;height:18px}
.stepper .v{min-width:58px;text-align:center;font-size:16px;font-weight:800}
.addrow{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:12px 16px;border:0;border-top:1px dashed var(--line2);background:none;font-size:14px;font-weight:800;text-align:left}
.addrow svg{width:18px;height:18px}
.dashed{width:100%;min-height:56px;border-radius:20px;border:2px dashed #CFCFCF;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:800;color:var(--ink)}
.dashed svg{width:20px;height:20px;color:var(--red)}

.btn{min-height:52px;border-radius:26px;border:0;padding:0 20px;font-size:16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--red);color:#fff}
.btn.outline{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:#fff;color:var(--red-d);border:1.5px solid #EDB9BF}
.btn.small{min-height:44px;font-size:14px;padding:0 16px;border-radius:22px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.square{border-radius:18px;min-height:56px;font-size:15px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1;padding:0 12px;white-space:nowrap;gap:6px}

.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:24px;border:1.5px solid var(--line2);background:#fff}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;height:44px}
.search svg{width:20px;height:20px;color:var(--muted)}
.excard{display:flex;align-items:center;gap:8px;padding:12px 8px 12px 16px}
.excard .body{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.excard .nm{font-size:16px;font-weight:800;overflow-wrap:anywhere}
.excard .ds{font-size:13px;font-weight:600;color:var(--ink2);white-space:pre-line}
.tagline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted)}
.tag{padding:2px 8px;border-radius:8px;font-size:12px;font-weight:800;display:inline-block}
.tag.dark{background:var(--ink);color:#fff}
.tag.red{background:var(--red);color:#fff}
.tag.creator{background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:4px}
.tag.creator svg{width:12px;height:12px}
/* Creator label tucked into the top-right corner of an exercise */
.cornered{position:relative}
.ctag{position:absolute;top:0;right:0;display:inline-flex;align-items:center;gap:4px;background:var(--ink);color:#fff;font-size:11px;font-weight:800;line-height:1.2;padding:4px 10px 4px 9px;border-radius:0 18px 0 12px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.ctag svg{width:11px;height:11px;flex:none}
.item .ctag{border-radius:0 0 0 10px}
.pickrow .ctag{border-radius:0 14px 0 10px}
.excard.cornered{padding-top:30px}
.item.cornered{padding-top:28px}
.pickrow.cornered{padding-top:26px}

.plan{display:flex;align-items:center;gap:8px;padding:14px 8px 14px 16px}
.plan.next{border-color:var(--red)}
.plan .body{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.plan .t{font-size:17px;font-weight:800;margin-right:2px}
.plan .l{font-size:13px;font-weight:700;color:var(--muted)}
.grouph{font-size:14px;font-weight:800;color:var(--muted);margin:6px 4px 0}
.empty{padding:22px 18px;text-align:center;color:var(--ink2);font-weight:600}
.empty p{margin:0 0 14px}

.field{display:flex;flex-direction:column;gap:8px;margin:0 0 16px;border:0;padding:0;min-width:0}
.field>label,.field>legend{font-size:14px;font-weight:800;padding:0}
.field legend{margin-bottom:8px}
.inp{height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line2);font-size:16px;background:#fff;width:100%;color:var(--ink)}
textarea.inp{height:auto;min-height:72px;padding:12px 14px;resize:vertical;line-height:1.4}
select.inp{appearance:auto}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line2);cursor:pointer}
.opt:has(input:checked){border:2px solid var(--red);background:var(--red-tint)}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--red);flex:none}
.opt b{display:block;font-size:15px}
.opt span span{font-size:13px;font-weight:600;color:var(--muted)}
.switch{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 14px;border-radius:14px;border:1.5px solid var(--line2);background:#fff;text-align:left;color:var(--ink)}
.switch .trk{width:52px;height:32px;flex:none;border-radius:16px;padding:3px;display:flex;background:#9A9A9A;transition:background .15s}
.switch .trk i{width:26px;height:26px;border-radius:13px;background:#fff;transition:transform .15s}
.switch[aria-pressed=true] .trk{background:var(--red)}
.switch[aria-pressed=true] .trk i{transform:translateX(20px)}
.preview{border-radius:18px;background:var(--sunk);padding:14px 16px}
.preview .nm{font-family:var(--f-d);font-size:22px;font-weight:800;color:var(--red)}
.avatar{width:64px;height:64px;flex:none;border-radius:32px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-d);font-weight:800;font-size:24px}

.sheetwrap{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim);border:0;width:100%;padding:0}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet.center{bottom:auto;top:50%;transform:translateY(-50%);left:20px;right:20px;border-radius:24px;padding:24px 20px 20px;text-align:center;max-width:420px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sh{display:flex;align-items:flex-start;gap:8px;margin-bottom:14px}
.sh h2{margin:0;font-family:var(--f-d);font-size:22px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.ring{width:56px;height:56px;border-radius:28px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.ring svg{width:28px;height:28px}
.center h2{margin:0 0 8px;font-family:var(--f-d);font-size:22px;font-weight:800}
.center p{margin:0 0 18px;font-size:15px;font-weight:600;color:var(--ink2);line-height:1.45}
.minbig{display:flex;align-items:center;gap:12px}
.minbig button{width:52px;height:52px;border-radius:26px;border:0;background:var(--sunk);display:flex;align-items:center;justify-content:center}
.minbig button svg{width:22px;height:22px}
.minbig input{flex:1;min-width:0;text-align:center;font-family:var(--f-d);font-size:34px;font-weight:800;border:0;border-bottom:2px solid var(--line2);height:56px;background:none;border-radius:0}
.minbig .unit{font-size:16px;font-weight:700;color:var(--muted)}
.qgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pickrow{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:10px 12px;border:1.5px solid var(--line);border-radius:16px;background:#fff;text-align:left;margin-bottom:8px;color:var(--ink)}
.pickrow .nm{flex:1;min-width:0;font-size:15px;font-weight:800;overflow-wrap:anywhere}
.pickrow .m{font-size:14px;font-weight:800}
.pickrow>svg{width:20px;height:20px;color:var(--ink2)}
.segtabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--sunk);border-radius:22px;padding:4px;margin:0 0 12px}
.segtabs button{height:44px;border:0;border-radius:18px;background:transparent;font-size:15px;font-weight:800;color:var(--ink2)}
.kmeta{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink2);margin-top:3px}
.kdot{width:12px;height:12px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28);flex:none;display:inline-block}
.kcat{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 6px;font-family:var(--f-d);font-size:16px;font-weight:800;color:var(--ink)}
.kcat:first-child{margin-top:4px}
.kcount{font-size:12.5px;font-weight:800;color:var(--ink2);background:#F1F1F1;border-radius:10px;padding:2px 9px}
.kbelt{display:flex;align-items:center;gap:7px;margin:8px 4px 6px;font-size:13px;font-weight:800;color:var(--ink2)}
.kbelts .kdot{margin-right:6px}
.kneed{display:block;font-size:13px;font-weight:800;color:#8E0B21;margin-top:2px}
.kupd{padding:16px;border:2px solid var(--red);background:var(--red-tint)}
.kupd h2{margin:0 0 2px;font-family:var(--f-d);font-size:18px;font-weight:800}
.kgo{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;margin-top:10px;padding:6px 14px;border:0;border-radius:16px;background:var(--red);color:#fff;text-align:left}
.kgo b{display:block;font-size:16px;font-weight:800}
.kgo .grow>span{display:block;font-size:12.5px;font-weight:700;color:#FFE3E7}
.kgo svg{width:20px;height:20px}
.pickrow .ok{font-size:12px;font-weight:800;color:#0F5E54;background:#DDF3EF;padding:2px 8px;border-radius:8px}
.menu .btn{margin-bottom:10px}
.msg{min-height:20px;font-size:13px;font-weight:700;color:var(--muted);margin:8px 0 0}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom));z-index:60;background:#111;color:#fff;border-radius:16px;padding:10px 8px 10px 16px;display:flex;align-items:center;gap:8px;font-weight:700;max-width:600px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.2)}
body.notabs .toast{bottom:calc(16px + env(safe-area-inset-bottom))}
.toast span{flex:1}
.toast button{background:none;border:0;color:#FF9AA8;font-weight:800;min-height:40px;padding:0 10px}
.connect{max-width:460px;margin:0 auto}
.editbanner{display:flex;align-items:center;gap:8px;background:var(--red-tint);border:1.5px solid #F2C9CF;color:var(--red-d);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700}
.editbanner svg{width:18px;height:18px}
.savebar{position:sticky;bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom));z-index:5;padding-top:6px}
.savebar .btn{box-shadow:0 6px 18px rgba(200,16,46,.3)}
.vsec{display:flex;flex-direction:column;gap:10px}
.vsec-h{display:flex;align-items:center;gap:10px;border-bottom:3px solid;padding:4px 2px 8px}
.vsec-h h2{margin:0;font-family:var(--f-d);font-size:18px;font-weight:800}
.vex{padding:14px 16px 12px}
.vex.cornered{padding-top:30px}
.vex-top{display:flex;align-items:center;gap:10px}
.vex-top h3{margin:0;flex:1;min-width:0;font-size:18px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.vtime{font-size:13px;font-weight:800;padding:3px 8px;border-radius:8px;flex:none}
.vmin{font-size:15px;font-weight:800;flex:none}
.vlabel{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 4px}
ol.vsteps{font-size:16px;line-height:1.45;color:var(--ink)}
ol.vsteps li{margin:6px 0}
ul.vpts{font-size:15px;line-height:1.45;color:var(--ink2);margin-bottom:0}
ul.vpts.mine{color:var(--red-d)}
.qnlist{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:4px}
.qnlist li{display:flex;align-items:center;gap:8px;background:#FFF7E0;border-radius:10px;padding:2px 2px 2px 10px;font-size:15px;overflow-wrap:anywhere}
.qtime{font-size:12px;font-weight:800;color:#7A5A00;flex:none}
.qform{display:flex;gap:8px;align-items:center}
.qform .inp{height:44px;flex:1;min-width:0}
.qnlist li .qacts{flex-basis:100%;display:flex;gap:6px;padding:0 0 4px}
.qnlist li.wrap{flex-wrap:wrap}
.qlib{border:0;background:#fff;border-radius:10px;min-height:34px;padding:0 10px;font-size:13px;font-weight:800;color:var(--ink);display:inline-flex;align-items:center;gap:6px;box-shadow:inset 0 0 0 1.5px var(--line2)}
.qlib svg{width:16px;height:16px}
.qlib.done{box-shadow:none;background:#DDF3EF;color:#0F5E54}
.rvhead{padding:16px}
.rvhead h2{margin:0 0 2px;font-family:var(--f-d);font-size:18px;font-weight:800}
.rvsum{display:flex;gap:8px;flex-wrap:wrap}
.rvsum span{font-size:13px;font-weight:800;padding:6px 10px;border-radius:12px;background:var(--sunk);color:var(--ink)}
.rvsum span.on{background:var(--red-tint);color:var(--red-d)}
.rex{padding:12px 14px;border-left:5px solid}
.rex .vex-top h3{font-size:16px}
.rex.quiet{padding-top:10px;padding-bottom:10px}
.rvlist{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:4px}
.rvlist li{display:flex;align-items:center;gap:8px;background:var(--red-tint);border-radius:10px;padding:2px 2px 2px 12px;font-size:15px;overflow-wrap:anywhere}
.tag.lock{background:var(--sunk);color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.tag.lock svg,.tag.by svg{width:12px;height:12px}
.tag.by{background:#FFF7E0;color:#7A5A00;display:inline-flex;align-items:center;gap:4px}
.sharebox .opt b svg{width:18px;height:18px;flex:none}
.sharebox>.opt{align-items:center}
.ppl{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.ppl .opt{padding:10px 12px;align-items:center}
.ppl .opt b{font-size:15px}
.adm{font-size:11px;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.timein{display:flex;align-items:center;gap:8px}
.timein .inp{flex:1;min-width:0}
.viewonly{display:flex;align-items:center;gap:8px;background:#FFF7E0;border:1.5px solid #F0DDA0;color:#5E4500;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700}
.viewonly svg{width:18px;height:18px;flex:none}
.slotday{font-size:13px;font-weight:800;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.slotrow{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:6px;font-weight:700}
.lead{margin:0;font-weight:600;color:var(--ink2)}
.gwrap{display:flex;justify-content:center;min-height:44px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700;font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{background:var(--red-soft);color:var(--red-d);border-radius:14px;padding:12px 14px;font-weight:700;margin:0 0 16px}
@media (min-width:700px){.tabs{max-width:640px;margin:0 auto;border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0}}
</style>

<body>
<header class="top">
  <img class="logo" src="logo-96.png" alt="Scarborough Academy of Karate">
  <div class="brand"><b>SKA Lesson Planner</b><button class="sync" id="sync" data-act="syncNow" type="button"></button></div>
  <button class="me" id="me" data-act="profile" type="button" hidden></button>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabs" id="tabs" aria-label="Main"></nav>
<div class="sheetwrap" id="sheetWrap" hidden>
  <button class="scrim" type="button" data-act="closeSheet" aria-label="Close" tabindex="-1"></button>
  <div class="sheet" id="sheetBox" role="dialog" aria-modal="true"><div id="sheetBody"></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";
/* =====================================================================
   CONFIG — the sheet's web app link. A phone link with #api=… overrides it.
   ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbz7Id0hiGIUFrRDDywyo8o3Ytobt2dnCbeo6BhRW-J7bCeBOZ4rSlz1wmpt3g8Tpe5f/exec";
const ATTEND_URL = "https://my.musterhall.app/today"; // the Lists tab's "Attendance link" overrides this
const KATA_URL = "https://script.google.com/macros/s/AKfycbwnmXKngbUjC-NAThAD_s7R2JdaKGX5e9R3cjJYdQlkEoWbe84nbdILOKVVsGiRbIlpqw/exec"; // the SKA Kata Tracker's Apps Script (summary feed)

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eqi=(a,b)=>String(a==null?"":a).trim().toLowerCase()===String(b==null?"":b).trim().toLowerCase();
const LS={get(k,d){try{const v=localStorage.getItem("skal."+k);return v==null?d:v;}catch(e){return d;}},set(k,v){try{localStorage.setItem("skal."+k,v);}catch(e){}}};
const svg=(p,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON={
  plus:svg('<path d="M5 12h14M12 5v14"/>',2.5), minus:svg('<path d="M5 12h14"/>',2.5),
  edit:svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'),
  cal:svg('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  list:svg('<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>'),
  book:svg('<path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M5 16a4 4 0 0 1 4-4h10"/>'),
  clip:svg('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 13l2 2 4-4"/>'),
  back:svg('<path d="M15 5l-7 7 7 7"/>',2.5), go:svg('<path d="M9 5l7 7-7 7"/>',2.6), x:svg('<path d="M6 6l12 12M18 6L6 18"/>',2.4),
  more:svg('<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',1.4),
  copy:svg('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'),
  up:svg('<path d="M6 15l6-6 6 6"/>',2.4), down:svg('<path d="M6 9l6 6 6-6"/>',2.4),
  search:svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'), check:svg('<path d="M5 12.5l4.5 4.5L19 7"/>',2.6), user:svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',2.4), share:svg('<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/>'), review:svg('<path d="M7 4h10a2 2 0 0 1 2 2v14l-4-3H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M9 9h6M9 13h4"/>'), lock:svg('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'), people:svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.6c2.2.6 3.5 2.4 3.5 5.4"/>'), globe:svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>'), clock:svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'), eye:svg('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'), trash:svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>')
};

/* ---------- dates and times ---------- */
const pad=n=>String(n).padStart(2,"0");
const dayKey=ms=>{const d=new Date(ms);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const todayKey=()=>dayKey(Date.now());
const keyMs=k=>{const p=String(k).split("-").map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1,12).getTime();};
const fmtDay=ms=>ms?new Date(ms).toLocaleDateString("en-CA",{weekday:"short",month:"short",day:"numeric"}):"No date";
const fmtLongDay=ms=>ms?new Date(ms).toLocaleDateString("en-CA",{weekday:"long",month:"long",day:"numeric"}):"No date";
const fmtHM=m=>{m=Math.max(0,Math.round(m||0));return Math.floor(m/60)+"h "+pad(m%60)+"m";};
const fmtLen=m=>{m=Math.round(m||0);const h=Math.floor(m/60),r=m%60;return h?(h+"h"+(r?" "+pad(r)+"m":"")):(r+"m");};
function fmtWhen(ms){if(!ms)return"";const k=dayKey(ms),t=new Date(ms).toLocaleTimeString("en-CA",{hour:"numeric",minute:"2-digit"});
  if(k===todayKey())return"today "+t;const y=new Date();y.setDate(y.getDate()-1);if(k===dayKey(y.getTime()))return"yesterday "+t;return new Date(ms).toLocaleDateString("en-CA",{month:"short",day:"numeric"});}

/* ---------- the signed-in instructor (account and profile live in the sheet) ---------- */
let TOKEN=LS.get("token","");
let ME=null;try{ME=JSON.parse(LS.get("me","null"));}catch(e){ME=null;}
if(!TOKEN||!ME||!ME.last)ME=null;
let OLDPROFILE=null;try{OLDPROFILE=JSON.parse(LS.get("profile","null"));}catch(e){OLDPROFILE=null;} // from before sign-in existed
const signedIn=()=>!!(TOKEN&&ME);
const nameOf=p=>p?(p.title+" "+(p.showFirst?p.first.trim()+" ":"")+p.last.trim()):"";
const who=()=>nameOf(ME)||"An instructor";
const initialsOf=p=>p?((p.first.trim()[0]||"")+(p.last.trim()[0]||"")).toUpperCase():"";

/* ---------- sections, class types, lengths (from the Lists tab) ---------- */
const BUILTIN=[["Warm-up / Physical training","#B85A14"],["Technique / Kihon","#2F5DC0"],["Kata / Kigu","#6A3FB8"],["Kumite","#B8372F"],["Final activity","#157A6E"]];
const SPARE=["#4E6E8E","#8A5A3B","#2E7D32","#AD1457","#5D4037","#00796B","#7B1FA2","#455A64"];
function listRows(name){return S.lists.filter(r=>eqi(r.list,name)&&r.value);}
const okHex=h=>/^#[0-9a-f]{6}$/i.test(String(h||"").trim());
function secColour(name){
  const r=listRows("Section").find(x=>eqi(x.value,name));if(r&&okHex(r.colour))return r.colour.trim();
  const b=BUILTIN.find(x=>eqi(x[0],name));if(b)return b[1];
  let h=0;for(const c of String(name).toLowerCase())h=(h*31+c.charCodeAt(0))>>>0;return SPARE[h%SPARE.length];
}
function tint(hex,amt){const n=parseInt(hex.slice(1),16),mix=c=>Math.round(c+(255-c)*(amt||.86));return"rgb("+mix(n>>16)+","+mix((n>>8)&255)+","+mix(n&255)+")";}
function defaultSections(){const r=listRows("Section").filter(x=>/^y/i.test(x.inNew)).map(x=>x.value);return r.length?r:BUILTIN.map(b=>b[0]);}
function allSections(){const out=[];const add=v=>{if(v&&!out.some(o=>eqi(o,v)))out.push(v);};
  listRows("Section").forEach(r=>add(r.value));if(!out.length)BUILTIN.forEach(b=>add(b[0]));S.exercises.forEach(e=>add(e.section));return out;}
function classTypes(){const t=[...new Set(listRows("Class type").map(r=>r.value))];return t.length?t:["Regular","Kids","Advanced"];}
function classLengths(){const l=[...new Set(listRows("Class length").map(r=>parseInt(r.value,10)).filter(n=>n>0))];return l.length?l:[90,105,120];}
function attendUrl(){const r=listRows("Attendance link")[0];return r&&/^https:\/\//.test(r.value)?r.value:ATTEND_URL;}
const cleanSec=s=>String(s||"").replace(/,/g," /").replace(/\s+/g," ").trim().slice(0,60);

/* ---------- sharing: each plan and exercise is Only me, Everyone, or chosen instructors ---------- */
const isAdmin=()=>!!(ME&&ME.admin);
const canEditR=r=>!!r&&r.canEdit!==false;     // older data without the flag stays editable
const canShareR=r=>!!r&&r.canShare!==false;
const isMineR=r=>!!r&&r.mine!==false;
const personName=id=>{const p=S.people.find(x=>x.id===id);return p?p.name:"";};
const others=()=>S.people.filter(p=>!ME||p.id!==ME.id);
const shareMode=v=>v==="all"?"all":Array.isArray(v)&&v.length?"some":"me";
function shareLabel(v){const m=shareMode(v);if(m==="all")return"Everyone";if(m==="me")return"Only me";
  const n=v.map(personName).filter(Boolean);return n.length<=2?n.join(" and ")||"Chosen people":n.length+" people";}
function shareTag(r){if(!r)return"";const m=shareMode(r.share);
  return`<span class="tag lock">${m==="me"?ICON.lock:m==="all"?ICON.globe:ICON.people}${esc(shareLabel(r.share))}</span>`;}
const ownerTag=r=>r&&!isMineR(r)&&r.ownerId?`<span class="tag by">${ICON.user}${esc(personName(r.ownerId)||"Another instructor")}’s</span>`:"";
const ownFlags=()=>({mine:true,canEdit:true,canShare:true,ownerId:ME?ME.id:""});
function shareField(name,v,what){
  const m=shareMode(v),pick=Array.isArray(v)?v:[],ppl=others();
  const opt=(val,label,sub,ic)=>`<label class="opt"><input type="radio" name="${name}Mode" value="${val}"${m===val?" checked":""}><span><b style="display:flex;align-items:center;gap:6px">${ic}${label}</b><span>${sub}</span></span></label>`;
  return`<fieldset class="field sharebox" data-name="${name}"><legend>Who can see ${what}</legend>
    ${opt("me","Only me","Private. No one else sees it.",ICON.lock)}
    ${opt("all","Everyone","Every instructor can see and copy it.",ICON.globe)}
    ${opt("some","Choose people","Only the instructors you tick.",ICON.people)}
    <div class="ppl"${m==="some"?"":" hidden"}>${ppl.length?ppl.map(p=>`<label class="opt"><input type="checkbox" name="${name}P" value="${esc(p.id)}"${pick.includes(p.id)?" checked":""}><span><b>${esc(p.name)}${p.admin?`<span class="adm">Admin</span>`:""}</b></span></label>`).join(""):`<p class="small" style="margin:0">No other instructors have joined yet.</p>`}</div>
    <p class="small" style="margin:0">They can view and copy it. Admins can also edit it.</p></fieldset>`;}
function readShare(form,name){const fd=new FormData(form);const m=fd.get(name+"Mode")||"me";
  if(m==="all")return"all";if(m==="some"){const ids=fd.getAll(name+"P").map(String);return ids.length?ids:"me";}return"me";}

/* ---------- timeslots: regular classes from the Lists tab ("Mon 18:00-19:30 Kids") ---------- */
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAY_ORDER=[1,2,3,4,5,6,0];
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||"").trim());return m?(+m[1])*60+(+m[2]):null;};
const fromMin=n=>pad(Math.floor(n/60))+":"+pad(n%60);
function parseTime(v){const m=/^(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})$/.exec(String(v||"").trim());if(!m)return null;
  const a=toMin(m[1]),b=toMin(m[2]);return a==null||b==null||b<=a?null:{start:fromMin(a),end:fromMin(b),mins:b-a,key:fromMin(a)+"-"+fromMin(b)};}
const clock12=t=>{const n=toMin(t);if(n==null)return"";const h=Math.floor(n/60),mm=n%60;return((h+11)%12+1)+":"+pad(mm)+(h<12?" a.m.":" p.m.");};
function fmtTime(v){const t=parseTime(v);if(!t)return"";const a=clock12(t.start),b=clock12(t.end);
  return a.slice(-4)===b.slice(-4)?a.slice(0,-5)+"–"+b:a+"–"+b;}
function slots(){return listRows("Timeslot").map(r=>{const m=/^\s*([a-z]{3})[a-z]*\.?\s+(\d{1,2}:\d{2}\s*[-–]\s*\d{1,2}:\d{2})\s*(.*)$/i.exec(r.value);if(!m)return null;
  const day=DAYS.findIndex(d=>d.slice(0,3).toLowerCase()===m[1].toLowerCase());const t=parseTime(m[2]);
  return day<0||!t?null:Object.assign({id:r.id,day,label:m[3].trim()},t);}).filter(Boolean)
  .sort((a,b)=>(DAY_ORDER.indexOf(a.day)-DAY_ORDER.indexOf(b.day))||(toMin(a.start)-toMin(b.start)));}
const slotsOn=k=>{const d=new Date(keyMs(k)).getDay();return slots().filter(x=>x.day===d);};
const dayName=k=>DAYS[new Date(keyMs(k)).getDay()];
const whenLine=p=>fmtLongDay(p.date)+(parseTime(p.time)?" · "+fmtTime(p.time):"");
/* ---------- point-form notes: stored in the sheet as "• point" lines ---------- */
const toPoints=s=>String(s||"").split(/\r?\n/).map(l=>l.replace(/^\s*(?:[•\-*·]\s*)+/,"").trim()).filter(Boolean);
const fromPoints=a=>a.map(p=>String(p).replace(/\r?\n/g," ").trim()).filter(Boolean).map(p=>"• "+p).join("\n");
const ctagHTML=n=>n?`<span class="ctag" title="Created by ${esc(n)}"><span aria-hidden="true" style="display:flex">${ICON.user}</span><span class="vh" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Created by </span>${esc(n)}</span>`:"";
const ptsHTML=s=>{const p=toPoints(s);return p.length?`<ul class="pts">${p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";};
/* Instructions are numbered steps, stored as "1. step" lines */
const toSteps=s=>String(s||"").split(/\r?\n/).map(l=>l.replace(/^\s*(?:[•\-*·]\s*)+/,"").replace(/^\s*(?:step\s*)?\d+\s*[.):-]\s*/i,"").trim()).filter(Boolean);
const fromSteps=a=>a.map(p=>String(p).replace(/\r?\n/g," ").trim()).filter(Boolean).map((p,i)=>(i+1)+". "+p).join("\n");
const stepsHTML=s=>{const p=toSteps(s);return p.length?`<ol class="steps">${p.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:"";};
const stepsText=s=>toSteps(s).map((p,i)=>(i+1)+". "+p).join("\n");
const ptRow=(name,v,ph,num)=>`<div class="ptrow">${num?`<span class="dot num" aria-hidden="true">${num}.</span>`:`<span class="dot" aria-hidden="true">•</span>`}<textarea class="inp pt" rows="1" placeholder="${esc(ph||(num?"Add a step":"Add a point"))}" aria-label="${num?"Step "+num:"Point"}" enterkeyhint="next" autocomplete="off">${esc(v)}</textarea><button type="button" class="iconbtn" data-act="delPoint" aria-label="Remove this ${num?"step":"point"}">${ICON.x}</button></div>`;
function pointsEditor(name,s,ph,numbered){const p=numbered?toSteps(s):toPoints(s);if(!p.length)p.push("");
  return`<div class="points" data-name="${name}"${numbered?' data-num="1"':""}>${p.map((x,i)=>ptRow(name,x,i?"":ph,numbered?i+1:0)).join("")}</div><button type="button" class="btn ghost small" data-act="addPoint" data-name="${name}" style="align-self:flex-start">${ICON.plus}${numbered?"Add a step":"Add a point"}</button>`;}
const fit=el=>{el.style.height="auto";el.style.height=(el.scrollHeight+3)+"px";};
const fitAll=root=>requestAnimationFrame(()=>(root||document).querySelectorAll("textarea.pt").forEach(fit));
function renumber(box){if(!box.dataset.num)return;box.querySelectorAll(".ptrow").forEach((r,i)=>{r.querySelector(".num").textContent=(i+1)+".";r.querySelector("textarea").setAttribute("aria-label","Step "+(i+1));r.querySelector("[data-act=delPoint]").setAttribute("aria-label","Remove step "+(i+1));});}
const readPoints=(form,name)=>[...form.querySelectorAll(`.points[data-name="${name}"] .pt`)].map(i=>i.value.trim()).filter(Boolean);
function addPointAfter(box,row){const tmp=document.createElement("div");tmp.innerHTML=ptRow(box.dataset.name,"","",box.dataset.num?1:0);const nr=tmp.firstElementChild;
  if(row&&row.nextSibling)box.insertBefore(nr,row.nextSibling);else box.appendChild(nr);renumber(box);const ta=nr.querySelector("textarea");fit(ta);ta.focus();return ta;}

/* =====================================================================
   SYNC — the Google Sheet is the source of truth.
   Changes show on screen right away, then go to the sheet in batches.
   ===================================================================== */
let S={plans:[],items:[],exercises:[],lists:[],people:[]};
let ready=false,API=LS.get("api","")||API_URL,lastSync=0;
let queue=[],inflight=false,flushT=null,retryT=null;
let tab="plans",PLAN=LS.get("plan",""),plansFilter=LS.get("pfilter","All"),libFilter="All",libQuery="";
function readLinkParams(){
  try{
    const h=new URLSearchParams((location.hash||"").replace(/^#/,""));const q=new URLSearchParams(location.search);
    const api=h.get("api")||q.get("api"),key=h.get("key")||q.get("key");
    if(api&&/^https:\/\/script\.google\.com\//.test(api)){API=api;LS.set("api",api);}
    if(api||key)history.replaceState(null,"",location.pathname);
  }catch(e){}
}
function callApi(payload){return fetch(API,{method:"POST",body:JSON.stringify(payload),redirect:"follow"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});}
const uid=()=>("x"+Date.now().toString(36)+Math.random().toString(36).slice(2,9));
function applyLocal(o){const arr=S[o.coll];if(o.op==="add"){const rec=Object.assign({id:o.id},o.data);const i=arr.findIndex(d=>d.id===o.id);if(i>=0)arr[i]=rec;else arr.push(rec);}else if(o.op==="update"){const x=arr.find(d=>d.id===o.id);if(x)Object.assign(x,o.data);}else S[o.coll]=arr.filter(d=>d.id!==o.id);}
function enqueue(o){queue.push(o);applyLocal(o);onData();clearTimeout(flushT);flushT=setTimeout(flush,350);}

async function flush(){
  if(!signedIn())return;
  if(inflight){clearTimeout(flushT);flushT=setTimeout(flush,400);return;}
  clearTimeout(retryT);
  const ops=queue.slice();inflight=true;setSync(ops.length?"saving":ready?"loading":"connecting");
  let res;
  try{res=await callApi({token:TOKEN,ops});}catch(e){res={ok:false,error:"network"};}
  inflight=false;
  if(res&&res.ok){
    queue=queue.slice(ops.length);
    if(res.me){ME=res.me;LS.set("me",JSON.stringify(ME));const mb=$("#me");if(mb)mb.textContent=initialsOf(ME);}
    S=normalize(res.state);queue.forEach(applyLocal);
    const first=!ready;ready=true;lastSync=Date.now();setSync("ok");
    if(first){render();loadKata();}else onData();
    if(queue.length){clearTimeout(flushT);flushT=setTimeout(flush,350);}
    return;
  }
  if(res&&res.error==="bad_token"){signOut("Please sign in again.");return;}
  setSync("error");
  if(res&&res.message&&res.error!=="network")toast(res.message);
  else toast(ops.length?"Can't reach the sheet. Your changes will save when you're back online.":"Can't reach the sheet. Tap the status to retry.");
  retryT=setTimeout(flush,15000);
}
function setSync(s){const el=$("#sync");if(!el)return;
  const t={connecting:"Connecting…",loading:"Refreshing…",saving:"Saving…",ok:"Synced "+new Date(lastSync).toLocaleTimeString("en-CA",{hour:"numeric",minute:"2-digit"}),error:"Offline · tap to retry",off:"Not connected"}[s];
  el.textContent=t;el.className="sync"+(s==="error"||s==="off"?" bad":"");}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&signedIn()&&Date.now()-lastSync>15000)flush();});
setInterval(()=>{if(!document.hidden&&signedIn()&&!queue.length&&!inflight&&Date.now()-lastSync>60000)flush();},20000);

function planSections(p){const out=[];const add=v=>{if(v&&!out.some(o=>eqi(o,v)))out.push(v);};
  (p.sections.length?p.sections:defaultSections()).forEach(add);itemsOf(p.id).forEach(i=>add(i.section));return out;}
const isSkipped=(p,sec)=>p.skipped.some(s=>eqi(s,sec));
const secItems=(p,sec)=>itemsOf(p.id).filter(i=>eqi(i.section,sec));
const secTotal=(p,sec)=>isSkipped(p,sec)?0:secItems(p,sec).reduce((a,i)=>a+(i.minutes||0),0);
const planTotal=p=>planSections(p).reduce((a,s)=>a+secTotal(p,s),0);
const planTitle=p=>p.focus||(p.type?p.type+" class":"Class plan");
const isPast=p=>!!p.date&&p.date<keyMs(todayKey())-12*3600e3;
const ptLines=s=>String(s||"").split(/\r?\n/).map(l=>l.replace(/^\s*•\s*/,"").trim()).filter(Boolean);
const ptJoin=a=>a.map(l=>"• "+l).join("\n");
const noteCount=p=>itemsOf(p.id).reduce((a,i)=>a+ptLines(i.live).length,0)+ptLines(p.review).length;
function touchPlan(pid){if(planById(pid))store.update("plans",pid,{editedBy:who(),updated:Date.now()});}
function addItem(p,sec,ex,extra){
  const sections=planSections(p);const data={};
  if(!sections.some(s=>eqi(s,sec)))data.sections=sections.concat(sec);
  if(isSkipped(p,sec))data.skipped=p.skipped.filter(s=>!eqi(s,sec));
  if(Object.keys(data).length)store.update("plans",p.id,data);
  const order=secItems(p,sec).reduce((m,i)=>Math.max(m,i.order||0),0)+1;
  const id=store.add("items",Object.assign({plan:p.id,section:sec,order,name:ex.name,minutes:ex.minutes||10,note:"",exercise:ex.id||"",addedBy:who(),editedBy:""},extra||{}));
  touchPlan(p.id);return id;
}

/* =====================================================================
   NAVIGATION — every screen and panel is a step in the phone's history,
   so the Android back button closes panels and goes back a screen.
   On the home screen, back once shows "Press back again to exit".
   ===================================================================== */
let needGuard=true;
/* A plan is taught from (view), changed (edit) or looked back on after class (review).
   New and copied plans open in edit mode; past classes open in review. */
let planMode="view",editFromView=false;
const stateNow=()=>({t:tab,p:PLAN,m:planMode});
function go(t,plan,mode){
  if(mode)planMode=mode;
  if(plan!==undefined){PLAN=plan;LS.set("plan",PLAN);}
  if(t===tab&&plan===undefined&&!mode){window.scrollTo(0,0);return;}
  tab=t;history.pushState(stateNow(),"");render();window.scrollTo(0,0);
}
document.addEventListener("click",()=>{if(needGuard&&signedIn()){history.pushState(stateNow(),"");needGuard=false;}},true);
window.addEventListener("popstate",e=>{
  const s=e.state||{t:"plans",root:true};
  const hadSheet=!!sheet;
  if(sheet&&!s.sheet)hideSheet();
  if(!sheet&&s.sheet){history.replaceState(Object.assign({},s,{sheet:0}),"");}
  if(s.p!==undefined&&s.p!==PLAN){PLAN=s.p;LS.set("plan",PLAN);}
  const modeChanged=!!s.m&&s.m!==planMode;if(s.m)planMode=s.m;if(planMode!=="edit")editFromView=false;
  const changed=(s.t&&s.t!==tab)||(modeChanged&&tab==="plan");
  if(s.t)tab=s.t;
  if(s.root){needGuard=true;if(!hadSheet)toast("Press back again to exit");}
  if(changed||!hadSheet){render();if(changed)window.scrollTo(0,0);}
});

  const diff=len-tot;

    ${viewOnlyNote(p)}

      <div class="grow"><div class="kicker">${esc(whenLine(p))}</div><h1>${esc(planTitle(p))}</h1>

  </div>`;
}

      return`<article class="card rex${qn.length||mine.length?"":" quiet"}" style="border-left-color:${col}">

/* After class: jump straight to the Kata Tracker for each dojo kata taught, to mark who has improved */
function kataUpdateHTML(p){
  const names=[];itemsOf(p.id).forEach(it=>{if(isSkipped(p,it.section))return;const k=dojoKata(it.name);if(k&&!names.includes(k.name))names.push(k.name);});
  if(!names.length)return"";
  return`<section class="card kupd">
    <h2>Update kata progress</h2>
    <p class="small" style="margin:0;color:var(--ink2)">You taught ${names.length===1?"1 dojo kata":names.length+" dojo kata"}. Mark who’s improved while it’s fresh.</p>
    ${names.map(n=>{const k=dojoKata(n);return`<button type="button" class="kgo" data-act="openKata" data-name="${esc(k.name)}"><span class="grow"><b>${esc(k.name)}</b><span>${esc(kataNeed(k))}</span></span>${ICON.go}</button>`;}).join("")}
  </section>`;
}
function notesText(p){
  const out=[`SKA class review: ${planTitle(p)}`,`${whenLine(p)}${p.type?" · "+p.type:""}`];
  const rv=ptLines(p.review);if(rv.length){out.push("","After class");rv.forEach(x=>out.push("• "+x));}
  planSections(p).filter(s=>!isSkipped(p,s)).forEach(s=>{
    const its=secItems(p,s).filter(it=>qnLines(it.live).length||toPoints(it.note).length);if(!its.length)return;
    out.push("",s);
    its.forEach(it=>{out.push(`${it.name} (${it.minutes} min)`);toPoints(it.note).forEach(x=>out.push("  • Planned: "+x));qnLines(it.live).forEach(x=>{const q=splitQn(x);out.push("  • "+(q.t?q.t+" · ":"")+q.x);});});
  });
  if(out.length===2)out.push("","No notes yet.");
  return out.join("\n");
}

/* Google sign-in (only shown once a client ID is set in the sheet) */
let gisState=0;
function loadGis(){
  if(!GCID||gisState)return;gisState=1;
  const sc=document.createElement("script");sc.src="https://accounts.google.com/gsi/client";sc.async=true;
  sc.onload=()=>{try{google.accounts.id.initialize({client_id:GCID,callback:r=>authCall({auth:"google",credential:r.credential},null),ux_mode:"popup"});gisState=2;mountGis();}catch(e){gisState=0;}};
  sc.onerror=()=>{gisState=0;};
  document.head.appendChild(sc);
}
function mountGis(){
  const el=$("#gbtn");if(!el||gisState!==2)return;
  try{google.accounts.id.renderButton(el,{theme:"outline",size:"large",shape:"pill",text:el.dataset.text||"signin_with",width:Math.min(380,Math.max(240,el.parentElement.clientWidth||300))});}catch(e){}
}
function fetchConfig(){
  callApi({auth:"config"}).then(r=>{if(!r||!r.ok)return;const c=(r.config&&r.config.googleClientId)||"";
    if(c!==GCID){GCID=c;LS.set("gcid",c);if(!signedIn())renderView();}}).catch(()=>{});
}
async function authCall(payload,btn){
  showAuthErr("");
  if(btn){btn.disabled=true;btn.dataset.l=btn.textContent;btn.textContent="One moment…";}
  let res;try{res=await callApi(payload);}catch(e){res={ok:false,error:"network",message:"Can’t reach the dojo sheet. Check your connection and try again."};}
  if(btn&&document.contains(btn)){btn.disabled=false;btn.textContent=btn.dataset.l;}
  if(res&&res.ok){
    TOKEN=res.token;LS.set("token",TOKEN);ME=res.me;LS.set("me",JSON.stringify(ME));if(ME.email)LS.set("email",ME.email);
    S=normalize(res.state);queue=[];ready=true;lastSync=Date.now();gPending=null;draft=null;authMsg="";authMode="signin";
    tab="plans";history.replaceState({t:"plans",p:PLAN,root:true},"");needGuard=true;render();setSync("ok");window.scrollTo(0,0);
    toast("Welcome, "+who());return;}
  if(res&&res.error==="need_signup"){gPending={credential:payload.credential,email:res.email};
    draft=Object.assign({title:"Mr.",showFirst:false},OLDPROFILE||{},{first:res.first||((OLDPROFILE||{}).first)||"",last:res.last||((OLDPROFILE||{}).last)||""});
    authMode="gsignup";authMsg="";renderView();window.scrollTo(0,0);return;}
  if(res&&res.error==="reset_needed"){authMode="reset";authMsg=res.message;renderView();return;}
  showAuthErr((res&&res.message)||"Something went wrong. Try again.");
}
function signOut(msg){
  TOKEN="";ME=null;LS.set("token","");LS.set("me","null");S={plans:[],items:[],exercises:[],lists:[]};ready=false;queue=[];
  authMode="signin";authMsg=msg||"";draft=null;tab="plans";history.replaceState({t:"plans",p:PLAN,root:true},"");
  try{if(window.google&&google.accounts)google.accounts.id.disableAutoSelect();}catch(e){}
  render();window.scrollTo(0,0);
}

let sheet=null,lastFocus=null;
function openSheet(s){hideToast();if(!sheet){lastFocus=document.activeElement;history.pushState(Object.assign(stateNow(),{sheet:1}),"");}
  sheet=s;renderSheet();$("#sheetWrap").hidden=false;document.body.style.overflow="hidden";
  setTimeout(()=>{if($("#sheetWrap").contains(document.activeElement))return;const f=$("#sheetBody [data-focus]")||$("#sheetBody button, #sheetBody input, #sheetBody a");if(f)f.focus({preventScroll:true});},40);}
function swapSheet(s){sheet=s;renderSheet();$("#sheetBox").scrollTop=0;}
function closeSheet(){if(history.state&&history.state.sheet)history.back();else hideSheet();}
function hideSheet(){sheet=null;$("#sheetWrap").hidden=true;document.body.style.overflow="";if(lastFocus&&document.contains(lastFocus))try{lastFocus.focus({preventScroll:true});}catch(_){}}
function finishSheet(t,plan,mode){hideSheet();if(plan!==undefined){PLAN=plan;LS.set("plan",PLAN);}if(mode)planMode=mode;tab=t;history.replaceState(stateNow(),"");render();window.scrollTo(0,0);}
const closeBtn=`<button type="button" class="iconbtn round" data-act="closeSheet" aria-label="Close">${ICON.x}</button>`;
const sheetHead=(title,sub)=>`<div class="grab"></div><div class="sh"><div class="grow">${sub||""}<h2 id="sheetTitle">${title}</h2></div>${closeBtn}</div>`;
const secChip=s=>{const c=secColour(s);return`<span class="tag" style="color:${c};background:${tint(c)};margin-bottom:6px">${esc(s)}</span>`;};

function renderSheet(){
  const box=$("#sheetBox"),body=$("#sheetBody");const s=sheet;if(!s)return;

  let h="";
  switch(s.type){

      h=`<div class="ring" aria-hidden="true">${ICON.clip}</div><h2 id="sheetTitle">Open attendance?</h2>
        <p>This opens Muster Hall in your browser. Your plan stays saved, and your phone’s back button brings you back here.</p>
        <div class="btnrow"><button type="button" class="btn outline" data-act="closeSheet" data-focus>Stay here</button><a class="btn primary" href="${esc(attendUrl())}" target="_blank" rel="noopener" data-act="attendGo">Open Muster Hall</a></div>`;break;
    case"confirm":
      h=`<div class="ring" aria-hidden="true">${ICON.trash}</div><h2 id="sheetTitle">${esc(s.title)}</h2><p>${esc(s.text)}</p>
        <div class="btnrow"><button type="button" class="btn outline" data-act="closeSheet" data-focus>Keep</button><button type="button" class="btn primary" data-act="${s.act}" data-id="${esc(s.id)}">${esc(s.yes)}</button></div>`;break;
    case"notesText":{const p=planById(PLAN);if(!p)break;

    case"share":{const r=s.coll==="plans"?planById(s.id):exById(s.id);if(!r)break;
      h=sheetHead("Who can see it",`<div class="small">${esc(s.coll==="plans"?planTitle(r):r.name)}</div>`)+`<form id="shareForm" data-coll="${s.coll}" data-id="${esc(r.id)}">${shareField("sh",r.share,s.coll==="plans"?"this plan":"this exercise")}<button class="btn primary block" type="submit">Save</button></form>`;break;}
    case"slots":h=sheetSlots();break;

    case"pick":h=sheetPick(s);break;
    case"ex":h=sheetEx(s);break;
    case"newPlan":h=sheetNewPlan();break;
    case"copyPick":h=sheetCopyPick();break;
    case"copy":h=sheetCopy(s);break;
    case"planMenu":{const p=planById(PLAN);if(!p){h=sheetHead("Plan");break;}
      const ed=canEditR(p);
      h=sheetHead(esc(planTitle(p)),`<div class="small">${esc(whenLine(p))}</div>`)+`<div class="menu">
        ${!ed?`<button type="button" class="btn primary block" data-act="copyPlan" data-id="${esc(p.id)}" data-focus>${ICON.copy}Copy to a new date</button>`:planMode==="edit"?`<button type="button" class="btn primary block" data-act="savePlan" data-focus>${ICON.check}Save plan</button>`:`<button type="button" class="btn primary block" data-act="editPlan" data-focus>${ICON.edit}Edit plan</button>`}
        ${planMode==="review"?`<button type="button" class="btn ghost block" data-act="setMode" data-m="view">${ICON.list}Teaching view</button>`:planMode==="view"?`<button type="button" class="btn ghost block" data-act="setMode" data-m="review">${ICON.review}Review class</button>`:""}
        ${ed?`<button type="button" class="btn ghost block" data-act="planInfo">${ICON.cal}Change date, time or focus</button>`:""}
        ${canShareR(p)?`<button type="button" class="btn ghost block" data-act="sharePlan">${ICON.people}Who can see it: ${esc(shareLabel(p.share))}</button>`:`<p class="small" style="margin:0 0 10px;text-align:center">${esc(personName(p.ownerId)||"Another instructor")}’s plan · shared with ${esc(shareMode(p.share)==="all"?"everyone":"you")}</p>`}
        ${ed?`<button type="button" class="btn ghost block" data-act="copyPlan" data-id="${esc(p.id)}">${ICON.copy}Copy to a new date</button>
        <button type="button" class="btn danger block" data-act="askDelPlan">${ICON.trash}Delete this plan</button>`:""}</div>`;break;}
    case"planInfo":{const p=planById(PLAN);if(!p)break;
      h=sheetHead("Date, time and focus")+`<form id="infoForm" class="planform">
        <div class="field"><label for="iDate">Date</label><input class="inp" id="iDate" name="date" type="date" value="${p.date?dayKey(p.date):todayKey()}" required data-focus></div>
        ${timeField(p.date?dayKey(p.date):todayKey(),p.time)}
        <div class="field"><label for="iFocus">Focus</label><input class="inp" id="iFocus" name="focus" type="text" maxlength="60" placeholder="e.g. Kumite focus" value="${esc(p.focus)}"></div>
        <button class="btn primary block" type="submit">Save</button></form>`;break;}
    case"length":{const p=planById(PLAN);if(!p)break;const l=p.length||105;
      h=sheetHead("Class length")+`<form id="lengthForm"><div class="row" style="gap:10px">
        <div class="field grow"><label for="lH">Hours</label><input class="inp" id="lH" name="h" type="number" inputmode="numeric" min="0" max="5" value="${Math.floor(l/60)}" data-focus></div>
        <div class="field grow"><label for="lM">Minutes</label><input class="inp" id="lM" name="m" type="number" inputmode="numeric" min="0" max="59" step="5" value="${l%60}"></div></div>
        <button class="btn primary block" type="submit">Set length</button></form>`;break;}
    case"addSection":{const p=planById(PLAN);if(!p)break;const have=planSections(p);
      const opts=allSections().filter(s=>!have.some(x=>eqi(x,s)));
      h=sheetHead("Add a section")+(opts.length?`<span class="label">Sections you’ve used before</span>`+opts.map(o=>{const c=secColour(o);return`<button type="button" class="pickrow" data-act="addSec" data-v="${esc(o)}"><span class="badge" style="background:${c};width:14px;height:14px"></span><span class="nm">${esc(o)}</span>${ICON.plus}</button>`;}).join(""):"")+
        `<form id="secForm" class="mt"><div class="field"><label for="secName">New section</label><input class="inp" id="secName" name="name" type="text" maxlength="60" placeholder="e.g. Self-defence" required></div>
        <button class="btn primary block" type="submit">Add section</button></form>
        <p class="small" style="margin:12px 0 0">Skipped sections stay in the plan with a Restore button.</p>`;break;}
  }
  body.innerHTML=h;
  fitAll(body);
}

function sheetItem(s){
  const it=itemById(s.id);if(!it)return sheetHead("Not found")+`<p>This exercise was removed.</p>`;
  const lib=exById(it.exercise),p=planById(it.plan);
  const secs=p?secItems(p,it.section):[];const idx=secs.findIndex(x=>x.id===it.id);
  const quick=[5,10,15,20,30].map(n=>`<button type="button" class="chip" data-act="setMin" data-v="${n}">${n}</button>`).join("");
  return sheetHead(esc(it.name),secChip(it.section)+"<br>")+
  `<p class="small" style="margin:-6px 0 16px">${it.addedBy?`Added by ${esc(it.addedBy)}`:""}${lib?`${it.addedBy?" · ":""}library time ${lib.minutes} min`:`${it.addedBy?" · ":""}not in the library`}</p>
  ${lib&&(lib.description||toPoints(lib.notes).length)?`<details class="libref"><summary>Instructions and notes from the library</summary>${lib.addedBy?`<p style="margin:8px 0 0"><span class="tag creator">${ICON.user}${esc(lib.addedBy)}</span></p>`:""}${lib.description?`<h3>Instructions</h3>${stepsHTML(lib.description)}`:""}${toPoints(lib.notes).length?`<h3>Notes</h3>${ptsHTML(lib.notes)}`:""}</details>`:""}
  <form id="itemForm" data-id="${esc(it.id)}">
    <div class="field"><label for="fMin">Minutes for this class</label>
      <div class="minbig"><button type="button" data-act="stepMin" data-d="-5" aria-label="5 minutes less">${ICON.minus}</button>
      <input id="fMin" name="minutes" type="number" inputmode="numeric" min="1" max="240" value="${it.minutes}" required><span class="unit">min</span>
      <button type="button" data-act="stepMin" data-d="5" aria-label="5 minutes more">${ICON.plus}</button></div>
      <div class="qgrid" role="group" aria-label="Quick times">${quick}</div></div>
    <fieldset class="field"><legend>Notes for this class</legend>${pointsEditor("note",it.note,"e.g. Heian Shodan turns only")}</fieldset>
    ${lib&&canEditR(lib)?`<fieldset class="field"><legend>Save a new time to…</legend>
      <label class="opt"><input type="radio" name="scope" value="class" checked><span><b>This class only</b><span>The library keeps ${lib.minutes} min</span></span></label>
      <label class="opt"><input type="radio" name="scope" value="lib"><span><b>Also update the library</b><span>Future plans start at the new time</span></span></label></fieldset>`:""}
    <div class="field"><span class="label" style="margin:0">Order in ${esc(it.section)}</span><div class="btnrow">
      <button type="button" class="btn ghost small" data-act="moveItem" data-d="-1"${idx<=0?" disabled":""}>${ICON.up}Move up</button>
      <button type="button" class="btn ghost small" data-act="moveItem" data-d="1"${idx<0||idx>=secs.length-1?" disabled":""}>${ICON.down}Move down</button></div>
      <p class="msg" id="moveMsg" aria-live="polite"></p></div>
    <div class="btnrow"><button type="button" class="btn danger" data-act="removeItem">Remove</button><button type="submit" class="btn primary" style="flex:2">Save</button></div>
    <p class="small" style="text-align:center;margin:10px 0 0">Changes show as “${esc(who())} changed to …”</p>
  </form>`;
}
function kataPickHTML(s){
  if(!KATA)return`<p class="small" style="margin:8px 4px 14px">Loading the dojo’s kata from the Kata Tracker…</p>`;
  const p=planById(s.plan);if(!p)return"";
  const col=secColour(s.sec);
  const have=new Set(secItems(p,s.sec).map(i=>i.name.toLowerCase()));
  const q=(s.q||"").trim().toLowerCase();
  const cat=s.cat||"All",bf=s.belt||"All";
  const list=KATA.filter(k=>(cat==="All"||kataCat(k)===cat)&&(bf==="All"||kataBeltIdx(k)===BELTS.indexOf(bf))&&(!q||(k.name+" "+(k.meaning||"")).toLowerCase().includes(q)));
  if(!list.length)return`<p class="small" style="margin:8px 4px 14px">Nothing matches.</p>`;
  // Same order as the Kata Tracker's Kata tab: Solo, then Multi-person, then Weapon; each by the belt it's learned at.
  let html="";
  kataCats(list).forEach(c=>{
    const inCat=list.filter(k=>kataCat(k)===c);
    html+=`<div class="kcat"><span>${esc(c)} kata</span><span class="kcount">${inCat.length}</span></div>`;
    BELTS.map((_,i)=>i).concat([-1]).forEach(i=>{
      const grp=inCat.filter(k=>kataBeltIdx(k)===i);if(!grp.length)return;
      html+=`<div class="kbelt"><span class="kdot" style="background:${i>=0?BELT_COL[BELTS[i]]:"#CCC"}"></span>${i>=0?esc(BELTS[i])+" belt":"No belt set"}</div>`;
      html+=grp.map(k=>{const on=have.has(k.name.toLowerCase()),rank=kataRank(k);
        const sub=[k.meaning,rank>=0&&rank!==i?BELTS[rank]+" belt kata":""].filter(Boolean).join(" · ");
        return`<button type="button" class="pickrow" data-act="addKata" data-name="${esc(k.name)}" aria-pressed="${on}"${on?` style="border-color:${col};background:${tint(col,.93)}"`:""}>
        <span class="nm">${esc(k.name)}${sub?`<span class="kmeta">${esc(sub)}</span>`:""}<span class="kneed">${esc(kataNeed(k))}${k.learning?" · "+k.learning+" learning":""}</span></span>
        ${on?`<span class="ok">In plan</span>`:`<span class="m" style="color:${col}">10 min</span>`}${on?ICON.check:ICON.plus}</button>`;}).join("");
    });
  });
  return html;
}
function pickListHTML(s){
  if(s.mode==="kata")return kataPickHTML(s);
  const p=planById(s.plan);if(!p)return"";
  const q=(s.q||"").trim().toLowerCase();
  const inPlan=new Set(secItems(p,s.sec).map(i=>i.exercise).filter(Boolean));
  const list=S.exercises.filter(e=>(s.all||eqi(e.section,s.sec))&&(!q||(e.name+" "+e.description+" "+e.notes).toLowerCase().includes(q))).sort((a,b)=>a.name.localeCompare(b.name));
  if(!list.length)return`<p class="small" style="margin:8px 4px 14px">${S.exercises.some(e=>eqi(e.section,s.sec))||s.all?"Nothing matches.":"No "+esc(s.sec)+" exercises in the library yet."}</p>`;
  return list.map(e=>{const c=secColour(e.section);return`<button type="button" class="pickrow${e.addedBy?" cornered":""}" data-act="addEx" data-id="${esc(e.id)}">${ctagHTML(e.addedBy)}
    <span class="nm">${esc(e.name)}${s.all&&!eqi(e.section,s.sec)?`<br><span class="tag" style="color:${c};background:${tint(c)};margin-top:4px">${esc(e.section)}</span>`:""}</span>
    ${inPlan.has(e.id)?`<span class="ok">In plan</span>`:""}<span class="m" style="color:${c}">${e.minutes} min</span>${ICON.plus}</button>`;}).join("");
}
function sheetPick(s){
  const kataSec=isKataSec(s.sec),col=secColour(s.sec);
  if(kataSec)loadKata();
  const tabs=kataSec?`<div class="segtabs" role="tablist" aria-label="What to add">${[["ex","Exercises"],["kata","Dojo kata"]].map(([m,l])=>{const on=(s.mode||"ex")===m;
    return`<button type="button" role="tab" aria-selected="${on}" data-act="pickMode" data-m="${m}"${on?` style="background:${col};color:#fff"`:""}>${l}</button>`;}).join("")}</div>`:"";
  if(kataSec&&s.mode==="kata"){
    // Filters match the Kata Tracker: kata type, then belt (the belt it's learned at, else its rank).
    const cats=["All"].concat(KATA?kataCats(KATA):KATA_CATS),beltsHere=["All"].concat(KATA?BELTS.filter((b,i)=>KATA.some(k=>kataBeltIdx(k)===i)):[]);
    const chipOn=on=>on?` style="background:${col};border-color:${col};color:#fff"`:"";
    const catChips=cats.map(c=>{const on=(s.cat||"All")===c;return`<button type="button" class="chip sm" data-act="pickCat" data-v="${esc(c)}" aria-pressed="${on}"${chipOn(on)}>${esc(c)}</button>`;}).join("");
    const beltChips=beltsHere.map(b=>{const on=(s.belt||"All")===b;return`<button type="button" class="chip sm" data-act="pickBelt" data-v="${esc(b)}" aria-pressed="${on}"${chipOn(on)}>${b==="All"?"All belts":`<span class="kdot" style="background:${BELT_COL[b]}"></span>${esc(b)}`}</button>`;}).join("");
    const chips=`<div class="chips" role="group" aria-label="Kata type" style="margin-bottom:8px">${catChips}</div><div class="chips kbelts" role="group" aria-label="Belt">${beltChips}</div>`;
    return sheetHead("Add to "+esc(s.sec),`<div class="small">From the dojo’s kata list</div>`)+tabs+
    `<div class="search" style="margin-bottom:10px">${ICON.search}<input id="pickSearch" type="search" placeholder="Search kata" aria-label="Search the dojo’s kata" value="${esc(s.q||"")}" autocomplete="off"></div>
    ${chips}
    <p class="small" style="margin:10px 4px 4px">Grouped like the Kata Tracker: solo, multi-person, then weapon kata, each by belt.</p>
    <div id="pickList">${pickListHTML(s)}</div>
    <div class="btnrow" style="margin-top:6px"><button type="button" class="btn primary" data-act="closeSheet">Done</button></div>`;
  }
  return sheetHead("Add to "+esc(s.sec),`<div class="small">From the library</div>`)+tabs+
  `<div class="search" style="margin-bottom:10px">${ICON.search}<input id="pickSearch" type="search" placeholder="Search" aria-label="Search the library" value="${esc(s.q||"")}" autocomplete="off"></div>
  <div class="chips" style="margin-bottom:12px"><button type="button" class="chip sm" data-act="pickAll" aria-pressed="${!!s.all}">Show all sections</button></div>
  <div id="pickList">${pickListHTML(s)}</div>
  <div class="btnrow" style="margin-top:6px"><button type="button" class="btn outline" data-act="newExFor">${ICON.plus}New exercise</button><button type="button" class="btn primary" data-act="closeSheet">Done</button></div>`;
}
function sheetEx(s){
  const e=s.id?exById(s.id):null;
  const sec=e?e.section:(s.sec||allSections()[0]||"");
  const secs=allSections();if(sec&&!secs.some(x=>eqi(x,sec)))secs.push(sec);
  const names=[...new Set([who()].concat(S.exercises.map(x=>x.addedBy),S.exercises.map(x=>x.editedBy),S.items.map(x=>x.addedBy)).filter(Boolean))];
  return sheetHead(e?"Edit exercise":"New exercise",e?(e.editedBy?`<div class="small">Last edited by ${esc(e.editedBy)}</div>`:""):(s.addTo?`<div class="small">Also adds it to this class</div>`:""))+
  `<form id="exForm">
    <div class="field"><label for="eName">Name</label><input class="inp" id="eName" name="name" type="text" maxlength="80" required value="${esc(e?e.name:"")}" data-focus></div>
    <div class="field"><label for="eSec">Section</label><select class="inp" id="eSec" name="section">${secs.map(x=>`<option${eqi(x,sec)?" selected":""}>${esc(x)}</option>`).join("")}</select></div>
    <div class="field"><label for="eBy">Created by</label><input class="inp" id="eBy" name="creator" type="text" maxlength="60" list="eByList" autocomplete="off" value="${esc(e?(e.addedBy||""):who())}"><datalist id="eByList">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist><span class="small">Who came up with this exercise. Shown as a label in the library.</span></div>
    <div class="field"><label for="eMin">Usual minutes</label><input class="inp" id="eMin" name="minutes" type="number" inputmode="numeric" min="1" max="240" required value="${e?e.minutes:10}"></div>
    <fieldset class="field"><legend>Instructions</legend>${pointsEditor("steps",e?e.description:"","e.g. Line up in rows",true)}</fieldset>
    <fieldset class="field"><legend>Notes</legend>${pointsEditor("notes",e?e.notes:"","e.g. Watch for dropped hands")}</fieldset>
    ${!e||canShareR(e)?shareField("sh",e?e.share:"me","this exercise"):`<p class="small">${esc(personName(e.ownerId)||"Another instructor")}’s exercise · ${esc(shareLabel(e.share))}</p>`}
    <div class="btnrow">${e?`<button type="button" class="btn danger" data-act="askDelEx" data-id="${esc(e.id)}">Delete</button>`:(s.back?`<button type="button" class="btn outline" data-act="backToPick">Back</button>`:"")}<button type="submit" class="btn primary" style="flex:2">${e?"Save":s.addTo?"Save and add":"Save"}</button></div>
  </form>`;
}
function typeLenFields(type,len){
  const types=classTypes(),lens=classLengths(),other=!!len&&!lens.includes(len);
  return`<fieldset class="field"><legend>Class type</legend><div class="chips">${types.map(t=>`<label class="chip rchip"><input type="radio" name="type" value="${esc(t)}"${eqi(t,type)?" checked":""} required>${esc(t)}</label>`).join("")}</div></fieldset>
  <fieldset class="field lenbox"><legend>Class length</legend><div class="chips">${lens.map(l=>`<label class="chip rchip"><input type="radio" name="length" value="${l}"${l===len?" checked":""}>${fmtLen(l)}</label>`).join("")}<label class="chip rchip"><input type="radio" name="length" value="other"${other?" checked":""}>Other</label></div>
    <div class="row lenother" style="gap:10px"${other?"":" hidden"}><div class="field grow" style="margin:0"><label for="oH">Hours</label><input class="inp" id="oH" name="oh" type="number" inputmode="numeric" min="0" max="9" value="${other?Math.floor(len/60):1}"></div>

function addSection(p,name){

document.addEventListener("input",e=>{
  const id=e.target.id;
  if(e.target.classList&&e.target.classList.contains("pt")){
    const t=e.target;
    if(/\r?\n/.test(t.value)){ // Enter on some phone keyboards, or pasted lines: one point per line
      const parts=t.value.split(/\r?\n/);t.value=parts.shift();fit(t);
      let row=t.closest(".ptrow");const box=row.parentElement;let last=t;
      parts.forEach(p=>{last=addPointAfter(box,row);last.value=p;fit(last);row=last.closest(".ptrow");});
      last.focus();last.setSelectionRange(last.value.length,last.value.length);
    } else fit(t);
    return;
  }
  if(id==="libSearch"){libQuery=e.target.value;$("#exList").innerHTML=exListHTML();}
  if(id==="pickSearch"&&sheet&&sheet.type==="pick"){sheet.q=e.target.value;$("#pickList").innerHTML=pickListHTML(sheet);}
  if(e.target.form&&/^(profile|signup)Form$/.test(e.target.form.id)&&draft&&e.target.name!=="code"&&e.target.form.first){const f=e.target.form;draft.first=f.first.value;draft.last=f.last.value;const r=f.querySelector("input[name=title]:checked");if(r)draft.title=r.value;updateProfilePreview();}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.form&&t.form.classList.contains("planform"))planFormChange(t.form,t);
  if(t.name&&/Mode$/.test(t.name)){const box=t.closest(".sharebox");if(box)box.querySelector(".ppl").hidden=t.value!=="some";}
  if(e.target.form&&/^(profile|signup)Form$/.test(e.target.form.id)&&draft&&e.target.name==="title"){draft.title=e.target.value;updateProfilePreview();}
});
document.addEventListener("submit",e=>{
  const f=e.target,id=f.id;e.preventDefault();
  const fd=new FormData(f);const val=k=>String(fd.get(k)||"").trim();
  const profileData=()=>({title:val("title")||"Mr.",first:val("first"),last:val("last"),showFirst:!!(draft&&draft.showFirst)});
  if(id==="signinForm"){authCall({auth:"login",email:val("email"),password:String(fd.get("password")||"")},f.querySelector("[type=submit]"));return;}
  if(id==="resetForm"){authCall({auth:"reset",email:val("email"),code:val("code"),password:String(fd.get("password")||"")},f.querySelector("[type=submit]"));return;}
  if(id==="signupForm"){const p=profileData();if(!p.first||!p.last){showAuthErr("Please enter your first and last name.");return;}
    if(authMode==="gsignup"&&gPending)authCall({auth:"google",credential:gPending.credential,code:val("code"),profile:p},f.querySelector("[type=submit]"));
    else authCall({auth:"signup",code:val("code"),email:val("email"),password:String(fd.get("password")||""),profile:p},f.querySelector("[type=submit]"));
    return;}
  if(id==="profileForm"){
    const p=profileData();if(!p.first||!p.last){$("#pMsg").textContent="Please enter your first and last name.";return;}
    const btn=f.querySelector("[type=submit]");btn.disabled=true;btn.textContent="Saving…";
    callApi({token:TOKEN,ops:[],profile:p}).then(res=>{
      if(res&&res.ok){ME=res.me;LS.set("me",JSON.stringify(ME));S=normalize(res.state);queue.forEach(applyLocal);draft=null;toast("Saved. You’re shown as "+who());history.back();return;}
      if(res&&res.error==="bad_token"){signOut("Please sign in again.");return;}
      btn.disabled=false;btn.textContent="Save";$("#pMsg").textContent=(res&&res.message)||"Couldn’t save. Try again.";
    }).catch(()=>{btn.disabled=false;btn.textContent="Save";$("#pMsg").textContent="Can’t reach the dojo sheet. Check your connection and try again.";});
    return;}
  if(id==="pwForm"){
    const btn=f.querySelector("[type=submit]");btn.disabled=true;
    callApi({token:TOKEN,ops:[],password:{current:String(fd.get("current")||""),next:String(fd.get("next")||"")}}).then(res=>{
      btn.disabled=false;
      if(res&&res.ok){ME=res.me;LS.set("me",JSON.stringify(ME));f.reset();$("#pwMsg").textContent="Password saved.";return;}
      if(res&&res.error==="bad_token"){signOut("Please sign in again.");return;}
      $("#pwMsg").textContent=(res&&res.message)||"Couldn’t save. Try again.";
    }).catch(()=>{btn.disabled=false;$("#pwMsg").textContent="Can’t reach the dojo sheet. Check your connection and try again.";});
    return;}
  if(f.classList.contains("rform")){const p=planById(f.dataset.id);const inp=f.querySelector("input");const txt=(inp.value||"").replace(/\s+/g," ").trim();if(!p||!txt)return;
    const lines=ptLines(p.review);lines.push(txt);inp.value="";store.update("plans",p.id,{review:ptJoin(lines)});
    setTimeout(()=>{const ni=document.getElementById("rv-"+p.id);if(ni)ni.focus({preventScroll:true});},0);return;}
  if(f.classList.contains("qform")){const it=itemById(f.dataset.id);const inp=f.querySelector("input");const txt=(inp.value||"").replace(/\s+/g," ").trim();if(!it||!txt)return;
    const time=new Date().toLocaleTimeString("en-CA",{hour:"numeric",minute:"2-digit"});
    const lines=qnLines(it.live);lines.push(time+" · "+txt);inp.value="";
    store.update("items",it.id,{live:lines.map(l=>"• "+l).join("\n")});
    setTimeout(()=>{const ni=document.getElementById("qn-"+it.id);if(ni)ni.focus({preventScroll:true});},0);return;}
  if(id==="itemForm"){const it=itemById(f.dataset.id);if(!it){closeSheet();return;}
    const m=Math.max(1,Math.min(240,parseInt(val("minutes"),10)||it.minutes||1));const data={note:fromPoints(readPoints(f,"note"))};
    if(m!==it.minutes){data.minutes=m;data.editedBy=who();}
    store.update("items",it.id,data);
    const lib=exById(it.exercise);if(val("scope")==="lib"&&lib&&lib.minutes!==m)store.update("exercises",lib.id,{minutes:m,editedBy:who()});
    touchPlan(it.plan);closeSheet();toast("Saved");return;}
  if(id==="exForm"){const s=sheet;if(!s)return;
    const data={name:val("name").slice(0,80),section:val("section"),minutes:Math.max(1,Math.min(240,parseInt(val("minutes"),10)||10)),description:fromSteps(readPoints(f,"steps")),notes:fromPoints(readPoints(f,"notes"))};
    if(!data.name)return;
    const creator=val("creator").slice(0,60)||who();
    if(f.querySelector(".sharebox"))data.share=readShare(f,"sh");
    if(s.id){const ex=exById(s.id);if(ex&&!canShareR(ex))delete data.share;store.update("exercises",s.id,Object.assign(data,{addedBy:creator,editedBy:who()}));closeSheet();toast("Saved to the library");return;}
    const exId=store.add("exercises",Object.assign(data,{addedBy:creator,editedBy:""}));
    if(s.addTo){const pp=planById(s.addTo);if(pp)addItem(pp,data.section,Object.assign({id:exId},data));
      if(s.back){swapSheet(Object.assign({},s.back,{sec:s.back.sec}));toast(`Added ${data.name}`);return;}}
    closeSheet();toast(`Added ${data.name} to the library`);return;}
  if(id==="newPlanForm"){
    const time=readTime(fd);if(String(fd.get("slot"))==="custom"&&!time){toast("Set a start and end time, with the end after the start.");return;}
    saveSlotIf(fd,time);
    const pid=store.add("plans",{date:keyMs(val("date")||todayKey()),time,focus:val("focus").slice(0,60),type:val("type")||classTypes()[0],length:readLength(fd,105),
      sections:defaultSections(),skipped:[],share:readShare(f,"sh"),addedBy:who(),editedBy:who(),updated:Date.now()});
    editFromView=false;finishSheet("plan",pid,"edit");toast("Plan created. Tap Save plan when you’re done.");return;}
  if(id==="copyForm"){const src=planById(f.dataset.id);if(!src){closeSheet();return;}
    const time=readTime(fd);if(String(fd.get("slot"))==="custom"&&!time){toast("Set a start and end time, with the end after the start.");return;}
    saveSlotIf(fd,time);
    const pid=store.add("plans",{date:keyMs(val("date")||todayKey()),time,focus:val("focus").slice(0,60),type:val("type")||src.type,length:readLength(fd,src.length||105),
      sections:planSections(src),skipped:src.skipped.slice(),share:readShare(f,"sh"),addedBy:who(),editedBy:who(),updated:Date.now()});
    itemsOf(src.id).forEach(i=>store.add("items",{plan:pid,section:i.section,order:i.order,name:i.name,minutes:i.minutes,note:i.note,exercise:i.exercise,addedBy:i.addedBy,editedBy:i.editedBy}));
    editFromView=false;finishSheet("plan",pid,"edit");toast("Copied. Make any changes, then tap Save plan.");return;}
  if(id==="infoForm"){const p=planById(PLAN);if(!p){closeSheet();return;}
    const time=readTime(fd);if(String(fd.get("slot"))==="custom"&&!time){toast("Set a start and end time, with the end after the start.");return;}
    saveSlotIf(fd,time);
    const data={date:keyMs(val("date")||todayKey()),time,focus:val("focus").slice(0,60),editedBy:who(),updated:Date.now()};
    const tm=parseTime(time);if(tm&&time!==p.time)data.length=tm.mins;
    store.update("plans",p.id,data);closeSheet();return;}
  if(id==="shareForm"){const coll=f.dataset.coll;const r=coll==="plans"?planById(f.dataset.id):exById(f.dataset.id);if(!r||!canShareR(r)){closeSheet();return;}
    const sh=readShare(f,"sh");store.update(coll,r.id,{share:sh});closeSheet();toast("Now visible to: "+shareLabel(sh));return;}
  if(id==="slotForm"){if(!isAdmin())return;const d=+val("day");const a=toMin(val("tStart")),b=toMin(val("tEnd"));
    if(a==null||b==null||b<=a){$("#slotMsg").textContent="The end time has to be after the start.";return;}
    store.add("lists",{list:"Timeslot",value:(DAYS[d].slice(0,3)+" "+fromMin(a)+"-"+fromMin(b)+" "+val("label")).trim(),colour:"",inNew:""});renderSheet();toast("Timeslot added");return;}
  if(id==="lengthForm"){const p=planById(PLAN);const l=(parseInt(val("h"),10)||0)*60+(parseInt(val("m"),10)||0);
    if(p&&l>0)store.update("plans",p.id,{length:Math.min(600,l),editedBy:who(),updated:Date.now()});closeSheet();return;}
  if(id==="secForm"){const p=planById(PLAN);if(p)addSection(p,val("name"));closeSheet();return;}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sheet)closeSheet();
  const t=e.target;if(!t.classList||!t.classList.contains("pt"))return;
  const row=t.closest(".ptrow"),box=row.parentElement;
  if(e.key==="Enter"){e.preventDefault();if(t.value.trim())addPointAfter(box,row);}
  if(e.key==="Backspace"&&!t.value&&box.children.length>1){e.preventDefault();const prev=row.previousElementSibling||row.nextElementSibling;row.remove();renumber(box);const pi=prev.querySelector("textarea");pi.focus();pi.setSelectionRange(pi.value.length,pi.value.length);}
});

function boot(){
  readLinkParams();
  if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  history.replaceState({t:"plans",p:PLAN,root:true},"");
  render();
  if(signedIn())flush();
  fetchConfig();
  if(signedIn())loadKata();
  // Coming back from the Kata Tracker: refresh the "still need it" counts
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&signedIn())loadKata();});
}
boot();
})();
</script>
</body>
